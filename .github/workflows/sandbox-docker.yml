name: Sandbox Docker Self Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  sandbox-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AG_SANDBOX_DOCKER_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Build sandbox image and run self-check
        run: ./scripts/build_sandbox_image.sh --self-check

      - name: Run docker sandbox integration tests
        run: python -m pytest -q src/backend/tests/test_sandbox_docker.py
