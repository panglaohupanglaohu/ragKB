name: CI Gate

# P0-9: 合并门禁 —— lint + typecheck + build + test + docs 签名 五项检查。
# lint/typecheck/build/test 为硬门禁（失败阻断合并）；
# docs 签名对历史积压做信息性检查（不阻断存量债务，新增 plan/todos 请自查）。

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: Lint (compileall)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Lint backend
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Typecheck backend
        run: npm run typecheck

  build:
    name: Build (vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install node deps
        run: npm ci || npm install
      - name: Vite build
        run: npm run build

  test:
    name: Test (pytest + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install node deps
        run: npm ci || npm install
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
      - name: Provide CI rtk shim
        run: |
          cat <<'EOF' | sudo tee /usr/local/bin/rtk >/dev/null
          #!/usr/bin/env bash
          exec "$@"
          EOF
          sudo chmod +x /usr/local/bin/rtk
      - name: Frontend tests (vitest)
        run: npm run test:frontend
      - name: Backend tests (pytest)
        run: npm run test:backend
      - name: Root tests (pytest)
        run: npm run test:root

  docs-signoff:
    name: Docs sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 存量 plan/todos 未全部补签名；此检查可见但不阻断历史债务。
    # 新增/修改的 plan/todos 请本地跑 `node scripts/check-docs-signoff.cjs --strict` 自查。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check docs sign-off
        run: node scripts/check-docs-signoff.cjs --strict
