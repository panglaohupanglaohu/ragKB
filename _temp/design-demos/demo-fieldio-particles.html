<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Demo B — Field.io 粒子生成艺术</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020204;overflow:hidden;font-family:'Noto Sans SC',sans-serif}
canvas{display:block;width:100vw;height:100vh}
.label{position:fixed;bottom:28px;left:28px;color:rgba(200,210,220,0.4);font-size:11px;letter-spacing:2px;z-index:10}
.label b{color:rgba(200,210,220,0.7);font-weight:600}
.badge{position:fixed;top:24px;left:24px;font-size:10px;color:rgba(200,180,140,0.4);
  border:1px solid rgba(200,180,140,0.15);padding:4px 12px;letter-spacing:1.5px;z-index:10}
</style>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="badge">方向 B · FIELD.IO 粒子生成艺术</div>
<div class="label"><b>技能萃取</b> — 从混沌到涌现</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setClearColor(0x020204);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 12, 22);
const ctrl = new OrbitControls(camera, canvas);
ctrl.enableDamping = true; ctrl.dampingFactor = 0.05;
ctrl.target.set(0, 2, 0); ctrl.maxPolarAngle = Math.PI / 2.1;

// Minimal lighting — particles self-illuminate
scene.add(new THREE.AmbientLight(0x111122, 0.05));

// === PARTICLE FIELD (3000 particles) ===
const TOTAL = 3000;
const positions = new Float32Array(TOTAL * 3);
const colors = new Float32Array(TOTAL * 3);
const velocities = new Float32Array(TOTAL * 3);
const phases = new Float32Array(TOTAL); // lifecycle phase
const types = new Uint8Array(TOTAL); // 0=free, 1=vessel, 2=nerve, 3=condensed

// Attractors (skill nodes as gravity wells)
const attractors = [
  { pos: new THREE.Vector3(-5, 1.5, -3), color: new THREE.Color(0x55CC77), mass: 2, type: 'atomic' },
  { pos: new THREE.Vector3(4, 1, -5), color: new THREE.Color(0x55CC77), mass: 1.8, type: 'atomic' },
  { pos: new THREE.Vector3(6, 2, 3), color: new THREE.Color(0x55CC77), mass: 1.5, type: 'atomic' },
  { pos: new THREE.Vector3(-7, 2.5, 5), color: new THREE.Color(0xDDAA44), mass: 3, type: 'trait' },
  { pos: new THREE.Vector3(0, 3, 8), color: new THREE.Color(0xDDAA44), mass: 2.5, type: 'trait' },
  { pos: new THREE.Vector3(-3, 2, -9), color: new THREE.Color(0x9966DD), mass: 4, type: 'composite' },
];

// Central human attractor
const humanPos = new THREE.Vector3(0, 2.5, 0);

// Initialize particles in chaotic cloud
for (let i = 0; i < TOTAL; i++) {
  // Start scattered
  positions[i * 3] = (Math.random() - 0.5) * 30;
  positions[i * 3 + 1] = Math.random() * 10 + 0.5;
  positions[i * 3 + 2] = (Math.random() - 0.5) * 30;

  velocities[i * 3] = (Math.random() - 0.5) * 0.02;
  velocities[i * 3 + 1] = (Math.random() - 0.5) * 0.01;
  velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.02;

  phases[i] = Math.random();

  // Color: start as dim white/gray, will shift towards attractor colors
  const brightness = 0.15 + Math.random() * 0.15;
  colors[i * 3] = brightness;
  colors[i * 3 + 1] = brightness;
  colors[i * 3 + 2] = brightness * 1.2;
  types[i] = 0;
}

const particleGeo = new THREE.BufferGeometry();
particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const particleMat = new THREE.PointsMaterial({
  size: 0.04, vertexColors: true, transparent: true, opacity: 0.85,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
});
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// === TRAIL LINES (particle trajectories forming network topology) ===
const TRAIL_PARTICLES = 400; // subset with visible trails
const trailLength = 8;
const trailPositions = new Float32Array(TRAIL_PARTICLES * trailLength * 3);
const trailColors = new Float32Array(TRAIL_PARTICLES * trailLength * 3);
const trailHistory = [];

for (let i = 0; i < TRAIL_PARTICLES; i++) {
  const hist = [];
  for (let j = 0; j < trailLength; j++) {
    hist.push(new THREE.Vector3(positions[i*3], positions[i*3+1], positions[i*3+2]));
    const idx = (i * trailLength + j) * 3;
    trailPositions[idx] = positions[i*3];
    trailPositions[idx+1] = positions[i*3+1];
    trailPositions[idx+2] = positions[i*3+2];
    const fade = 1 - j / trailLength;
    trailColors[idx] = 0.3 * fade;
    trailColors[idx+1] = 0.3 * fade;
    trailColors[idx+2] = 0.4 * fade;
  }
  trailHistory.push(hist);
}

const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
trailGeo.setAttribute('color', new THREE.BufferAttribute(trailColors, 3));

const trailMat = new THREE.LineBasicMaterial({
  vertexColors: true, transparent: true, opacity: 0.3,
  blending: THREE.AdditiveBlending, depthWrite: false
});
// We'll draw lines as segments
const trailIndices = [];
for (let i = 0; i < TRAIL_PARTICLES; i++) {
  for (let j = 0; j < trailLength - 1; j++) {
    trailIndices.push(i * trailLength + j, i * trailLength + j + 1);
  }
}
trailGeo.setIndex(trailIndices);
const trails = new THREE.LineSegments(trailGeo, trailMat);
scene.add(trails);

// === ATTRACTOR VISUALIZATION (glowing stars) ===
attractors.forEach(a => {
  // Core point
  const coreMat = new THREE.MeshBasicMaterial({
    color: a.color, transparent: true, opacity: 0.5
  });
  const coreGeo = a.type === 'atomic' ? new THREE.IcosahedronGeometry(0.15, 0) :
                  a.type === 'trait' ? new THREE.OctahedronGeometry(0.2, 0) :
                  new THREE.DodecahedronGeometry(0.25, 0);
  const core = new THREE.Mesh(coreGeo, coreMat);
  core.position.copy(a.pos);
  scene.add(core);
  a._mesh = core;

  // Glow sphere
  const glowMat = new THREE.MeshBasicMaterial({
    color: a.color, transparent: true, opacity: 0.04
  });
  const glow = new THREE.Mesh(new THREE.SphereGeometry(a.mass * 0.6, 16, 16), glowMat);
  glow.position.copy(a.pos);
  scene.add(glow);
  a._glow = glow;

  // Point light
  const pl = new THREE.PointLight(a.color, 0.15, a.mass * 3);
  pl.position.copy(a.pos);
  scene.add(pl);
  a._light = pl;
});

// === HUMAN FIGURE (Particle constellation) ===
// Represented as a cluster of brighter particles rather than a solid mesh
const humanLight = new THREE.PointLight(0xFFDDBB, 0.4, 8);
humanLight.position.copy(humanPos);
scene.add(humanLight);

const humanGlow = new THREE.Mesh(
  new THREE.SphereGeometry(0.6, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0xFFDDBB, transparent: true, opacity: 0.04 })
);
humanGlow.position.copy(humanPos);
scene.add(humanGlow);

// === FORCE FIELD SIMULATION ===
const tmpVec = new THREE.Vector3();
const clock = new THREE.Clock();

function simulate(dt) {
  const t = clock.elapsedTime;
  const posArr = particleGeo.attributes.position.array;
  const colArr = particleGeo.attributes.color.array;

  for (let i = 0; i < TOTAL; i++) {
    const ix = i * 3, iy = i * 3 + 1, iz = i * 3 + 2;
    let px = posArr[ix], py = posArr[iy], pz = posArr[iz];
    let vx = velocities[ix], vy = velocities[iy], vz = velocities[iz];

    // Gravity toward attractors
    let closestDist = Infinity, closestIdx = -1;
    for (let a = 0; a < attractors.length; a++) {
      const attr = attractors[a];
      tmpVec.set(attr.pos.x - px, attr.pos.y - py, attr.pos.z - pz);
      const dist = tmpVec.length();
      const force = (attr.mass * 0.0003) / (dist * dist + 0.5);
      tmpVec.normalize().multiplyScalar(force);
      vx += tmpVec.x; vy += tmpVec.y; vz += tmpVec.z;
      if (dist < closestDist) { closestDist = dist; closestIdx = a; }
    }

    // Gentle pull toward human center
    tmpVec.set(humanPos.x - px, humanPos.y - py, humanPos.z - pz);
    const hDist = tmpVec.length();
    const hForce = 0.00015 / (hDist + 1);
    tmpVec.normalize().multiplyScalar(hForce);
    vx += tmpVec.x; vy += tmpVec.y; vz += tmpVec.z;

    // Orbital tangent force (swirl)
    const tangentX = -(pz - humanPos.z) * 0.00008;
    const tangentZ = (px - humanPos.x) * 0.00008;
    vx += tangentX; vz += tangentZ;

    // Floor repulsion
    if (py < 0.1) vy += 0.003;

    // Damping
    vx *= 0.997; vy *= 0.997; vz *= 0.997;

    // Update
    posArr[ix] = px + vx; posArr[iy] = py + vy; posArr[iz] = pz + vz;
    velocities[ix] = vx; velocities[iy] = vy; velocities[iz] = vz;

    // Color shift toward closest attractor
    if (closestIdx >= 0 && closestDist < 5) {
      const attr = attractors[closestIdx];
      const blend = Math.max(0, 1 - closestDist / 5) * 0.02;
      colArr[ix] += (attr.color.r - colArr[ix]) * blend;
      colArr[iy] += (attr.color.g - colArr[iy]) * blend;
      colArr[iz] += (attr.color.b - colArr[iz]) * blend;
    }

    // Trail update for subset
    if (i < TRAIL_PARTICLES) {
      const hist = trailHistory[i];
      hist.unshift(new THREE.Vector3(posArr[ix], posArr[iy], posArr[iz]));
      if (hist.length > trailLength) hist.pop();
      const tPosArr = trailGeo.attributes.position.array;
      const tColArr = trailGeo.attributes.color.array;
      for (let j = 0; j < trailLength; j++) {
        const h = hist[j] || hist[hist.length - 1];
        const ti = (i * trailLength + j) * 3;
        tPosArr[ti] = h.x; tPosArr[ti+1] = h.y; tPosArr[ti+2] = h.z;
        const fade = (1 - j / trailLength) * 0.25;
        tColArr[ti] = colArr[ix] * fade;
        tColArr[ti+1] = colArr[iy] * fade;
        tColArr[ti+2] = colArr[iz] * fade;
      }
    }
  }

  particleGeo.attributes.position.needsUpdate = true;
  particleGeo.attributes.color.needsUpdate = true;
  trailGeo.attributes.position.needsUpdate = true;
  trailGeo.attributes.color.needsUpdate = true;
}

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  ctrl.update();
  simulate(0.016);

  // Attractor pulsation
  attractors.forEach((a, i) => {
    const pulse = Math.sin(t * 1.5 + i * 1.2) * 0.5 + 0.5;
    a._mesh.rotation.y = t * 0.3 + i;
    a._mesh.rotation.x = Math.sin(t * 0.4 + i) * 0.2;
    a._mesh.material.opacity = 0.3 + pulse * 0.3;
    a._glow.material.opacity = 0.02 + pulse * 0.03;
    a._light.intensity = 0.1 + pulse * 0.15;
  });

  // Human pulse
  humanLight.intensity = 0.3 + Math.sin(t * 2) * 0.15;
  humanGlow.material.opacity = 0.03 + Math.sin(t * 1.5) * 0.015;

  renderer.render(scene, camera);
}

function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', onResize); onResize();
animate();
</script>
</body>
</html>
