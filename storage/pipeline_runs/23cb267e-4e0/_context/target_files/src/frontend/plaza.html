<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能体广场 — AgentsGroup2026</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* ── 安藤忠雄式清水混凝土 · Tadao Ando Exposed Concrete ─────── */
/* Light + Concrete + Geometry · 极度克制 · 结构即美 */
:root{
  --concrete:#B8B0A8;--concrete-light:#C8C2BA;--concrete-pale:#D4CEC6;
  --concrete-dark:#8A8480;--concrete-deep:#6A6460;
  --surface:#C8C0B8;--surface-light:#D8D2CA;
  --shadow:#4A4644;--shadow-soft:#6A646040;
  --slit-light:#E8DCC0;--slit-glow:#D4A050;
  --bronze:#8B7355;--bronze-light:#A89878;
  --ink:#2A2625;--text:#3A3635;--muted:#7A7470;--dim:#9A9490;
  --panel:#CBC4BC;--panel2:#BEB8B0;
  --line:#A8A29A;--line-light:#B8B2AA;
  --font-serif:'Noto Serif SC',serif;
  --font-sans:'Noto Sans SC',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-sans);background:var(--concrete);color:var(--text);height:100vh;overflow:hidden}
/* Concrete formwork texture */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 120px,#00000008 120px,#00000008 121px),
             repeating-linear-gradient(90deg,transparent,transparent 80px,#00000005 80px,#00000005 81px);
  mix-blend-mode:multiply}

/* ── Top bar: concrete beam ── */
.top-bar{position:fixed;top:0;left:0;right:0;z-index:100;height:44px;
  background:#C8C0B8F0;backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:16px;
  box-shadow:0 1px 0 #00000010}
.top-bar .logo{font-family:var(--font-sans);font-size:13px;font-weight:600;color:var(--ink);letter-spacing:4px;text-transform:uppercase}
.top-bar .nav-links{display:flex;gap:4px;margin-left:auto}
.top-bar .nav-links a{color:var(--muted);text-decoration:none;font-size:11px;padding:6px 14px;
  transition:all 0.3s;letter-spacing:0.5px}
.top-bar .nav-links a:hover{color:var(--ink)}
.top-bar .nav-links a.active{color:var(--slit-glow);border-bottom:1px solid var(--slit-glow)}

/* ── Layout ── */
.layout{display:grid;grid-template-columns:220px 1fr 300px;height:calc(100vh - 44px);margin-top:44px}

/* ── Left: concrete wall panel ── */
.left{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.left .hd{padding:20px 16px 14px;border-bottom:1px solid var(--line)}
.left .hd h2{font-family:var(--font-sans);font-size:12px;font-weight:600;color:var(--ink);letter-spacing:3px;text-transform:uppercase}
.left .hd .sub{font-size:9px;color:var(--dim);margin-top:4px;letter-spacing:1px;font-family:var(--font-mono)}
.left .list{flex:1;overflow-y:auto;padding:6px 8px}
.plaza-card{padding:12px 14px;margin-bottom:4px;background:transparent;border:1px solid transparent;
  cursor:pointer;transition:all 0.3s}
.plaza-card:hover{background:#00000008;border-color:var(--line-light)}
.plaza-card.active{border-left:2px solid var(--slit-glow);background:#D4A05008;padding-left:12px}
.plaza-card .nm{font-weight:400;font-size:12px;color:var(--text);letter-spacing:0.3px}
.plaza-card .mt{font-size:9px;color:var(--dim);display:flex;gap:10px;margin-top:4px;font-family:var(--font-mono)}
.btn-new{margin:10px 8px;padding:9px 14px;background:transparent;border:1px solid var(--line);
  color:var(--muted);font-size:10px;cursor:pointer;letter-spacing:1px;transition:all 0.3s;font-family:var(--font-mono)}
.btn-new:hover{border-color:var(--slit-glow);color:var(--slit-glow)}

/* ── Center: Three.js ── */
.center{position:relative;overflow:hidden;background:var(--concrete)}
#three-canvas{width:100%;height:100%;display:block}
.speech-bubble{position:absolute;max-width:240px;padding:10px 14px;
  background:#C8C0B8E8;backdrop-filter:blur(12px);
  border-left:2px solid var(--slit-glow);
  font-size:11px;line-height:1.7;color:var(--text);
  pointer-events:none;opacity:0;transform:translateY(8px);
  transition:opacity 0.4s ease,transform 0.4s ease;z-index:50;
  box-shadow:0 4px 20px #00000018}
.speech-bubble.show{opacity:1;transform:translateY(0)}
.speech-bubble .sb-name{font-weight:600;font-size:10px;color:var(--slit-glow);margin-bottom:3px;letter-spacing:1px;text-transform:uppercase}
.speech-bubble .sb-text{white-space:pre-wrap;word-break:break-word}

/* ── Right panel ── */
.right{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.section{padding:14px 16px;border-bottom:1px solid var(--line)}
.sec-title{font-family:var(--font-mono);font-size:9px;font-weight:400;color:var(--dim);
  margin-bottom:8px;letter-spacing:2px;text-transform:uppercase}
.disc-item{padding:10px 12px;margin-bottom:3px;background:transparent;border:1px solid transparent;
  cursor:pointer;font-size:11px;transition:all 0.3s}
.disc-item:hover{border-color:var(--line-light)}
.disc-item.active{border-left:2px solid var(--slit-glow);background:#D4A05008;padding-left:10px}
.disc-item .tp{font-weight:400;margin-bottom:3px;color:var(--text)}
.disc-item .dm{font-size:9px;color:var(--dim);display:flex;gap:8px;font-family:var(--font-mono)}
.msg-log{flex:1;overflow-y:auto;padding:10px 14px;font-size:11px;min-height:35vh}
.msg-entry{margin-bottom:10px;padding:8px 10px;border-left:2px solid var(--line);
  background:#00000006}
.msg-entry .me-name{font-weight:600;color:var(--concrete-deep);font-size:10px;letter-spacing:0.5px;text-transform:uppercase}
.msg-entry .me-text{color:var(--text);line-height:1.8;margin-top:3px}
.msg-entry.mod{border-left-color:var(--slit-glow)}
.msg-entry.mod .me-name{color:var(--bronze)}
.round-sep{text-align:center;color:var(--dim);font-size:9px;margin:14px 0;position:relative;letter-spacing:3px;font-family:var(--font-mono)}
.round-sep::before,.round-sep::after{content:'';position:absolute;top:50%;width:28%;height:1px;background:var(--line)}
.round-sep::before{left:0}.round-sep::after{right:0}
#plan-panel{max-height:35vh;overflow-y:auto;border-top:1px solid var(--line);flex-shrink:0}
.plan-card{margin:10px 14px;padding:12px 14px;background:#00000008;border-left:2px solid var(--slit-glow)}
.plan-card h4{font-size:11px;font-weight:600;color:var(--slit-glow);margin-bottom:8px;letter-spacing:2px;text-transform:uppercase}
.plan-card .plan-text{font-size:11px;line-height:1.8;color:var(--text)}
.plan-card .plan-text strong{color:var(--ink)}
.plan-card .plan-text code{background:#00000008;padding:1px 4px;font-size:10px;font-family:var(--font-mono)}
.plan-card .assign-row{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.plan-card select{padding:5px 8px;background:var(--surface-light);border:1px solid var(--line);color:var(--text);font-size:10px}
.ctrl-bar{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn-start{padding:7px 20px;background:var(--slit-glow);border:none;
  color:#FFF;font-size:11px;font-weight:600;cursor:pointer;
  letter-spacing:1px;transition:all 0.3s;text-transform:uppercase}
.btn-start:hover{background:#C09040}
.btn-start:disabled{opacity:0.25;cursor:not-allowed}
.btn{padding:5px 12px;background:transparent;border:1px solid var(--line);color:var(--muted);
  font-size:10px;cursor:pointer;transition:all 0.3s}
.btn:hover{border-color:var(--muted);color:var(--text)}
.ctrl-bar .status-text{margin-left:auto;font-size:9px;color:var(--dim);font-family:var(--font-mono)}
.pill{display:inline-block;padding:2px 8px;font-size:9px;letter-spacing:0.5px;font-family:var(--font-mono)}
.pill-open{color:var(--muted)}
.pill-in_progress{color:var(--slit-glow)}
.pill-summarizing{color:var(--bronze)}
.pill-closed{color:var(--dim)}

/* ── Modal: concrete slab ── */
.modal-overlay{position:fixed;inset:0;z-index:200;background:#2A262580;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface-light);border:1px solid var(--line);padding:28px;width:420px;max-width:90vw;
  box-shadow:0 20px 60px #00000030}
.modal h3{font-size:12px;font-weight:600;margin-bottom:20px;color:var(--ink);letter-spacing:2px;text-transform:uppercase}
.fg{margin-bottom:12px}
.fl{display:block;font-size:9px;color:var(--dim);margin-bottom:3px;letter-spacing:1px;text-transform:uppercase;font-family:var(--font-mono)}
.fi{width:100%;padding:8px 10px;background:var(--concrete-pale);border:1px solid var(--line);color:var(--text);
  font-size:11px;font-family:var(--font-sans);outline:none;transition:border 0.3s}
.fi:focus{border-color:var(--slit-glow)}
textarea.fi{resize:vertical;min-height:45px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn-primary{padding:7px 20px;background:var(--slit-glow);border:none;
  color:#FFF;font-size:11px;font-weight:600;cursor:pointer;letter-spacing:1px;text-transform:uppercase}
.btn-cancel{padding:7px 16px;background:transparent;border:1px solid var(--line);color:var(--dim);
  font-size:11px;cursor:pointer}
.toast-box{position:fixed;top:56px;right:16px;z-index:300}
.toast{padding:8px 16px;margin-bottom:4px;background:#C8C0B8F0;backdrop-filter:blur(8px);
  border-left:2px solid var(--slit-glow);font-size:11px;color:var(--text);
  box-shadow:0 4px 16px #00000015;animation:tin 0.4s ease}
@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:0}
</style>
</head>
<body>

<div class="top-bar">
  <span class="logo">议事广场</span>
  <div class="nav-links">
    <a href="/agent-team-config.html">团队</a>
    <a href="/datacenter-ratchet-evolution.html">演进</a>
    <a href="/plaza.html" class="active">广场</a>
  </div>
</div>

<div class="layout">
  <div class="left">
    <div class="hd"><h2>广场</h2><div class="sub">CONCRETE ARENA</div></div>
    <div class="list" id="plaza-list"><div style="padding:20px;color:var(--dim);text-align:center;font-size:10px">加载中…</div></div>
    <button class="btn-new" onclick="openCreatePlaza()">+ CREATE</button>
  </div>

  <div class="center" id="arena-container">
    <canvas id="three-canvas"></canvas>
  </div>

  <div class="right">
    <div class="section" id="disc-section">
      <div class="sec-title">DISCUSSIONS</div>
      <div id="disc-list"><div style="color:var(--dim);font-size:10px">先选择广场</div></div>
      <button class="btn" style="width:100%;margin-top:8px" onclick="openCreateDisc()">+ 新建讨论</button>
    </div>
    <div class="msg-log" id="msg-log">
      <div style="text-align:center;padding:40px 0;color:var(--dim);font-size:10px;letter-spacing:1px;font-family:var(--font-mono)">
        SELECT PLAZA · CREATE DISCUSSION<br>全员自动入座
      </div>
    </div>
    <div id="plan-panel" style="display:none"></div>
    <div class="ctrl-bar">
      <button class="btn-start" id="btn-start" onclick="startDiscussion()" disabled>开始</button>
      <button class="btn" onclick="openCreateDisc()">+ 话题</button>
      <span class="status-text" id="status-text"></span>
    </div>
  </div>
</div>

<div class="toast-box" id="toasts"></div>

<div class="modal-overlay" id="m-plaza" onclick="if(event.target===this)closeM(this.id)">
  <div class="modal"><h3>创建广场</h3>
    <div class="fg"><label class="fl">NAME</label><input class="fi" id="inp-pn" placeholder="如: 技术决策广场"></div>
    <div class="fg"><label class="fl">DESCRIPTION</label><textarea class="fi" id="inp-pd" placeholder="广场用途"></textarea></div>
    <div class="modal-actions"><button class="btn-cancel" onclick="closeM('m-plaza')">取消</button><button class="btn-primary" onclick="doCreatePlaza()">创建</button></div>
  </div>
</div>

<div class="modal-overlay" id="m-disc" onclick="if(event.target===this)closeM(this.id)">
  <div class="modal"><h3>创建讨论</h3>
    <div class="fg"><label class="fl">TOPIC</label><input class="fi" id="inp-dt" placeholder="核心问题"></div>
    <div class="fg"><label class="fl">GOAL</label><input class="fi" id="inp-dg" placeholder="期望达成"></div>
    <div class="fg"><label class="fl">CONTEXT</label><textarea class="fi" id="inp-dd" placeholder="背景与产出"></textarea></div>
    <div class="fg"><label class="fl">MODERATOR</label><select class="fi" id="inp-dm"></select></div>
    <div class="fg"><label class="fl">ROUNDS</label><select class="fi" id="inp-dr">
      <option value="1">1 轮</option><option value="2" selected>2 轮</option><option value="3">3 轮</option><option value="5">5 轮</option>
    </select></div>
    <div class="modal-actions"><button class="btn-cancel" onclick="closeM('m-disc')">取消</button><button class="btn-primary" onclick="doCreateDisc()">创建</button></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ═══════════ GLOBALS ═══════════ */
const API = '/api/v1/agent-config';
let curPlaza = null, curDisc = null, curDiscData = null, evtSrc = null;
let allTeams = [], allParticipants = [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function toast(m) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = m;
  $('toasts').appendChild(t); setTimeout(() => t.remove(), 3500);
}
function openM(id) { $(id).classList.add('open') }
function closeM(id) { $(id).classList.remove('open') }
window.openM = openM; window.closeM = closeM;
async function api(url, opts) {
  try { const r = await fetch(url, opts); if (!r.ok) return null; return await r.json(); }
  catch (e) { console.error(url, e); return null; }
}

/* ── Team colors: muted tones on concrete ── */
const teamColors = {
  build_system: 0x6A8E6A,
  ai_coding: 0x6A7A9E,
  energy_first_principle: 0xB08840
};
const teamCSS = {
  build_system: '#6A8E6A',
  ai_coding: '#6A7A9E',
  energy_first_principle: '#B08840'
};
const teamNames = {
  build_system: 'BUILD',
  ai_coding: '编程',
  energy_first_principle: '能源'
};
function tColor(tid) { return teamColors[tid] || 0x7A7470; }

/* ═══════════ THREE.JS — 安藤忠雄清水混凝土议事厅 ═══════════ */
const canvas = $('three-canvas');
const container = $('arena-container');
const scene = new THREE.Scene();

// Concrete gray background
const bgColor = new THREE.Color(0xB8B0A8);
scene.background = bgColor;
scene.fog = new THREE.FogExp2(0xB8B0A8, 0.006);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
camera.position.set(0, 26, 24);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setClearColor(0xB8B0A8);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 10;
controls.maxDistance = 55;
controls.maxPolarAngle = Math.PI / 2.1;
controls.target.set(0, 1, 0);

/* ── Lights: Ando-style dramatic — 光の教会 ── */
scene.add(new THREE.AmbientLight(0xE0D8D0, 0.35));

// Main: strong top-front skylight
const mainLight = new THREE.DirectionalLight(0xFFF4E0, 1.2);
mainLight.position.set(3, 30, 5);
mainLight.castShadow = true;
mainLight.shadow.mapSize.set(2048, 2048);
mainLight.shadow.camera.near = 1; mainLight.shadow.camera.far = 60;
mainLight.shadow.camera.left = -25; mainLight.shadow.camera.right = 25;
mainLight.shadow.camera.top = 25; mainLight.shadow.camera.bottom = -25;
mainLight.shadow.bias = -0.001;
mainLight.shadow.normalBias = 0.02;
scene.add(mainLight);

scene.add(new THREE.HemisphereLight(0xD0C8C0, 0x908880, 0.25));

// Slit light — Ando's cross of light
const slitLight = new THREE.SpotLight(0xFFE8C0, 0.6, 50, Math.PI / 8, 0.5, 1);
slitLight.position.set(-15, 20, 0);
slitLight.target.position.set(0, 0, 0);
slitLight.castShadow = true;
scene.add(slitLight);
scene.add(slitLight.target);

/* ── Material factories ── */
function concreteMat(color, rough = 0.92) {
  return new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: 0.0 });
}
function bronzeMat(color = 0x8B7355, rough = 0.35) {
  return new THREE.MeshStandardMaterial({
    color, roughness: rough, metalness: 0.6,
    emissive: new THREE.Color(color).multiplyScalar(0.05), emissiveIntensity: 0.3
  });
}

/* ── Ground ── */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(35, 64),
  concreteMat(0xA09890)
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ── Tiered Arena: Ando stepped concrete ── */
const tierDefs = [
  { innerR: 14, outerR: 19, y: 2.4, stepH: 1.0, color: 0x9A9490 },
  { innerR: 9,  outerR: 13, y: 1.5, stepH: 0.8, color: 0xA09A94 },
  { innerR: 5,  outerR: 8,  y: 0.7, stepH: 0.6, color: 0xA8A29C },
];
tierDefs.forEach(tier => {
  // Ring surface
  const top = new THREE.Mesh(
    new THREE.RingGeometry(tier.innerR, tier.outerR, 96),
    concreteMat(tier.color, 0.88)
  );
  top.rotation.x = -Math.PI / 2; top.position.y = tier.y;
  top.receiveShadow = true;
  scene.add(top);

  // Inner wall
  const wall = new THREE.Mesh(
    new THREE.CylinderGeometry(tier.innerR, tier.innerR, tier.stepH, 96, 1, true),
    concreteMat(new THREE.Color(tier.color).multiplyScalar(0.85), 0.90)
  );
  wall.position.y = tier.y - tier.stepH / 2;
  wall.receiveShadow = true; wall.castShadow = true;
  scene.add(wall);

  // Outer wall
  const outer = new THREE.Mesh(
    new THREE.CylinderGeometry(tier.outerR, tier.outerR, tier.y, 96, 1, true),
    concreteMat(new THREE.Color(tier.color).multiplyScalar(0.9), 0.90)
  );
  outer.position.y = tier.y / 2;
  scene.add(outer);

  // Formwork seam
  const seam = new THREE.Mesh(
    new THREE.RingGeometry(tier.innerR - 0.01, tier.outerR + 0.01, 96),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.04, side: THREE.DoubleSide })
  );
  seam.rotation.x = -Math.PI / 2; seam.position.y = tier.y + 0.005;
  scene.add(seam);
});

// Center arena floor — polished concrete
const centerFloor = new THREE.Mesh(
  new THREE.CircleGeometry(4.5, 64),
  concreteMat(0xB0AAA2, 0.75)
);
centerFloor.rotation.x = -Math.PI / 2; centerFloor.position.y = 0.01;
centerFloor.receiveShadow = true;
scene.add(centerFloor);

// Formwork grid
for (let i = -4; i <= 4; i++) {
  const lineMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.06, side: THREE.DoubleSide });
  const hLine = new THREE.Mesh(new THREE.PlaneGeometry(9, 0.015), lineMat);
  hLine.rotation.x = -Math.PI / 2; hLine.position.set(0, 0.015, i);
  scene.add(hLine);
  const vLine = new THREE.Mesh(new THREE.PlaneGeometry(9, 0.015), lineMat.clone());
  vLine.rotation.x = -Math.PI / 2; vLine.rotation.z = Math.PI / 2;
  vLine.position.set(i, 0.015, 0);
  scene.add(vLine);
}

/* ── Outer wall: massive concrete perimeter ── */
const wallRadius = 20, wallHeight = 4, wallSegments = 60;
for (let i = 0; i < wallSegments; i++) {
  const angle = (i / wallSegments) * Math.PI * 2;
  if ([0, 15, 30, 45].some(e => Math.abs(i - e) < 2)) continue;
  const w = (2 * Math.PI * wallRadius) / wallSegments;
  const shade = 0.88 + Math.random() * 0.12;
  const panel = new THREE.Mesh(
    new THREE.BoxGeometry(w * 0.92, wallHeight, 0.5),
    concreteMat(new THREE.Color(0x8A8480).multiplyScalar(shade), 0.93)
  );
  panel.position.set(Math.cos(angle) * wallRadius, wallHeight / 2, Math.sin(angle) * wallRadius);
  panel.rotation.y = -angle + Math.PI / 2;
  panel.castShadow = true; panel.receiveShadow = true;

/* ═══════════ AGENT FIGURE — 发光轮廓 ═══════════ */
const agentMeshes = new Map();
const sceneAgents = [];

function makeTextCanvas(text, color) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 256, 64);
  ctx.font = '600 22px "Noto Sans SC", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = color || '#2A2625';
  ctx.fillText(text, 128, 32);
  return c;
}

function createAgentFigure(name, hexColor, isChairman = false) {
  const group = new THREE.Group();
  const col = new THREE.Color(hexColor);
  const scale = isChairman ? 1.3 : 1.0;

  const outlineMat = new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.55, side: THREE.DoubleSide });
  const glowMat = new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.10, side: THREE.DoubleSide });

  // Head ring
  const headR = 0.34 * scale, headTube = 0.035 * scale;
  const head = new THREE.Mesh(new THREE.TorusGeometry(headR, headTube, 12, 32), outlineMat);
  head.position.y = 2.0 * scale;
  group.add(head);

  // Head glow
  group.add(Object.assign(new THREE.Mesh(new THREE.TorusGeometry(headR, headTube * 4, 12, 32), glowMat), { position: head.position.clone() }));

  // Body U-arc
  const pts = [];
  for (let i = 0; i <= 32; i++) {
    const t = i / 32, a = Math.PI * t;
    pts.push(new THREE.Vector3(-Math.cos(a) * 0.48 * scale, (1.25 - Math.sin(a) * 0.65) * scale, 0));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  group.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 32, 0.035 * scale, 8, false), outlineMat));
  group.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 32, 0.12 * scale, 8, false), glowMat));

  // Light
  const pLight = new THREE.PointLight(col, isChairman ? 0.5 : 0.2, isChairman ? 6 : 3);
  pLight.position.y = 1.4 * scale;
  group.add(pLight);

  // Ground ring
  const glowRing = new THREE.Mesh(
    new THREE.RingGeometry(0.35 * scale, 0.55 * scale, 32),
    new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.08, side: THREE.DoubleSide })
  );
  glowRing.rotation.x = -Math.PI / 2; glowRing.position.y = 0.01;
  group.add(glowRing);
  group.userData.glowRing = glowRing;

  // Name
  const tex = new THREE.CanvasTexture(makeTextCanvas(name, '#2A2625'));
  tex.minFilter = THREE.LinearFilter;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sprite.position.y = (isChairman ? 2.9 : 2.6) * scale;
  sprite.scale.set(1.8, 0.45, 1);
  group.add(sprite);

  return group;
}

/* ── Place agents ── */
function renderArena3D(participants) {
  allParticipants = participants || [];
  sceneAgents.forEach(g => scene.remove(g));
  sceneAgents.length = 0;
  agentMeshes.clear();
  if (!allParticipants.length) return;

  const groups = {};
  allParticipants.forEach(p => {
    const t = p.team_id || '_none';
    if (!groups[t]) groups[t] = [];
    groups[t].push(p);
  });

  let chairman = null;
  if (curDiscData?.moderator_agent_id) chairman = allParticipants.find(p => p.agent_id === curDiscData.moderator_agent_id);
  if (!chairman && allParticipants.length) chairman = allParticipants[0];
  const seated = allParticipants.filter(p => !chairman || p.agent_id !== chairman.agent_id);

  // Chairman on Scarpa throne
  if (chairman) {
    const fig = createAgentFigure(chairman.agent_name || '议事长', 0xD4A050, true);
    fig.position.set(0, 0.0, 0.5);
    scene.add(fig); sceneAgents.push(fig);
    agentMeshes.set(chairman.agent_id, { group: fig });
  }

  // Agents on tiers
  if (seated.length > 0) {
    const ringRadii = [6.5, 11, 16.5];
    const ringHeights = [0.7, 1.5, 2.4];
    const ringMax = [8, 12, 20];
    const rings = [[], [], []];
    let ri = 0;
    seated.forEach(ag => {
      while (ri < 2 && rings[ri].length >= ringMax[ri]) ri++;
      rings[Math.min(ri, 2)].push(ag);
    });
    rings.forEach((ring, rIdx) => {
      if (!ring.length) return;
      ring.forEach((ag, ai) => {
        const angle = (ai / ring.length) * Math.PI * 2 - Math.PI / 2;
        const fig = createAgentFigure(ag.agent_name || ag.agent_id, tColor(ag.team_id));
        fig.position.set(ringRadii[rIdx] * Math.cos(angle), ringHeights[rIdx], ringRadii[rIdx] * Math.sin(angle));
        fig.lookAt(0, ringHeights[rIdx], 0);
        fig.rotation.x = 0; fig.rotation.z = 0;
        scene.add(fig); sceneAgents.push(fig);
        agentMeshes.set(ag.agent_id, { group: fig });
      });
    });
  }

  // Team labels
  Object.keys(groups).forEach(tid => {
    const agents = groups[tid].filter(p => !chairman || p.agent_id !== chairman.agent_id);
    if (!agents.length) return;
    let sumA = 0;
    agents.forEach(ag => { const e = agentMeshes.get(ag.agent_id); if (e) sumA += Math.atan2(e.group.position.z, e.group.position.x); });
    const avg = sumA / agents.length;
    const tex = new THREE.CanvasTexture(makeTextCanvas(teamNames[tid] || tid, teamCSS[tid] || '#7A7470'));
    tex.minFilter = THREE.LinearFilter;
    const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
    label.position.set(23 * Math.cos(avg), 3.5, 23 * Math.sin(avg));
    label.scale.set(2.5, 0.6, 1);
    scene.add(label); sceneAgents.push(label);
  });
}
