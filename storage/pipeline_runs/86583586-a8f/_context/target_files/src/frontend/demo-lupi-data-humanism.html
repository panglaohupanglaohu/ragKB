<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Demo C — Giorgia Lupi 数据人文主义</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F5F0E8;overflow:hidden;font-family:'Noto Sans SC',sans-serif}
canvas{display:block;width:100vw;height:100vh}
.label{position:fixed;bottom:28px;left:28px;color:rgba(80,60,50,0.5);font-size:11px;letter-spacing:2px;z-index:10}
.label b{color:rgba(80,60,50,0.8);font-weight:600}
.badge{position:fixed;top:24px;left:24px;font-size:10px;color:rgba(160,110,70,0.5);
  border:1px solid rgba(160,110,70,0.2);padding:4px 12px;letter-spacing:1.5px;z-index:10}
</style>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="badge">方向 C · GIORGIA LUPI 数据人文主义</div>
<div class="label"><b>技能萃取</b> — 知识的个人纹路</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setClearColor(0xF5F0E8);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xF5F0E8);
scene.fog = new THREE.FogExp2(0xF5F0E8, 0.008);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 150);
camera.position.set(0, 12, 20);
const ctrl = new OrbitControls(camera, canvas);
ctrl.enableDamping = true; ctrl.dampingFactor = 0.05;
ctrl.target.set(0, 1.5, 0); ctrl.maxPolarAngle = Math.PI / 2.1;

// Warm, natural lighting
scene.add(new THREE.AmbientLight(0xFFF4E8, 0.45));
const sun = new THREE.DirectionalLight(0xFFE8D0, 0.55);
sun.position.set(6, 20, 10); scene.add(sun);
scene.add(new THREE.HemisphereLight(0xFFF0E0, 0xE8E0D0, 0.35));

// === COLOR PALETTE (warm, humanist) ===
const PALETTE = {
  vessel: 0xC4694A,    // terracotta / warm red-brown
  nerve: 0x6A8FA0,     // dusty teal
  atomic: 0x7AAA6A,    // sage green
  trait: 0xC4944A,     // amber ochre
  composite: 0x9A6AAA, // muted plum
  human: 0xBB8866,     // warm skin tone
  line: 0x8A7A6A,      // graphite warm
  paper: 0xEDE5D8,     // parchment
};

// === GROUND (paper/parchment texture) ===
const groundMat = new THREE.MeshStandardMaterial({
  color: PALETTE.paper, roughness: 0.95, metalness: 0
});
const ground = new THREE.Mesh(new THREE.CircleGeometry(22, 64), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Concentric "notebook rings" (like hand-drawn circles)
for (let r = 5; r <= 15; r += 5) {
  const ringPts = [];
  const segments = 120;
  for (let i = 0; i <= segments; i++) {
    const a = (i / segments) * Math.PI * 2;
    // Hand-drawn wobble
    const wobble = Math.sin(a * 7 + r) * 0.08 + Math.cos(a * 11 + r * 2) * 0.05;
    ringPts.push(new THREE.Vector3(
      Math.cos(a) * (r + wobble),
      0.005,
      Math.sin(a) * (r + wobble)
    ));
  }
  const ringCurve = new THREE.CatmullRomCurve3(ringPts, true);
  const ringGeo = new THREE.TubeGeometry(ringCurve, 120, 0.012, 4, true);
  const ringMat = new THREE.MeshBasicMaterial({
    color: PALETTE.line, transparent: true, opacity: 0.12
  });
  scene.add(new THREE.Mesh(ringGeo, ringMat));
}

// === HUMAN FIGURE (sketchy, hand-drawn quality) ===
const humanGroup = new THREE.Group();

// Head — imperfect torus (wobbled)
const headPts = [];
for (let i = 0; i <= 48; i++) {
  const a = (i / 48) * Math.PI * 2;
  const r = 0.36 + Math.sin(a * 5) * 0.015 + Math.cos(a * 8) * 0.01;
  headPts.push(new THREE.Vector3(Math.cos(a) * r, 2.2, Math.sin(a) * r));
}
const headCurve = new THREE.CatmullRomCurve3(headPts, true);
const headMat = new THREE.MeshBasicMaterial({ color: PALETTE.human, transparent: true, opacity: 0.7 });
humanGroup.add(new THREE.Mesh(new THREE.TubeGeometry(headCurve, 48, 0.03, 6, true), headMat));

// Body — slightly trembling U-curve (pencil line quality)
const bodyPts = [];
for (let i = 0; i <= 40; i++) {
  const t = i / 40, a = Math.PI * t;
  const tremor = Math.sin(t * 20) * 0.008;
  bodyPts.push(new THREE.Vector3(-Math.cos(a) * 0.48 + tremor, 1.35 - Math.sin(a) * 0.68, tremor * 0.5));
}
const bodyCurve = new THREE.CatmullRomCurve3(bodyPts);
humanGroup.add(new THREE.Mesh(
  new THREE.TubeGeometry(bodyCurve, 40, 0.025, 6, false),
  new THREE.MeshBasicMaterial({ color: PALETTE.human, transparent: true, opacity: 0.65 })
));

// Second pass (sketch double-line effect)
const bodyPts2 = bodyPts.map(p => new THREE.Vector3(p.x + 0.02, p.y + 0.01, p.z + 0.015));
const bodyCurve2 = new THREE.CatmullRomCurve3(bodyPts2);
humanGroup.add(new THREE.Mesh(
  new THREE.TubeGeometry(bodyCurve2, 40, 0.015, 4, false),
  new THREE.MeshBasicMaterial({ color: PALETTE.human, transparent: true, opacity: 0.25 })
));

// Warm glow
const hLight = new THREE.PointLight(PALETTE.human, 0.3, 6);
hLight.position.y = 1.6; humanGroup.add(hLight);

scene.add(humanGroup);

// === VESSEL SYSTEM (hand-drawn warm lines, variable thickness) ===
function buildHandDrawnPath(angle, maxR, color, thickness) {
  const pts = [];
  const steps = 40;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const r = t * maxR;
    // Hand-drawn imperfection
    const shake = 0.08 * t;
    const wobX = Math.sin(t * 7 + angle * 4) * shake + Math.sin(t * 13) * shake * 0.5;
    const wobZ = Math.cos(t * 5 + angle * 3) * shake * 0.7;
    const x = Math.cos(angle) * r + wobX;
    const z = Math.sin(angle) * r + wobZ;
    const y = Math.sin(t * Math.PI) * 1.4 * (1 - t * 0.2) + 0.15;
    pts.push(new THREE.Vector3(x, y, z));
  }
  const curve = new THREE.CatmullRomCurve3(pts);

  // Main line
  const mainMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.4 });
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 60, thickness, 6, false), mainMat));

  // Shadow/double line (sketch effect)
  const pts2 = pts.map(p => new THREE.Vector3(p.x + 0.03, p.y - 0.02, p.z + 0.02));
  const curve2 = new THREE.CatmullRomCurve3(pts2);
  const shadowMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.12 });
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve2, 60, thickness * 0.6, 4, false), shadowMat));

  return { curve };
}

const vesselPaths = [];
for (let i = 0; i < 5; i++) {
  const angle = (i / 5) * Math.PI * 2 + 0.15;
  vesselPaths.push(buildHandDrawnPath(angle, 7 + Math.random() * 2, PALETTE.vessel, 0.04 + Math.random() * 0.03));
}

const nervePaths2 = [];
for (let i = 0; i < 4; i++) {
  const angle = (i / 4) * Math.PI * 2 + Math.PI / 5;
  nervePaths2.push(buildHandDrawnPath(angle, 10 + Math.random() * 3, PALETTE.nerve, 0.025 + Math.random() * 0.015));
}

// === FLOW DOTS (like ink dots on paper, not particles) ===
const dotCount = 150;
const dotPositions = new Float32Array(dotCount * 3);
const dotColors = new Float32Array(dotCount * 3);
const dotData = [];

for (let i = 0; i < dotCount; i++) {
  const isVessel = i < 90;
  const paths = isVessel ? vesselPaths : nervePaths2;
  const pathIdx = Math.floor(Math.random() * paths.length);
  const offset = Math.random();
  const color = isVessel ? new THREE.Color(PALETTE.vessel) : new THREE.Color(PALETTE.nerve);
  dotData.push({ pathIdx, offset, speed: 0.001 + Math.random() * 0.002, isVessel });
  const pt = paths[pathIdx].curve.getPointAt(offset);
  dotPositions[i * 3] = pt.x;
  dotPositions[i * 3 + 1] = pt.y;
  dotPositions[i * 3 + 2] = pt.z;
  dotColors[i * 3] = color.r;
  dotColors[i * 3 + 1] = color.g;
  dotColors[i * 3 + 2] = color.b;
}

const dotGeo = new THREE.BufferGeometry();
dotGeo.setAttribute('position', new THREE.BufferAttribute(dotPositions, 3));
dotGeo.setAttribute('color', new THREE.BufferAttribute(dotColors, 3));
const dotMat = new THREE.PointsMaterial({
  size: 0.06, vertexColors: true, transparent: true, opacity: 0.6, depthWrite: false
});
scene.add(new THREE.Points(dotGeo, dotMat));

// === SKILL NODES (hand-drawn markers with canvas labels) ===
const skills = [
  { name: '代码实现', icon: '💻', type: 'atomic', angle: 0, r: 5.5, color: PALETTE.atomic },
  { name: '研究分析', icon: '🔬', type: 'atomic', angle: 1.2, r: 5, color: PALETTE.atomic },
  { name: '测试验证', icon: '▶', type: 'atomic', angle: 2.5, r: 6, color: PALETTE.atomic },
  { name: '能效审计', icon: '⚡', type: 'trait', angle: 3.8, r: 9, color: PALETTE.trait },
  { name: 'PUE优化', icon: '🌡', type: 'trait', angle: 5, r: 10, color: PALETTE.trait },
  { name: '全链路流水线', icon: '🔗', type: 'composite', angle: 1.8, r: 13, color: PALETTE.composite },
];

function makeHandwrittenLabel(text, hexColor) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 72;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 256, 72);
  // Slightly tilted text (hand-written feel)
  ctx.save();
  ctx.translate(128, 36);
  ctx.rotate((Math.random() - 0.5) * 0.05);
  ctx.font = '400 22px "Noto Sans SC", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = hexColor;
  ctx.fillText(text, 0, 0);
  ctx.restore();
  return c;
}

skills.forEach(s => {
  const x = Math.cos(s.angle) * s.r;
  const z = Math.sin(s.angle) * s.r;

  // Hand-drawn circle marker (wobbled)
  const markerPts = [];
  for (let i = 0; i <= 24; i++) {
    const a = (i / 24) * Math.PI * 2;
    const mR = (s.type === 'composite' ? 0.4 : 0.28) + Math.sin(a * 5 + s.angle) * 0.02;
    markerPts.push(new THREE.Vector3(x + Math.cos(a) * mR, 0.6, z + Math.sin(a) * mR));
  }
  const markerCurve = new THREE.CatmullRomCurve3(markerPts, true);
  const markerMat = new THREE.MeshBasicMaterial({ color: s.color, transparent: true, opacity: 0.55 });
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(markerCurve, 24, 0.02, 4, true), markerMat));

  // Fill circle (translucent)
  const fillMat = new THREE.MeshBasicMaterial({ color: s.color, transparent: true, opacity: 0.08 });
  const fill = new THREE.Mesh(new THREE.CircleGeometry(s.type === 'composite' ? 0.4 : 0.28, 24), fillMat);
  fill.rotation.x = -Math.PI / 2; fill.position.set(x, 0.58, z);
  scene.add(fill);

  // Connection line to center (hand-drawn)
  const linePts = [];
  const lineSteps = 20;
  for (let j = 0; j <= lineSteps; j++) {
    const lt = j / lineSteps;
    const lx = x * lt;
    const lz = z * lt;
    const ly = 0.5 + Math.sin(lt * Math.PI) * 0.3;
    // Wobble
    const lw = Math.sin(lt * 12 + s.angle) * 0.03;
    linePts.push(new THREE.Vector3(lx + lw, ly, lz + lw * 0.5));
  }
  const lineCurve = new THREE.CatmullRomCurve3(linePts);
  // Line thickness = confidence (simulated)
  const lineThickness = s.type === 'composite' ? 0.018 : s.type === 'trait' ? 0.012 : 0.008;
  const lineMat = new THREE.MeshBasicMaterial({
    color: s.color, transparent: true, opacity: 0.15
  });
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(lineCurve, 20, lineThickness, 4, false), lineMat));

  // Label sprite
  const colorHex = '#' + new THREE.Color(s.color).getHexString();
  const tex = new THREE.CanvasTexture(makeHandwrittenLabel(`${s.icon} ${s.name}`, colorHex));
  tex.minFilter = THREE.LinearFilter;
  const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  label.position.set(x, 1.3, z);
  label.scale.set(2.2, 0.6, 1);
  scene.add(label);

  s._x = x; s._z = z;
});

// === AMBIENT DUST (pollen-like, warm) ===
const dustCount = 80;
const dustPos = new Float32Array(dustCount * 3);
for (let i = 0; i < dustCount; i++) {
  dustPos[i * 3] = (Math.random() - 0.5) * 30;
  dustPos[i * 3 + 1] = Math.random() * 6 + 0.5;
  dustPos[i * 3 + 2] = (Math.random() - 0.5) * 30;
}
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
scene.add(new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color: 0xC8B898, size: 0.04, transparent: true, opacity: 0.18
})));

// === ANIMATION ===
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  ctrl.update();

  // Human gentle sway (like breathing while drawing)
  humanGroup.position.y = Math.sin(t * 0.5) * 0.02;
  humanGroup.rotation.y = Math.sin(t * 0.15) * 0.03;
  hLight.intensity = 0.25 + Math.sin(t * 0.8) * 0.05;

  // Ink dot flow (gentle, unhurried)
  const dotPosArr = dotGeo.attributes.position.array;
  dotData.forEach((d, i) => {
    d.offset = (d.offset + d.speed) % 1;
    const paths = d.isVessel ? vesselPaths : nervePaths2;
    const pt = paths[d.pathIdx].curve.getPointAt(d.offset);
    dotPosArr[i * 3] = pt.x;
    dotPosArr[i * 3 + 1] = pt.y;
    dotPosArr[i * 3 + 2] = pt.z;
  });
  dotGeo.attributes.position.needsUpdate = true;

  // Dust drift
  const dArr = dustGeo.attributes.position.array;
  for (let i = 0; i < dustCount; i++) {
    dArr[i * 3 + 1] += Math.sin(t * 0.2 + i * 0.15) * 0.001;
    dArr[i * 3] += Math.cos(t * 0.1 + i * 0.2) * 0.0003;
  }
  dustGeo.attributes.position.needsUpdate = true;

  renderer.render(scene, camera);
}

function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', onResize); onResize();
animate();
</script>
</body>
</html>
