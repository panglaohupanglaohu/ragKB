<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能体広場 — AgentsGroup2026</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* ── Wabi-Sabi Dark — Kenya Hara Emptiness ─────────── */
:root{
  --bg:#0c0c0e;--bg-warm:#0f0e0d;
  --sand:oklch(0.82 0.02 80);--sand-dim:oklch(0.55 0.02 80);
  --stone:oklch(0.35 0.01 80);--stone-warm:oklch(0.25 0.01 60);
  --paper:oklch(0.92 0.01 90);--paper-dim:oklch(0.75 0.01 90);
  --ink:oklch(0.15 0.005 60);
  --accent:oklch(0.68 0.06 220);--accent-glow:oklch(0.68 0.06 220 / 0.25);
  --gold:oklch(0.70 0.08 75);--gold-dim:oklch(0.50 0.06 75);
  --red:oklch(0.55 0.12 25);
  --panel:oklch(0.12 0.008 60);--panel2:oklch(0.16 0.008 60);
  --line:oklch(0.22 0.008 60);
  --text:oklch(0.85 0.01 80);--muted:oklch(0.55 0.01 80);--dim:oklch(0.35 0.01 80);
  --font-serif:'Noto Serif SC',serif;
  --font-sans:'Noto Sans SC',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-sans);background:var(--bg-warm);color:var(--text);height:100vh;overflow:hidden}

/* ── Top bar ── */
.top-bar{position:fixed;top:0;left:0;right:0;z-index:100;height:48px;
  background:oklch(0.10 0.008 60 / 0.95);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:16px}
.top-bar .logo{font-family:var(--font-serif);font-size:16px;font-weight:400;color:var(--sand);letter-spacing:3px}
.top-bar .nav-links{display:flex;gap:6px;margin-left:auto}
.top-bar .nav-links a{color:var(--muted);text-decoration:none;font-size:12px;padding:6px 14px;
  border-radius:3px;transition:all 0.3s;letter-spacing:0.5px}
.top-bar .nav-links a:hover{color:var(--sand)}
.top-bar .nav-links a.active{color:var(--sand);background:oklch(0.82 0.02 80 / 0.06)}

/* ── Layout: 三段 ── */
.layout{display:grid;grid-template-columns:240px 1fr 320px;height:calc(100vh - 48px);margin-top:48px}

/* ── Left ── */
.left{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.left .hd{padding:20px 18px 16px;border-bottom:1px solid var(--line)}
.left .hd h2{font-family:var(--font-serif);font-size:14px;font-weight:400;color:var(--sand);letter-spacing:2px}
.left .hd .sub{font-size:10px;color:var(--dim);margin-top:4px;letter-spacing:1px}
.left .list{flex:1;overflow-y:auto;padding:8px 10px}
.plaza-card{padding:14px 16px;margin-bottom:6px;background:transparent;border:1px solid transparent;
  border-radius:4px;cursor:pointer;transition:all 0.3s}
.plaza-card:hover{background:oklch(0.82 0.02 80 / 0.03);border-color:var(--stone)}
.plaza-card.active{border-color:var(--sand-dim);background:oklch(0.82 0.02 80 / 0.05)}
.plaza-card .nm{font-weight:400;font-size:13px;color:var(--paper-dim);letter-spacing:0.5px}
.plaza-card .mt{font-size:10px;color:var(--dim);display:flex;gap:10px;margin-top:5px}
.btn-new{margin:12px 10px;padding:10px 16px;background:transparent;border:1px dashed var(--stone);
  color:var(--sand-dim);font-size:11px;border-radius:4px;cursor:pointer;letter-spacing:1px;transition:all 0.3s}
.btn-new:hover{border-color:var(--sand);color:var(--sand)}

/* ── Center: Three.js ── */
.center{position:relative;overflow:hidden;background:var(--bg-warm)}
#three-canvas{width:100%;height:100%;display:block}
.speech-bubble{position:absolute;max-width:240px;padding:12px 16px;
  background:oklch(0.12 0.01 60 / 0.92);backdrop-filter:blur(12px);
  border:1px solid var(--stone);border-radius:6px 6px 6px 0;
  font-size:12px;line-height:1.7;color:var(--paper-dim);
  pointer-events:none;opacity:0;transform:translateY(8px);
  transition:opacity 0.4s ease,transform 0.4s ease;z-index:50;
  box-shadow:0 8px 32px oklch(0 0 0 / 0.4)}
.speech-bubble.show{opacity:1;transform:translateY(0)}
.speech-bubble .sb-name{font-family:var(--font-serif);font-weight:400;font-size:11px;color:var(--sand);margin-bottom:4px;letter-spacing:1px}
.speech-bubble .sb-text{white-space:pre-wrap;word-break:break-word}
.speech-bubble::after{content:'';position:absolute;bottom:-7px;left:16px;
  border-left:7px solid transparent;border-right:7px solid transparent;
  border-top:7px solid var(--stone)}

/* ── Right ── */
.right{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.section{padding:16px 18px;border-bottom:1px solid var(--line)}
.sec-title{font-family:var(--font-serif);font-size:11px;font-weight:400;color:var(--dim);
  margin-bottom:10px;letter-spacing:2px;text-transform:uppercase}
.disc-item{padding:12px 14px;margin-bottom:4px;background:transparent;border:1px solid transparent;
  border-radius:4px;cursor:pointer;font-size:12px;transition:all 0.3s}
.disc-item:hover{border-color:var(--stone)}
.disc-item.active{border-color:var(--sand-dim);background:oklch(0.82 0.02 80 / 0.04)}
.disc-item .tp{font-weight:400;margin-bottom:4px;color:var(--paper-dim)}
.disc-item .dm{font-size:10px;color:var(--dim);display:flex;gap:8px}
.msg-log{flex:1;overflow-y:auto;padding:12px 16px;font-size:12px;min-height:35vh}
.msg-entry{margin-bottom:12px;padding:10px 12px;border-left:2px solid var(--stone);
  background:oklch(0.14 0.008 60);border-radius:0 4px 4px 0}
.msg-entry .me-name{font-family:var(--font-serif);font-weight:400;color:var(--sand);font-size:11px;letter-spacing:0.5px}
.msg-entry .me-text{color:var(--paper-dim);line-height:1.8;margin-top:4px}
.msg-entry.mod{border-left-color:var(--gold-dim)}
.msg-entry.mod .me-name{color:var(--gold)}
.round-sep{text-align:center;color:var(--dim);font-size:10px;margin:16px 0;position:relative;letter-spacing:2px}
.round-sep::before,.round-sep::after{content:'';position:absolute;top:50%;width:28%;height:1px;background:var(--line)}
.round-sep::before{left:0}.round-sep::after{right:0}
#plan-panel{max-height:35vh;overflow-y:auto;border-top:1px solid var(--line);flex-shrink:0}
.plan-card{margin:12px 16px;padding:14px 16px;background:oklch(0.14 0.01 60);
  border:1px solid oklch(0.70 0.08 75 / 0.15);border-radius:4px}
.plan-card h4{font-family:var(--font-serif);font-size:13px;font-weight:400;color:var(--gold);margin-bottom:10px;letter-spacing:1px}
.plan-card .plan-text{font-size:12px;line-height:1.8;color:var(--paper-dim)}
.plan-card .plan-text strong{color:var(--sand)}
.plan-card .plan-text code{background:oklch(0.18 0.01 60);padding:1px 5px;border-radius:3px;font-size:11px;font-family:var(--font-mono)}
.plan-card .assign-row{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.plan-card select{padding:6px 10px;background:var(--bg-warm);border:1px solid var(--line);color:var(--text);font-size:11px;border-radius:3px}
.ctrl-bar{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn-start{padding:8px 22px;background:oklch(0.70 0.08 75 / 0.15);border:1px solid var(--gold-dim);
  color:var(--gold);font-size:12px;font-weight:400;border-radius:4px;cursor:pointer;
  letter-spacing:1px;transition:all 0.3s}
.btn-start:hover{background:oklch(0.70 0.08 75 / 0.25)}
.btn-start:disabled{opacity:0.3;cursor:not-allowed}
.btn{padding:6px 14px;background:transparent;border:1px solid var(--stone);color:var(--muted);
  font-size:11px;border-radius:3px;cursor:pointer;transition:all 0.3s}
.btn:hover{border-color:var(--sand-dim);color:var(--sand)}
.ctrl-bar .status-text{margin-left:auto;font-size:10px;color:var(--dim);font-family:var(--font-mono)}
.pill{display:inline-block;padding:2px 10px;border-radius:10px;font-size:10px;letter-spacing:0.5px}
.pill-open{background:oklch(0.68 0.06 220 / 0.1);color:var(--accent)}
.pill-in_progress{background:oklch(0.70 0.08 75 / 0.1);color:var(--gold)}
.pill-summarizing{background:oklch(0.70 0.08 75 / 0.15);color:var(--gold)}
.pill-closed{background:oklch(0.35 0.01 80 / 0.1);color:var(--dim)}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;z-index:200;background:oklch(0 0 0 / 0.6);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--stone);border-radius:6px;padding:28px;width:440px;max-width:90vw}
.modal h3{font-family:var(--font-serif);font-size:15px;font-weight:400;margin-bottom:20px;color:var(--sand);letter-spacing:1px}
.fg{margin-bottom:14px}
.fl{display:block;font-size:10px;color:var(--dim);margin-bottom:4px;letter-spacing:1px;text-transform:uppercase}
.fi{width:100%;padding:10px 12px;background:var(--bg-warm);border:1px solid var(--line);color:var(--text);
  font-size:12px;font-family:var(--font-sans);border-radius:3px;outline:none;transition:border 0.3s}
.fi:focus{border-color:var(--sand-dim)}
textarea.fi{resize:vertical;min-height:50px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.btn-primary{padding:8px 22px;background:oklch(0.82 0.02 80 / 0.08);border:1px solid var(--sand-dim);
  color:var(--sand);font-size:12px;border-radius:3px;cursor:pointer;letter-spacing:1px}
.btn-cancel{padding:8px 18px;background:transparent;border:1px solid var(--stone);color:var(--dim);
  font-size:12px;border-radius:3px;cursor:pointer}
.toast-box{position:fixed;top:60px;right:18px;z-index:300}
.toast{padding:10px 18px;margin-bottom:6px;background:oklch(0.14 0.008 60 / 0.95);backdrop-filter:blur(8px);
  border:1px solid var(--stone);border-radius:4px;font-size:12px;color:var(--sand);
  animation:tin 0.4s ease}
@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:oklch(0.25 0.01 60);border-radius:2px}
</style>
</head>
<body>

<div class="top-bar">
  <span class="logo">議 事 広 場</span>
  <div class="nav-links">
    <a href="/agent-team-config.html">団隊</a>
    <a href="/datacenter-ratchet-evolution.html">演進</a>
    <a href="/plaza.html" class="active">広場</a>
  </div>
</div>

<div class="layout">
  <!-- Left: Plaza list -->
  <div class="left">
    <div class="hd"><h2>広 場</h2><div class="sub">三維環形議事空間</div></div>
    <div class="list" id="plaza-list"><div style="padding:20px;color:var(--dim);text-align:center;font-size:11px">読込中…</div></div>
    <button class="btn-new" onclick="openCreatePlaza()">＋ 創 建</button>
  </div>

  <!-- Center: Three.js 3D Arena -->
  <div class="center" id="arena-container">
    <canvas id="three-canvas"></canvas>
  </div>

  <!-- Right: Discussion panel -->
  <div class="right">
    <div class="section" id="disc-section">
      <div class="sec-title">討 論</div>
      <div id="disc-list"><div style="color:var(--dim);font-size:11px">先選択広場</div></div>
      <button class="btn" style="width:100%;margin-top:10px;border-style:dashed" onclick="openCreateDisc()">＋ 新建討論</button>
    </div>
    <div class="msg-log" id="msg-log">
      <div style="text-align:center;padding:40px 0;color:var(--dim);font-size:11px;letter-spacing:1px">
        選択広場 · 創建討論<br>全員自動入座
      </div>
    </div>
    <div id="plan-panel" style="display:none"></div>
    <div class="ctrl-bar">
      <button class="btn-start" id="btn-start" onclick="startDiscussion()" disabled>開 始</button>
      <button class="btn" onclick="openCreateDisc()">＋ 話題</button>
      <span class="status-text" id="status-text"></span>
    </div>
  </div>
</div>

<div class="toast-box" id="toasts"></div>

<!-- Create Plaza Modal -->
<div class="modal-overlay" id="m-plaza" onclick="if(event.target===this)closeM(this.id)">
  <div class="modal"><h3>創 建 広 場</h3>
    <div class="fg"><label class="fl">名称</label><input class="fi" id="inp-pn" placeholder="如: 技術決策広場"></div>
    <div class="fg"><label class="fl">描述</label><textarea class="fi" id="inp-pd" placeholder="広場用途"></textarea></div>
    <div class="modal-actions"><button class="btn-cancel" onclick="closeM('m-plaza')">取消</button><button class="btn-primary" onclick="doCreatePlaza()">創建</button></div>
  </div>
</div>

<!-- Create Discussion Modal -->
<div class="modal-overlay" id="m-disc" onclick="if(event.target===this)closeM(this.id)">
  <div class="modal"><h3>創 建 討 論</h3>
    <div class="fg"><label class="fl">話題</label><input class="fi" id="inp-dt" placeholder="核心問題"></div>
    <div class="fg"><label class="fl">目標</label><input class="fi" id="inp-dg" placeholder="期望達成"></div>
    <div class="fg"><label class="fl">描述</label><textarea class="fi" id="inp-dd" placeholder="背景與產出"></textarea></div>
    <div class="fg"><label class="fl">議事長</label><select class="fi" id="inp-dm"></select></div>
    <div class="fg"><label class="fl">輪次</label><select class="fi" id="inp-dr">
      <option value="1">1 輪</option><option value="2" selected>2 輪</option><option value="3">3 輪</option><option value="5">5 輪</option>
    </select></div>
    <div class="modal-actions"><button class="btn-cancel" onclick="closeM('m-disc')">取消</button><button class="btn-primary" onclick="doCreateDisc()">創建</button></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ═══════════ GLOBALS ═══════════ */
const API = '/api/v1/agent-config';
let curPlaza = null, curDisc = null, curDiscData = null, evtSrc = null;
let allTeams = [], allParticipants = [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function toast(m) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = m;
  $('toasts').appendChild(t); setTimeout(() => t.remove(), 3500);
}
function openM(id) { $(id).classList.add('open') }
function closeM(id) { $(id).classList.remove('open') }
window.openM = openM; window.closeM = closeM;
async function api(url, opts) {
  try { const r = await fetch(url, opts); if (!r.ok) return null; return await r.json(); }
  catch (e) { console.error(url, e); return null; }
}

const teamColors = {
  build_system: 0x4a9070,
  ai_coding: 0x5577cc,
  energy_first_principle: 0xcc8844
};
const teamCSS = {
  build_system: '#4a9070',
  ai_coding: '#5577cc',
  energy_first_principle: '#cc8844'
};
const teamNames = {
  build_system: 'Build',
  ai_coding: '編程',
  energy_first_principle: '能源'
};
function tColor(tid) { return teamColors[tid] || 0x556677; }

/* ═══════════ THREE.JS SCENE ═══════════ */
const canvas = $('three-canvas');
const container = $('arena-container');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0f0e0d, 0.012);

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
camera.position.set(0, 22, 22);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setClearColor(0x0f0e0d);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 10;
controls.maxDistance = 50;
controls.maxPolarAngle = Math.PI / 2.15;
controls.target.set(0, 0, 0);

/* ── Lights ── */
scene.add(new THREE.AmbientLight(0xd4c4a8, 0.35));
const dLight = new THREE.DirectionalLight(0xfff4e0, 0.6);
dLight.position.set(10, 20, 8);
dLight.castShadow = true;
dLight.shadow.mapSize.set(1024, 1024);
dLight.shadow.camera.near = 1; dLight.shadow.camera.far = 50;
dLight.shadow.camera.left = -20; dLight.shadow.camera.right = 20;
dLight.shadow.camera.top = 20; dLight.shadow.camera.bottom = -20;
scene.add(dLight);
scene.add(new THREE.HemisphereLight(0xd4c4a8, 0x2a2520, 0.4));

/* ── Ground: 枯山水 stone garden ── */
const groundGeo = new THREE.CircleGeometry(30, 64);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1816, roughness: 0.95, metalness: 0.0 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
scene.add(ground);

/* ── Sand ripple rings ── */
[6, 10, 15, 21].forEach(r => {
  const geo = new THREE.RingGeometry(r - 0.03, r + 0.03, 128);
  const mat = new THREE.MeshBasicMaterial({ color: 0x2a2520, side: THREE.DoubleSide, transparent: true, opacity: 0.35 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = -Math.PI / 2; mesh.position.y = 0.01;
  scene.add(mesh);
});

/* ── Center platform ── */
const platGeo = new THREE.CylinderGeometry(1.6, 2.0, 0.25, 32);
const platMat = new THREE.MeshStandardMaterial({ color: 0x3a3020, roughness: 0.7, metalness: 0.3 });
const platform = new THREE.Mesh(platGeo, platMat);
platform.position.y = 0.125; platform.castShadow = true; platform.receiveShadow = true;
scene.add(platform);

/* ── Particle system: floating dust ── */
const dustCount = 200;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(dustCount * 3);
for (let i = 0; i < dustCount; i++) {
  dustPos[i * 3] = (Math.random() - 0.5) * 50;
  dustPos[i * 3 + 1] = Math.random() * 12;
  dustPos[i * 3 + 2] = (Math.random() - 0.5) * 50;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({ color: 0xd4c4a8, size: 0.04, transparent: true, opacity: 0.3 });
const dust = new THREE.Points(dustGeo, dustMat);
scene.add(dust);

/* ═══════════ AGENT FIGURE ═══════════ */
const agentMeshes = new Map(); // agent_id → { group, glowRing }
const sceneAgents = []; // keep refs for cleanup

function makeTextCanvas(text, color) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 256, 64);
  ctx.font = '24px "Noto Sans SC", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = color || '#d4c4a8';
  ctx.fillText(text, 128, 32);
  return c;
}

function createAgentFigure(name, hexColor, isChairman = false) {
  const group = new THREE.Group();
  const col = new THREE.Color(hexColor);
  const h = isChairman ? 1.1 : 0.85;

  // Head
  const headGeo = new THREE.SphereGeometry(isChairman ? 0.35 : 0.26, 16, 16);
  const headMat = new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.15, roughness: 0.6 });
  const head = new THREE.Mesh(headGeo, headMat); head.position.y = h + 0.8; head.castShadow = true;
  group.add(head);

  // Body
  const bodyGeo = new THREE.CylinderGeometry(0.12, 0.22, h, 8);
  const bodyMat = new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.08, roughness: 0.7 });
  const body = new THREE.Mesh(bodyGeo, bodyMat); body.position.y = h / 2 + 0.15; body.castShadow = true;
  group.add(body);

  // Arms
  [-1, 1].forEach(side => {
    const armGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.5, 6);
    const armMat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.7 });
    const arm = new THREE.Mesh(armGeo, armMat);
    arm.position.set(side * 0.28, h * 0.55, 0);
    arm.rotation.z = side * 0.3;
    group.add(arm);
  });

  // Glow ring at feet
  const ringGeo = new THREE.RingGeometry(0.45, 0.65, 32);
  const ringMat = new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.15, side: THREE.DoubleSide });
  const glowRing = new THREE.Mesh(ringGeo, ringMat);
  glowRing.rotation.x = -Math.PI / 2; glowRing.position.y = 0.02;
  group.add(glowRing);
  group.userData.glowRing = glowRing;

  // Point light
  const pLight = new THREE.PointLight(col, isChairman ? 0.6 : 0.2, isChairman ? 6 : 3);
  pLight.position.y = h + 0.5;
  group.add(pLight);

  // Name sprite
  const css = `#${col.getHexString()}`;
  const tex = new THREE.CanvasTexture(makeTextCanvas(name, css));
  tex.minFilter = THREE.LinearFilter;
  const spriteMat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.position.y = isChairman ? 2.5 : 1.95;
  sprite.scale.set(2, 0.5, 1);
  group.add(sprite);

  return group;
}

/* ── Place agents in scene ── */
function renderArena3D(participants) {
  allParticipants = participants || [];
  // Clear existing
  sceneAgents.forEach(g => scene.remove(g));
  sceneAgents.length = 0;
  agentMeshes.clear();

  if (!allParticipants.length) return;

  // Group by team
  const groups = {};
  allParticipants.forEach(p => {
    const t = p.team_id || '_none';
    if (!groups[t]) groups[t] = [];
    groups[t].push(p);
  });

  // Determine chairman
  let chairman = null;
  if (curDiscData?.moderator_agent_id) {
    chairman = allParticipants.find(p => p.agent_id === curDiscData.moderator_agent_id);
  }
  if (!chairman && allParticipants.length) chairman = allParticipants[0];

  const seated = allParticipants.filter(p => !chairman || p.agent_id !== chairman.agent_id);

  // Chairman at center on platform
  if (chairman) {
    const fig = createAgentFigure(chairman.agent_name || '議事長', 0xc8a860, true);
    fig.position.set(0, 0.25, 0);
    scene.add(fig);
    sceneAgents.push(fig);
    agentMeshes.set(chairman.agent_id, { group: fig });
  }

  // Distribute seated agents in rings
  if (seated.length > 0) {
    // Calculate ring assignments: ≤8 on ring0 (r=6), ≤12 on ring1 (r=10), rest on ring2 (r=15)
    const ringRadii = [6, 10, 15];
    const ringMax = [8, 12, 20];
    const rings = [[], [], []];

    let ri = 0;
    seated.forEach(ag => {
      while (ri < 2 && rings[ri].length >= ringMax[ri]) ri++;
      rings[Math.min(ri, 2)].push(ag);
    });

    rings.forEach((ring, rIdx) => {
      if (!ring.length) return;
      const radius = ringRadii[rIdx];
      ring.forEach((ag, ai) => {
        const angle = (ai / ring.length) * Math.PI * 2 - Math.PI / 2;
        const x = radius * Math.cos(angle);
        const z = radius * Math.sin(angle);
        const col = tColor(ag.team_id);
        const fig = createAgentFigure(ag.agent_name || ag.agent_id, col);
        fig.position.set(x, 0, z);
        // Face center
        fig.lookAt(0, 0, 0);
        fig.rotation.x = 0; fig.rotation.z = 0; // only Y rotation
        scene.add(fig);
        sceneAgents.push(fig);
        agentMeshes.set(ag.agent_id, { group: fig });
      });
    });
  }

  // Team arc labels
  const teamIds = Object.keys(groups);
  let offset = 0;
  teamIds.forEach(tid => {
    const agents = groups[tid].filter(p => !chairman || p.agent_id !== chairman.agent_id);
    if (!agents.length) return;
    // Find average angle of team members
    let sumAngle = 0;
    agents.forEach(ag => {
      const entry = agentMeshes.get(ag.agent_id);
      if (entry) {
        const a = Math.atan2(entry.group.position.z, entry.group.position.x);
        sumAngle += a;
      }
    });
    const avgAngle = sumAngle / agents.length;
    const lx = 22 * Math.cos(avgAngle);
    const lz = 22 * Math.sin(avgAngle);
    const css = teamCSS[tid] || '#556677';
    const tex = new THREE.CanvasTexture(makeTextCanvas(teamNames[tid] || tid, css));
    tex.minFilter = THREE.LinearFilter;
    const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
    const label = new THREE.Sprite(mat);
    label.position.set(lx, 0.5, lz);
    label.scale.set(3, 0.8, 1);
    scene.add(label);
    sceneAgents.push(label);
  });
}

/* ── Speaking effects ── */
function highlightSpeaker(agentId, speaking) {
  const entry = agentMeshes.get(agentId);
  if (!entry) return;
  const ring = entry.group.userData.glowRing;
  if (ring) {
    ring.material.opacity = speaking ? 0.55 : 0.15;
    const s = speaking ? 1.4 : 1;
    ring.scale.set(s, s, 1);
  }
}

/* ── Speech bubbles (HTML overlay projected from 3D) ── */
let bubbles = [];
function showSpeechBubble(agentId, name, text, dur) {
  const entry = agentMeshes.get(agentId);
  if (!entry) return;
  const pos = new THREE.Vector3();
  entry.group.getWorldPosition(pos);
  pos.y += 3.0;
  // Project to screen
  const v = pos.clone().project(camera);
  const rect = canvas.getBoundingClientRect();
  const sx = (v.x * 0.5 + 0.5) * rect.width;
  const sy = (-v.y * 0.5 + 0.5) * rect.height;

  removeBubble(agentId);
  highlightSpeaker(agentId, true);

  const b = document.createElement('div');
  b.className = 'speech-bubble'; b.dataset.agent = agentId;
  const short = text.length > 120 ? text.slice(0, 120) + '…' : text;
  b.innerHTML = `<div class="sb-name">${esc(name)}</div><div class="sb-text">${esc(short)}</div>`;
  b.style.left = Math.max(10, Math.min(sx - 120, rect.width - 250)) + 'px';
  b.style.top = Math.max(10, Math.min(sy - 80, rect.height - 100)) + 'px';
  container.appendChild(b);
  requestAnimationFrame(() => b.classList.add('show'));
  bubbles.push({ agentId, bubble: b });
  setTimeout(() => { removeBubble(agentId); highlightSpeaker(agentId, false); }, dur || 8000);
}
function removeBubble(aid) {
  bubbles = bubbles.filter(b => {
    if (b.agentId === aid) { b.bubble.classList.remove('show'); setTimeout(() => b.bubble.remove(), 400); return false; }
    return true;
  });
}

/* ═══════════ ANIMATION LOOP ═══════════ */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  controls.update();

  // Gentle floating dust
  const positions = dust.geometry.attributes.position.array;
  for (let i = 0; i < dustCount; i++) {
    positions[i * 3 + 1] += Math.sin(t * 0.3 + i) * 0.002;
    if (positions[i * 3 + 1] > 12) positions[i * 3 + 1] = 0;
  }
  dust.geometry.attributes.position.needsUpdate = true;

  // Chairman gentle bob
  if (allParticipants.length && curDiscData?.moderator_agent_id) {
    const ch = agentMeshes.get(curDiscData.moderator_agent_id);
    if (ch) ch.group.position.y = 0.25 + Math.sin(t * 0.8) * 0.04;
  }

  renderer.render(scene, camera);
}

function onResize() {
  const w = container.clientWidth, h = container.clientHeight;
  if (w === 0 || h === 0) return;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);
new ResizeObserver(onResize).observe(container);
onResize();
animate();

/* ═══════════ PLAZA CRUD ═══════════ */
async function loadPlazas() {
  const ps = await api(`${API}/plaza`);
  const list = $('plaza-list');
  if (!ps || !ps.length) {
    list.innerHTML = '<div style="padding:20px;color:var(--dim);text-align:center;font-size:11px">無広場</div>';
    return;
  }
  list.innerHTML = ps.map(p =>
    `<div class="plaza-card ${p.id === curPlaza ? 'active' : ''}" onclick="selectPlaza('${esc(p.id)}')">
      <div class="nm">${esc(p.name)}</div>
      <div class="mt"><span>${p.participant_count} 人</span><span>${p.discussion_count} 題</span></div>
    </div>`
  ).join('');
}

window.selectPlaza = async function(id) {
  curPlaza = id; curDisc = null; curDiscData = null;
  loadPlazas();
  await api(`${API}/plaza/${id}/auto-seat`, { method: 'POST' });
  const plaza = await api(`${API}/plaza/${id}`);
  if (!plaza) return;
  renderArena3D(plaza.participants || []);
  renderDiscList(plaza.discussions || []);
  $('msg-log').innerHTML = '<div style="text-align:center;padding:40px 0;color:var(--dim);font-size:11px;letter-spacing:1px">創建討論開始議事</div>';
  $('plan-panel').style.display = 'none';
  $('btn-start').disabled = true;
  $('status-text').textContent = '';
};

window.openCreatePlaza = function() { openM('m-plaza'); $('inp-pn').focus(); };

window.doCreatePlaza = async function() {
  const name = $('inp-pn').value.trim();
  if (!name) { toast('請輸入名称'); return; }
  const r = await api(`${API}/plaza`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, description: $('inp-pd').value.trim() })
  });
  if (r) { closeM('m-plaza'); $('inp-pn').value = ''; $('inp-pd').value = ''; toast('広場已創建'); await loadPlazas(); selectPlaza(r.id); }
};

/* ═══════════ DISCUSSIONS ═══════════ */
function renderDiscList(ds) {
  $('disc-list').innerHTML = ds.map(d =>
    `<div class="disc-item ${d.id === curDisc ? 'active' : ''}" onclick="selectDisc('${esc(d.id)}')">
      <div class="tp">${esc(d.topic)}</div>
      <div class="dm"><span class="pill pill-${d.status}">${statusTxt(d.status)}</span><span>${d.message_count} 消息</span></div>
    </div>`
  ).join('') || '<div style="color:var(--dim);font-size:11px">無討論</div>';
}

function statusTxt(s) {
  return { open: '待啟動', in_progress: '進行中', summarizing: '總結中', closed: '已結束' }[s] || s;
}

window.selectDisc = async function(discId) {
  curDisc = discId;
  const disc = await api(`${API}/plaza/${curPlaza}/discussions/${discId}`);
  if (!disc) return;
  curDiscData = disc;
  const plaza = await api(`${API}/plaza/${curPlaza}`);
  if (plaza) { renderDiscList(plaza.discussions || []); renderArena3D(plaza.participants || []); }
  renderMessages(disc.messages || []);
  $('btn-start').disabled = disc.status !== 'open';
  $('btn-start').textContent = disc.status === 'open' ? '開 始' :
    disc.status === 'in_progress' ? '進行中' :
    disc.status === 'summarizing' ? '總結中' : '已結束';
  $('status-text').textContent = disc.goal ? `目標: ${disc.goal}` : '';
  if (disc.status === 'closed' && disc.summary) renderPlan(disc);
  else $('plan-panel').style.display = 'none';
  if (disc.status === 'in_progress') connectSSE(discId);
};

function renderMessages(msgs) {
  const log = $('msg-log');
  if (!msgs.length) {
    log.innerHTML = '<div style="text-align:center;padding:40px 0;color:var(--dim);font-size:11px">點撃「開始」啟動討論</div>';
    return;
  }
  let h = '', lr = -1;
  msgs.forEach(m => {
    if (m.round_number !== lr && m.round_number > 0) {
      h += `<div class="round-sep">第 ${m.round_number} 輪</div>`;
      lr = m.round_number;
    }
    const isMod = m.niche_role === 'moderator';
    h += `<div class="msg-entry ${isMod ? 'mod' : ''}">
      <div class="me-name">${esc(m.agent_name)}${isMod ? ' · 議事長' : ''}</div>
      <div class="me-text">${mdLite(m.content)}</div>
    </div>`;
  });
  log.innerHTML = h;
  log.scrollTop = log.scrollHeight;
}

function mdLite(s) {
  return esc(s).replace(/\n/g, '<br>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^(#{1,4})\s+(.+)/gm, (m, h, t) => `<strong style="font-size:${17 - h.length * 2}px">${t}</strong>`);
}

function renderPlan(disc) {
  const p = $('plan-panel'); p.style.display = '';
  const opts = allTeams.map(t => `<option value="${esc(t.team_id)}">${esc(t.name)}</option>`).join('');
  p.innerHTML = `<div class="plan-card">
    <h4>執 行 計 劃</h4>
    <div class="plan-text">${mdLite(disc.summary)}</div>
    <div class="assign-row">
      <span style="font-size:10px;color:var(--dim)">派發:</span>
      <select id="assign-team">${opts}</select>
      <button class="btn" onclick="assignPlan()">派 發</button>
    </div>
  </div>`;
}

window.assignPlan = async function() {
  if (!curPlaza || !curDisc) return;
  const r = await api(`${API}/plaza/${curPlaza}/discussions/${curDisc}/assign`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ team_id: $('assign-team').value })
  });
  if (r) toast(`計劃已派發: ${r.status}`); else toast('派發失敗');
};

window.openCreateDisc = async function() {
  if (!curPlaza) { toast('請先選択広場'); return; }
  const plaza = await api(`${API}/plaza/${curPlaza}`);
  if (plaza?.participants) {
    $('inp-dm').innerHTML = plaza.participants.map(p =>
      `<option value="${esc(p.agent_id)}">${esc(p.agent_name)}</option>`
    ).join('');
  }
  openM('m-disc'); $('inp-dt').focus();
};

window.doCreateDisc = async function() {
  const topic = $('inp-dt').value.trim();
  if (!topic) { toast('請輸入話題'); return; }
  const r = await api(`${API}/plaza/${curPlaza}/discussions`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      topic,
      goal: $('inp-dg').value.trim(),
      description: $('inp-dd').value.trim(),
      moderator_agent_id: $('inp-dm').value,
      max_rounds: parseInt($('inp-dr').value)
    })
  });
  if (r) {
    closeM('m-disc'); $('inp-dt').value = ''; $('inp-dg').value = ''; $('inp-dd').value = '';
    toast('討論已創建'); selectPlaza(curPlaza); setTimeout(() => selectDisc(r.id), 300);
  }
};

window.startDiscussion = async function() {
  if (!curPlaza || !curDisc) return;
  $('btn-start').disabled = true; $('btn-start').textContent = '啟動中…';
  const r = await api(`${API}/plaza/${curPlaza}/discussions/${curDisc}/start`, { method: 'POST' });
  if (r) connectSSE(curDisc);
  else { $('btn-start').disabled = false; $('btn-start').textContent = '開 始'; toast('啟動失敗'); }
};

/* ═══════════ SSE ═══════════ */
function connectSSE(discId) {
  if (evtSrc) { evtSrc.close(); evtSrc = null; }
  if (!curPlaza) return;
  evtSrc = new EventSource(`${API}/plaza/${curPlaza}/discussions/${discId}/stream`);
  let init = false;
  evtSrc.onmessage = (e) => {
    try {
      const d = JSON.parse(e.data);
      if (d.type === 'heartbeat') return;
      if (d.type === 'status') { init = true; return; }
      if (d.type === 'message' && init) {
        const m = d.message, log = $('msg-log');
        if (log.querySelector('[style*="text-align:center"]')) log.innerHTML = '';
        const isMod = m.niche_role === 'moderator';
        const lastSep = log.querySelector('.round-sep:last-of-type');
        const lastR = lastSep ? parseInt(lastSep.textContent.match(/\d+/)?.[0] || 0) : -1;
        if (m.round_number > 0 && m.round_number !== lastR) {
          log.insertAdjacentHTML('beforeend', `<div class="round-sep">第 ${m.round_number} 輪</div>`);
        }
        log.insertAdjacentHTML('beforeend',
          `<div class="msg-entry ${isMod ? 'mod' : ''}">
            <div class="me-name">${esc(m.agent_name)}${isMod ? ' · 議事長' : ''}</div>
            <div class="me-text">${esc(m.content)}</div>
          </div>`);
        log.scrollTop = log.scrollHeight;
        $('status-text').textContent = `第${m.round_number}輪 · ${m.agent_name}`;
        showSpeechBubble(m.agent_id, m.agent_name, m.content, 6000);
      }
      if (d.type === 'discussion_start') { $('btn-start').disabled = true; $('btn-start').textContent = '進行中'; $('msg-log').innerHTML = ''; }
      if (d.type === 'round_start') $('status-text').textContent = `第${d.round}/${d.max_rounds}輪`;
      if (d.type === 'summarizing') { $('btn-start').textContent = '總結中'; $('status-text').textContent = '議事長總結中…'; }
      if (d.type === 'discussion_end') {
        $('btn-start').textContent = '已結束';
        $('status-text').textContent = '完成';
        evtSrc.close(); evtSrc = null;
        toast('討論結束');
        setTimeout(() => selectDisc(discId), 500);
      }
    } catch (err) { console.warn('SSE parse error:', err); }
  };
}

/* ═══════════ INIT ═══════════ */
async function init() {
  allTeams = await api(`${API}/teams`) || [];
  loadPlazas();
  renderArena3D([]);
}
init();
</script>
