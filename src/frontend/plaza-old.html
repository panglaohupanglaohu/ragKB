<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plaza Classic</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --fg: #1f2937;
      --text: #1f2937;
      --panel: #ffffff;
      --card: #f0f4f8;
      --line: #cbd5e1;
      --dim: #64748b;
      --muted: #475569;
      --accent: #2563eb;
      --font-sans: Arial, Helvetica, sans-serif;
      --radius: 6px;
      --shadow: 0 10px 28px rgba(15, 23, 42, 0.12);
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
    }
    main {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0;
    }
    .plaza-board {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 22px;
    }
    .plaza-list {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }
    .plaza-row {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      padding: 14px;
    }
  </style>
</head>
<body>
  <main class="plaza">
    <section class="plaza-board" aria-labelledby="classic-plaza-title">
      <h1 id="classic-plaza-title">智能体广场 Classic</h1>
      <p>Classic plaza template for agent 讨论 records, seat lists, and assigned team context.</p>
      <div class="plaza-list">
        <article class="plaza-row">
          <h2>讨论管理</h2>
          <p>主题、摘要、结论和计划保持可扫描。</p>
        </article>
        <article class="plaza-row">
          <h2>智能体参与</h2>
          <p>记录 agent 身份、团队和发言轮次。</p>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
