<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成本监控 Dashboard — AgentsGroup2026</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/openbridge-theme.css">
  <style>
    /* ── Dashboard Layout ── */
    .cost-dashboard { padding: 24px; max-width: 1400px; margin: 0 auto; }
    .cost-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .cost-header h1 { font-size: 24px; font-weight: 700; color: var(--fg); }
    .cost-status { display: flex; gap: 12px; align-items: center; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .status-dot.healthy { background: var(--lime); box-shadow: 0 0 6px var(--lime); }
    .status-dot.unhealthy { background: var(--pink); box-shadow: 0 0 6px var(--pink); }
    .status-dot.unknown { background: var(--dim); }

    /* ── Filter Bar ── */
    .filter-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: flex-end; }
    .filter-bar label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
    .filter-bar select, .filter-bar input { 
      background: var(--panel); border: 1px solid var(--line); border-radius: 6px; 
      color: var(--fg); padding: 8px 12px; font-size: 13px; min-width: 120px; 
    }
    .filter-bar select:focus, .filter-bar input:focus { outline: none; border-color: var(--pink); }

    /* ── Summary Cards ── */
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .summary-card { 
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px;
      display: flex; flex-direction: column; gap: 6px; 
    }
    .summary-card .card-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .summary-card .card-value { font-size: 28px; font-weight: 700; color: var(--fg); }
    .summary-card .card-sub { font-size: 12px; color: var(--dim); }
    .summary-card.accent .card-value { color: var(--pink); }
    .summary-card.success .card-value { color: var(--lime); }

    /* ── Charts Section ── */
    .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
    @media (max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } }
    .chart-panel { 
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px;
    }
    .chart-panel h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: var(--fg); }
    .chart-container { position: relative; height: 260px; }
    .bar-chart { display: flex; align-items: flex-end; gap: 10px; height: 200px; padding: 0 10px; }
    .bar-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .bar { width: 100%; max-width: 60px; background: linear-gradient(180deg, var(--pink) 0%, rgba(255,107,157,0.3) 100%); border-radius: 6px 6px 0 0; min-height: 4px; transition: height 0.5s ease; }
    .bar-label { font-size: 10px; color: var(--muted); text-align: center; word-break: break-all; }
    .bar-value { font-size: 11px; color: var(--dim); font-weight: 600; }

    /* ── Table ── */
    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .data-table th { text-align: left; padding: 10px 14px; color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--line); }
    .data-table td { padding: 10px 14px; border-bottom: 1px solid var(--hairline); color: var(--fg); }
    .data-table tr:hover td { background: rgba(232,240,250,0.3); }
    .cost-positive { color: var(--pink); font-weight: 600; }
    .cost-neutral { color: var(--fg); }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: 600; }
    .pill.production { background: rgba(255,107,157,0.12); color: var(--pink); }
    .pill.staging { background: rgba(249,200,14,0.12); color: #d4a900; }
    .pill.development { background: rgba(152,245,167,0.12); color: var(--lime); }

    /* ── Loading / Empty State ── */
    .loading-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .loading-state .spinner { 
      width: 36px; height: 36px; border: 3px solid var(--line); border-top-color: var(--pink); 
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; 
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .refresh-hint { font-size: 11px; color: var(--dim); cursor: pointer; }
    .refresh-hint:hover { color: var(--pink); }

    /* ── Responsive ── */
    .table-wrap { overflow-x: auto; }
  </style>
</head>
<body>
  <script src="/js/global-nav.js" data-page="cost"></script>
  
  <div class="cost-dashboard">
    <!-- Header -->
    <div class="cost-header">
      <div>
        <h1>💰 成本监控 Dashboard</h1>
        <p style="color:var(--muted);font-size:13px;margin-top:4px">基于 OpenCost 的实时 K8s 成本分析 · 按服务/环境/团队维度</p>
      </div>
      <div class="cost-status">
        <span style="font-size:12px;color:var(--muted)">OpenCost:</span>
        <span class="status-dot unknown" id="status-dot"></span>
        <span style="font-size:12px;color:var(--dim)" id="status-text">检测中...</span>
        <span style="font-size:11px;color:var(--dim)" id="cache-age"></span>
      </div>
      <button class="btn" onclick="refreshDashboard()" style="margin-left:8px" id="refresh-btn">🔄 刷新</button>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <label>聚合维度
        <select id="filter-aggregation" onchange="refreshDashboard()">
          <option value="service">按服务</option>
          <option value="environment">按环境</option>
          <option value="team">按团队</option>
        </select>
      </label>
      <label>时间窗口
        <select id="filter-window" onchange="refreshDashboard()">
          <option value="24h">最近 24 小时</option>
          <option value="7d">最近 7 天</option>
          <option value="30d">最近 30 天</option>
        </select>
      </label>
      <label>环境
        <select id="filter-environment" onchange="refreshDashboard()">
          <option value="">全部</option>
          <option value="production">production</option>
          <option value="staging">staging</option>
          <option value="development">development</option>
        </select>
      </label>
      <label>服务
        <input type="text" id="filter-service" placeholder="输入服务名..." onchange="refreshDashboard()">
      </label>
      <label style="align-self:flex-end">
        <button class="btn btn-sm" onclick="resetFilters()">重置</button>
      </label>
    </div>

    <!-- Summary Cards -->
    <div class="summary-grid" id="summary-grid">
      <div class="loading-state"><div class="spinner"></div><div>加载中...</div></div>
    </div>

    <!-- Charts: Cost Breakdown + Trends -->
    <div class="charts-grid">
      <div class="chart-panel">
        <h3>📊 成本构成 (Top 10)</h3>
        <div class="chart-container" id="breakdown-chart">
          <div class="loading-state"><div class="spinner"></div></div>
        </div>
      </div>
      <div class="chart-panel">
        <h3>📈 成本趋势</h3>
        <div class="chart-container" id="trends-chart">
          <div class="loading-state"><div class="spinner"></div></div>
        </div>
      </div>
    </div>

    <!-- Pod-level Table -->
    <div class="chart-panel" style="margin-bottom:24px">
      <h3>🔍 Pod 成本明细 <span style="font-size:12px;color:var(--muted);font-weight:400" id="pod-count"></span></h3>
      <div class="table-wrap">
        <table class="data-table" id="pods-table">
          <thead>
            <tr>
              <th>Pod</th>
              <th>命名空间</th>
              <th>服务</th>
              <th>环境</th>
              <th>团队</th>
              <th>CPU</th>
              <th>内存</th>
              <th>网络</th>
              <th>总计</th>
            </tr>
          </thead>
          <tbody id="pods-tbody">
            <tr><td colspan="9" class="loading-state"><div class="spinner" style="margin:20px auto"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Last refresh info -->
    <div style="text-align:center;padding:16px;color:var(--dim);font-size:11px">
      <span id="last-refresh">—</span>
      <span class="refresh-hint" onclick="refreshDashboard()" style="margin-left:8px">🔄 点击刷新</span>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script>
  /* ── Cost Dashboard Engine ── */
  (function() {
    'use strict';

    const API_BASE = '/api/v1/cost';

    /* ── API Helpers ── */

    async function fetchJSON(path) {
      try {
        const resp = await fetch(path);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        return await resp.json();
      } catch(e) {
        console.error('API error:', path, e);
        return null;
      }
    }

    /* ── Dashboard Render ── */

    async function refreshDashboard() {
      const agg = document.getElementById('filter-aggregation').value;
      const window = document.getElementById('filter-window').value;
      const env = document.getElementById('filter-environment').value;
      const svc = document.getElementById('filter-service').value.trim();

      // Build query params
      const params = new URLSearchParams({ aggregation: agg, window: window });
      if (env) params.set('environment', env);
      if (svc) params.set('service', svc);

      // Fetch summary, trends, pods in parallel
      const [summary, trends, pods] = await Promise.all([
        fetchJSON(`${API_BASE}/summary?${params.toString()}`),
        fetchJSON(`${API_BASE}/trends?${params.toString()}`),
        fetchJSON(`${API_BASE}/pods?${params.toString()}`),
      ]);

      // Update status
      updateStatus(summary);

      // Render sections
      renderSummary(summary);
      renderBreakdown(summary, agg);
      renderTrends(trends);
      renderPodsTable(pods);

      // Last refresh
      const now = new Date().toLocaleTimeString('zh-CN');
      document.getElementById('last-refresh').textContent = `最后更新: ${now}`;
    }

    function updateStatus(data) {
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');
      const cache = document.getElementById('cache-age');

      dot.className = 'status-dot';
      if (data && data.opencost_healthy) {
        dot.classList.add('healthy');
        text.textContent = '已连接';
        text.style.color = 'var(--lime)';
      } else if (data && !data.opencost_healthy) {
        dot.classList.add('unhealthy');
        text.textContent = '未连接';
        text.style.color = 'var(--pink)';
      } else {
        dot.classList.add('unknown');
        text.textContent = '未知';
      }

      if (data && data.cache_age_seconds != null) {
        cache.textContent = `缓存: ${Math.round(data.cache_age_seconds)}s`;
      } else {
        cache.textContent = '';
      }
    }

    function renderSummary(data) {
      const grid = document.getElementById('summary-grid');
      if (!data || !data.summary) {
        grid.innerHTML = '<div class="empty-state"><div class="icon">📭</div><div>暂无成本数据</div><div style="font-size:12px;color:var(--dim);margin-top:4px">请确保 OpenCost 已连接并数据在收集中</div></div>';
        return;
      }

      const s = data.summary;
      grid.innerHTML = `
        <div class="summary-card accent">
          <div class="card-label">总成本 (USD)</div>
          <div class="card-value">$${s.total_cost.toFixed(2)}</div>
          <div class="card-sub">${window || '24h'} 窗口</div>
        </div>
        <div class="summary-card">
          <div class="card-label">活跃 Pod</div>
          <div class="card-value">${s.total_pods}</div>
          <div class="card-sub">${s.by_service ? s.by_service.length : 0} 个服务</div>
        </div>
        <div class="summary-card">
          <div class="card-label">环境数</div>
          <div class="card-value">${s.by_environment ? s.by_environment.length : 0}</div>
          <div class="card-sub">${s.by_environment ? s.by_environment.map(e => `<span class="pill ${e.value}">${e.value}</span>`).join(' ') : ''}</div>
        </div>
        <div class="summary-card">
          <div class="card-label">团队数</div>
          <div class="card-value">${s.by_team ? s.by_team.length : 0}</div>
          <div class="card-sub">最大: ${s.by_team && s.by_team.length > 0 ? '$' + Math.max(...s.by_team.map(t => t.total_cost || 0)).toFixed(2) : '—'}</div>
        </div>
      `;
    }

    function renderBreakdown(data, dimension) {
      const container = document.getElementById('breakdown-chart');
      if (!data || !data.summary) {
        container.innerHTML = '<div class="empty-state"><div class="icon">📊</div><div>无数据</div></div>';
        return;
      }

      let items;
      if (dimension === 'service') items = data.summary.by_service || [];
      else if (dimension === 'environment') items = data.summary.by_environment || [];
      else items = data.summary.by_team || [];

      if (!items || items.length === 0) {
        container.innerHTML = '<div class="empty-state"><div style="font-size:12px">该维度下暂无数据</div></div>';
        return;
      }

      // Sort desc, take top 10
      const sorted = [...items].sort((a, b) => (b.total_cost || 0) - (a.total_cost || 0)).slice(0, 10);
      const maxCost = Math.max(...sorted.map(i => i.total_cost || 0), 0.01);

      container.innerHTML = `
        <div class="bar-chart">
          ${sorted.map(i => {
            const h = Math.max((i.total_cost / maxCost) * 180, 4);
            return `
              <div class="bar-item">
                <div class="bar-value">$${(i.total_cost || 0).toFixed(2)}</div>
                <div class="bar" style="height:${h}px" title="${i.value}: $${(i.total_cost || 0).toFixed(2)}"></div>
                <div class="bar-label">${escapeHtml(i.value || '?')}</div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderTrends(data) {
      const container = document.getElementById('trends-chart');
      if (!data || !data.trends || data.trends.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">📈</div><div>趋势数据不足</div><div style="font-size:12px;color:var(--dim)">需要至少两个时间点</div></div>';
        return;
      }

      // Show first series trend as simple line chart representation
      const series = data.trends[0];
      if (!series || !series.data_points || series.data_points.length === 0) {
        container.innerHTML = '<div class="empty-state"><div style="font-size:12px">暂无趋势数据</div></div>';
        return;
      }

      const points = series.data_points;
      const ms = points.map(p => p.cost || 0);
      const maxC = Math.max(...ms, 0.01);
      const minC = Math.min(...ms, 0);

      container.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:12px">
          <div style="display:flex;align-items:flex-end;gap:4px;height:180px;padding:0 10px">
            ${ms.map((c, i) => {
              const h = Math.max(((c - minC) / (maxC - minC || 1)) * 160, 4);
              const timeStr = points[i].timestamp ? points[i].timestamp.slice(11, 16) : '?';
              return `
                <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px" title="${timeStr}: $${c.toFixed(2)}">
                  <div style="font-size:9px;color:var(--dim)">$${c.toFixed(2)}</div>
                  <div style="width:100%;max-width:40px;height:${h}px;background:linear-gradient(180deg,var(--lime),rgba(152,245,167,0.2));border-radius:3px 3px 0 0;min-height:2px"></div>
                  <div style="font-size:8px;color:var(--dim);transform:rotate(-45deg);white-space:nowrap">${timeStr}</div>
                </div>
              `;
            }).join('')}
          </div>
          <div style="text-align:center;font-size:12px;color:var(--muted)">
            ${series.dimension}: ${series.value} · 总计: $${(series.total || 0).toFixed(2)}
          </div>
        </div>
      `;
    }

    function renderPodsTable(data) {
      const tbody = document.getElementById('pods-tbody');
      const countEl = document.getElementById('pod-count');

      if (!data || !data.pods || data.pods.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state"><div class="icon">🐳</div><div>暂无 Pod 数据</div><div style="font-size:12px;color:var(--dim)">等待 OpenCost 数据采集...</div></div></td></tr>';
        countEl.textContent = '';
        return;
      }

      countEl.textContent = `(共 ${data.pods.length} 个 Pod)`;

      tbody.innerHTML = data.pods.slice(0, 50).map(p => `
        <tr>
          <td style="font-family:monospace;font-size:12px">${escapeHtml(p.pod_name || '?')}</td>
          <td>${escapeHtml(p.namespace || 'default')}</td>
          <td><strong>${escapeHtml(p.service || '?')}</strong></td>
          <td><span class="pill ${(p.environment || '').toLowerCase()}">${escapeHtml(p.environment || '?')}</span></td>
          <td>${escapeHtml(p.team || '?')}</td>
          <td>$${(p.cpu_cost || 0).toFixed(2)}</td>
          <td>$${(p.ram_cost || 0).toFixed(2)}</td>
          <td>$${(p.network_cost || 0).toFixed(2)}</td>
          <td class="cost-positive">$${(p.total_cost || 0).toFixed(2)}</td>
        </tr>
      `).join('');

      if (data.pods.length > 50) {
        tbody.innerHTML += `<tr><td colspan="9" style="text-align:center;color:var(--dim);padding:12px">仅显示前 50 个 Pod，共 ${data.pods.length} 个</td></tr>`;
      }
    }

    function resetFilters() {
      document.getElementById('filter-aggregation').value = 'service';
      document.getElementById('filter-window').value = '24h';
      document.getElementById('filter-environment').value = '';
      document.getElementById('filter-service').value = '';
      refreshDashboard();
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ── Init ──
    refreshDashboard();

    // Auto-refresh every 60s
    setInterval(refreshDashboard, 60000);

  })();
  </script>
</body>
</html>
