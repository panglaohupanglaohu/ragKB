<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能体广场 — AgentsGroup2026</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* ── 安藤忠雄式清水混凝土 · Tadao Ando Exposed Concrete ─────── */
/* Light + Concrete + Geometry · 极度克制 · 结构即美 */
:root{
  --concrete:#23282E;--concrete-light:#30363D;--concrete-pale:#424A52;
  --concrete-dark:#1A1F25;--concrete-deep:#0F1419;
  --surface:#2D333A;--surface-light:#3B434C;
  --shadow:#06080B;--shadow-soft:#0F141940;
  --slit-light:#CFD6DD;--slit-glow:#A6B0BA;
  --bronze:#737C86;--bronze-light:#98A2AC;
  --ink:#EEF2F5;--text:#D7DEE4;--muted:#A2ABB4;--dim:#7C8792;
  --panel:#2A3037;--panel2:#21272D;
  --line:#4A535C;--line-light:#64707A;
  --font-serif:'Noto Serif SC',serif;
  --font-sans:'Noto Sans SC',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-sans);background:var(--concrete);color:var(--text);height:100vh;overflow:hidden}
/* Concrete formwork texture */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 120px,#00000008 120px,#00000008 121px),
             repeating-linear-gradient(90deg,transparent,transparent 80px,#00000005 80px,#00000005 81px);
  mix-blend-mode:multiply}

/* ── Top bar: concrete beam ── */
.top-bar{position:fixed;top:0;left:0;right:0;z-index:100;height:44px;
  background:#262C33F0;backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:16px;
  box-shadow:0 1px 0 #00000010}
.top-bar .logo{font-family:var(--font-sans);font-size:13px;font-weight:600;color:var(--ink);letter-spacing:4px;text-transform:uppercase}
.top-bar .nav-links{display:flex;gap:4px;margin-left:auto}
.top-bar .nav-links a{color:var(--muted);text-decoration:none;font-size:11px;padding:6px 14px;
  transition:all 0.3s;letter-spacing:0.5px}
.top-bar .nav-links a:hover{color:var(--ink)}
.top-bar .nav-links a.active{color:var(--slit-glow);border-bottom:1px solid var(--slit-glow)}

/* ── Layout ── */
.layout{display:grid;grid-template-columns:220px 1fr 360px;height:calc(100vh - 44px);margin-top:44px}

/* ── Left: concrete wall panel ── */
.left{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.left .hd{padding:20px 16px 14px;border-bottom:1px solid var(--line)}
.left .hd h2{font-family:var(--font-sans);font-size:12px;font-weight:600;color:var(--ink);letter-spacing:3px;text-transform:uppercase}
.left .hd .sub{font-size:9px;color:var(--dim);margin-top:4px;letter-spacing:1px;font-family:var(--font-mono)}
.left .list{flex:1;overflow-y:auto;padding:6px 8px}
.plaza-card{padding:12px 14px;margin-bottom:4px;background:transparent;border:1px solid transparent;
  cursor:pointer;transition:all 0.3s}
.plaza-card:hover{background:#00000008;border-color:var(--line-light)}
.plaza-card.active{border-left:2px solid var(--slit-glow);background:#6B737B10;padding-left:12px}
.plaza-card .nm{font-weight:400;font-size:12px;color:var(--text);letter-spacing:0.3px}
.plaza-card .mt{font-size:9px;color:var(--dim);display:flex;gap:10px;margin-top:4px;font-family:var(--font-mono)}
.plaza-card{position:relative}
.plaza-card .btn-del{position:absolute;top:8px;right:8px;width:20px;height:20px;border:none;background:transparent;
  color:var(--dim);cursor:pointer;font-size:14px;line-height:1;opacity:0;transition:opacity 0.2s;display:flex;align-items:center;justify-content:center;border-radius:50%}
.plaza-card:hover .btn-del{opacity:0.6}
.plaza-card .btn-del:hover{opacity:1;color:#E25555;background:#E2555515}
.plaza-card .btn-edit{position:absolute;top:8px;right:30px;width:20px;height:20px;border:none;background:transparent;
  color:var(--dim);cursor:pointer;font-size:12px;line-height:1;opacity:0;transition:opacity 0.2s;display:flex;align-items:center;justify-content:center;border-radius:50%}
.plaza-card:hover .btn-edit{opacity:0.6}
.plaza-card .btn-edit:hover{opacity:1;color:var(--slit-glow);background:rgba(166,176,186,0.1)}
.btn-new{margin:10px 8px;padding:9px 14px;background:transparent;border:1px solid var(--line);
  color:var(--muted);font-size:10px;cursor:pointer;letter-spacing:1px;transition:all 0.3s;font-family:var(--font-mono)}
.btn-new:hover{border-color:var(--slit-glow);color:var(--slit-glow)}

/* ── Center: Three.js ── */
.center{position:relative;overflow:hidden;background:var(--concrete)}
#three-canvas{width:100%;height:100%;display:block}
.speech-bubble{position:absolute;max-width:380px;padding:12px 16px;
  background:transparent;border:1px solid color-mix(in srgb, var(--bubble-color, var(--slit-glow)) 40%, transparent);
  border-radius:16px;outline:1px solid #FFFFFF10;
  font-size:11px;line-height:1.55;color:var(--bubble-color, var(--text));
  pointer-events:auto;opacity:0;transform:translateY(8px);
  transition:opacity 0.18s ease-out,transform 0.18s ease-out,filter 0.18s ease-out,box-shadow 0.18s ease-out,border-color 0.18s ease-out;z-index:50;
  box-shadow:0 0 18px color-mix(in srgb, var(--bubble-color, #fff) 16%, transparent), inset 0 0 14px #FFFFFF08}
.speech-bubble.show{opacity:1;transform:translateY(0)}
.speech-bubble::after{content:'';position:absolute;left:50%;bottom:-7px;width:12px;height:12px;
  background:transparent;border-right:1px solid color-mix(in srgb, var(--bubble-color, var(--slit-glow)) 40%, transparent);
  border-bottom:1px solid color-mix(in srgb, var(--bubble-color, var(--slit-glow)) 40%, transparent);
  transform:translateX(-50%) rotate(45deg)}
.speech-bubble .sb-name{font-weight:700;font-size:9px;color:var(--bubble-color, var(--slit-glow));margin-bottom:2px;letter-spacing:0.8px;text-transform:uppercase;text-shadow:0 0 10px color-mix(in srgb, var(--bubble-color, #fff) 55%, transparent)}
.speech-bubble .sb-text{white-space:pre-wrap;word-break:break-word;font-size:10px;color:var(--bubble-color, var(--text));text-shadow:0 0 12px color-mix(in srgb, var(--bubble-color, #fff) 45%, transparent), 0 0 3px color-mix(in srgb, var(--bubble-color, #fff) 75%, transparent);
  max-height:7.8em;overflow-y:auto;scroll-behavior:smooth}
.speech-bubble .sb-text::-webkit-scrollbar{width:4px}
.speech-bubble .sb-text::-webkit-scrollbar-track{background:transparent}
.speech-bubble .sb-text::-webkit-scrollbar-thumb{background:color-mix(in srgb, var(--bubble-color, var(--slit-glow)) 50%, transparent);border-radius:2px}
.speech-bubble .sb-text::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb, var(--bubble-color, var(--slit-glow)) 80%, transparent)}
.speech-bubble.history{opacity:0.14;transform:translateY(0) scale(0.975);filter:brightness(0.52) saturate(0.55);border-color:color-mix(in srgb, var(--bubble-color, var(--slit-glow)) 10%, transparent);box-shadow:0 0 4px color-mix(in srgb, var(--bubble-color, #fff) 4%, transparent), inset 0 0 6px #FFFFFF02}
.speech-bubble.history::after{border-right-color:color-mix(in srgb, var(--bubble-color, var(--slit-glow)) 20%, transparent);border-bottom-color:color-mix(in srgb, var(--bubble-color, var(--slit-glow)) 20%, transparent)}
.speech-bubble.history .sb-name{opacity:0.45;text-shadow:none}
.speech-bubble.history .sb-text{opacity:0.38;text-shadow:none}
.speech-bubble.speaking{box-shadow:0 0 26px color-mix(in srgb, var(--bubble-color, #fff) 24%, transparent), inset 0 0 16px #FFFFFF0E}

/* ── TTS speaker button ── */
.tts-btn{position:absolute;top:12px;right:12px;z-index:60;width:34px;height:34px;border-radius:50%;
  background:color-mix(in srgb, var(--concrete) 80%, transparent);border:1px solid var(--line);
  color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all 0.3s;backdrop-filter:blur(4px)}
.tts-btn:hover{border-color:var(--slit-glow);color:var(--slit-glow)}
.tts-btn.muted{opacity:0.5}
.tts-btn.paused{border-color:#F0A050;color:#F0A050}
.tts-btn svg{width:16px;height:16px;fill:currentColor}

/* ── Right panel ── */
.right{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.section{padding:14px 16px;border-bottom:1px solid var(--line)}
.sec-title{font-family:var(--font-mono);font-size:9px;font-weight:400;color:var(--dim);
  margin-bottom:8px;letter-spacing:2px;text-transform:uppercase}
.disc-item{padding:10px 12px;margin-bottom:3px;background:transparent;border:1px solid transparent;
  cursor:pointer;font-size:11px;transition:all 0.3s}
.disc-item:hover{border-color:var(--line-light)}
.disc-item.active{border-left:2px solid var(--slit-glow);background:#6B737B10;padding-left:10px}
.disc-item .dh{display:flex;align-items:flex-start;gap:10px}
.disc-item .tp{font-weight:400;margin-bottom:3px;color:var(--text)}
.disc-item .dm{font-size:9px;color:var(--dim);display:flex;gap:8px;font-family:var(--font-mono)}
.disc-del{margin-left:auto;flex:0 0 auto;padding:2px 8px;background:transparent;border:1px solid var(--line);color:var(--dim);font-size:9px;cursor:pointer;transition:all 0.3s;font-family:var(--font-mono)}
.disc-del:hover{border-color:#A46C6C;color:#D7B8B8}
.disc-act{padding:2px 8px;background:transparent;border:1px solid var(--line);color:var(--dim);font-size:9px;cursor:pointer;transition:all 0.3s;font-family:var(--font-mono)}
.disc-act:hover{border-color:var(--slit-glow);color:var(--slit-glow)}
.msg-log{flex:1;overflow-y:auto;padding:12px 16px;font-size:13px;min-height:0}
.msg-entry{margin-bottom:12px;padding:10px 12px;border-left:2px solid var(--line);
  background:#00000006}
.msg-entry .me-name{font-weight:600;color:var(--muted);font-size:11px;letter-spacing:0.5px;text-transform:uppercase}
.msg-entry .me-text{color:var(--text);line-height:1.9;margin-top:4px;font-size:13px}
.msg-entry.mod{border-left-color:var(--slit-glow)}
.msg-entry.mod .me-name{color:var(--bronze)}
.msg-entry.user{border-left-color:#5b9bd5;background:rgba(91,155,213,0.05)}
.msg-entry.user .me-name{color:#5b9bd5}
.round-sep{text-align:center;color:var(--dim);font-size:9px;margin:14px 0;position:relative;letter-spacing:3px;font-family:var(--font-mono)}
.round-sep::before,.round-sep::after{content:'';position:absolute;top:50%;width:28%;height:1px;background:var(--line)}
.round-sep::before{left:0}.round-sep::after{right:0}
#plan-panel{max-height:30vh;overflow-y:auto;border-top:1px solid var(--line);flex-shrink:0}
.plan-card{margin:10px 14px;padding:12px 14px;background:#00000008;border-left:2px solid var(--slit-glow)}
.plan-card h4{font-size:11px;font-weight:600;color:var(--slit-glow);margin-bottom:8px;letter-spacing:2px;text-transform:uppercase}
.plan-card .plan-text{font-size:11px;line-height:1.8;color:var(--text)}
.plan-card .plan-text strong{color:var(--ink)}
.plan-card .plan-text code{background:#00000008;padding:1px 4px;font-size:10px;font-family:var(--font-mono)}
.plan-card .assign-row{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.plan-card .plan-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.plan-btn{padding:5px 14px;border:1px solid var(--line);color:var(--text);font-size:10px;font-family:var(--font-sans);
  cursor:pointer;transition:all .25s;border-radius:2px;background:var(--surface-light);letter-spacing:.5px}
.plan-btn:hover{border-color:var(--slit-glow);color:var(--ink);background:var(--concrete-pale)}
.plan-btn.primary{border-color:var(--slit-glow);color:var(--ink);background:var(--concrete-pale)}
.plan-btn.primary:hover{background:var(--bronze);border-color:var(--bronze-light)}
.plan-btn.accent{border-color:var(--bronze);color:var(--slit-light)}
.plan-btn.accent:hover{background:var(--bronze);color:var(--ink)}
.mod-actions{border-top:1px dashed var(--line);margin-top:4px}
.mod-actions .btn{padding:4px 10px;border-radius:3px;cursor:pointer;transition:opacity .15s}
.mod-actions .btn:hover{opacity:.85}
.plan-card select{padding:5px 8px;background:var(--surface-light);border:1px solid var(--line);color:var(--text);font-size:10px}
.ctrl-bar{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex-shrink:0}
.chat-input-bar{display:flex;gap:8px;padding:8px 16px;border-top:1px solid var(--line);align-items:center;flex-shrink:0}
.chat-input{flex:1;padding:8px 12px;background:var(--surface-light,#2a2f34);border:1px solid var(--line);color:var(--text);font-size:11px;font-family:var(--font-sans);outline:none;border-radius:3px}
.chat-input:focus{border-color:var(--slit-glow)}
.chat-input::placeholder{color:var(--dim)}
.chat-send-btn{padding:7px 14px;background:var(--slit-glow);border:none;color:#fff;font-size:10px;font-weight:600;cursor:pointer;letter-spacing:0.5px;transition:all 0.2s}
.chat-send-btn:hover{background:#596168}
.chat-send-btn:disabled{opacity:0.3;cursor:not-allowed}
.btn-start{padding:7px 20px;background:var(--slit-glow);border:none;
  color:#FFF;font-size:11px;font-weight:600;cursor:pointer;
  letter-spacing:1px;transition:all 0.3s;text-transform:uppercase}
.btn-start:hover{background:#596168}
.btn-start:disabled{opacity:0.25;cursor:not-allowed}
.btn{padding:5px 12px;background:transparent;border:1px solid var(--line);color:var(--muted);
  font-size:10px;cursor:pointer;transition:all 0.3s}
.btn:hover{border-color:var(--muted);color:var(--text)}
.ctrl-bar .status-text{margin-left:auto;font-size:9px;color:var(--dim);font-family:var(--font-mono)}
.pill{display:inline-block;padding:2px 8px;font-size:9px;letter-spacing:0.5px;font-family:var(--font-mono)}
.pill-open{color:var(--muted)}
.pill-in_progress{color:var(--slit-glow)}
.pill-summarizing{color:var(--bronze)}
.pill-closed{color:var(--dim)}

/* ── Modal: concrete slab ── */
.modal-overlay{position:fixed;inset:0;z-index:200;background:#2A262580;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface-light);border:1px solid var(--line);padding:28px;width:420px;max-width:90vw;
  box-shadow:0 20px 60px #00000030}
.modal h3{font-size:12px;font-weight:600;margin-bottom:20px;color:var(--ink);letter-spacing:2px;text-transform:uppercase}
.fg{margin-bottom:12px}
.fl{display:block;font-size:9px;color:var(--dim);margin-bottom:3px;letter-spacing:1px;text-transform:uppercase;font-family:var(--font-mono)}
.fi{width:100%;padding:8px 10px;background:var(--concrete-pale);border:1px solid var(--line);color:var(--text);
  font-size:11px;font-family:var(--font-sans);outline:none;transition:border 0.3s}
.fi:focus{border-color:var(--slit-glow)}
textarea.fi{resize:vertical;min-height:45px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn-primary{padding:7px 20px;background:var(--slit-glow);border:none;
  color:#FFF;font-size:11px;font-weight:600;cursor:pointer;letter-spacing:1px;text-transform:uppercase}
.btn-cancel{padding:7px 16px;background:transparent;border:1px solid var(--line);color:var(--dim);
  font-size:11px;cursor:pointer}
.toast-box{position:fixed;top:56px;right:16px;z-index:300}

/* ── Agent Tree Selector ── */
.agent-tree{max-height:260px;overflow-y:auto;border:1px solid var(--line);background:var(--concrete-pale);padding:6px 8px;margin-top:4px}
.agent-tree::-webkit-scrollbar{width:4px}
.agent-tree::-webkit-scrollbar-thumb{background:var(--dim);border-radius:2px}
.tree-team{margin-bottom:6px}
.tree-team-header{display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px 0;user-select:none}
.tree-team-header .tree-arrow{font-size:8px;color:var(--dim);transition:transform .2s;display:inline-block;width:10px}
.tree-team-header .tree-arrow.open{transform:rotate(90deg)}
.tree-team-header label{font-size:10px;font-weight:600;color:var(--ink);cursor:pointer;letter-spacing:0.5px}
.tree-team-header input[type="checkbox"]{accent-color:var(--slit-glow);cursor:pointer}
.tree-agents{padding-left:22px;display:none}
.tree-agents.open{display:block}
.tree-agent{display:flex;align-items:center;gap:6px;padding:3px 0}
.tree-agent input[type="checkbox"]{accent-color:var(--slit-glow);cursor:pointer}
.tree-agent label{font-size:10px;color:var(--text);cursor:pointer}
.tree-agent .agent-role{font-size:9px;color:var(--dim);margin-left:4px}
.chair-select{width:100%;padding:8px 10px;background:var(--concrete-pale);border:1px solid var(--line);color:var(--text);font-size:11px;font-family:var(--font-sans);outline:none}
.chair-select:focus{border-color:var(--slit-glow)}
.tree-count{font-size:9px;color:var(--dim);margin-left:auto;font-family:var(--font-mono)}
.toast{padding:8px 16px;margin-bottom:4px;background:#C6CBD0F0;backdrop-filter:blur(8px);
  border-left:2px solid var(--slit-glow);font-size:11px;color:var(--text);
  box-shadow:0 4px 16px #00000015;animation:tin 0.4s ease}
@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:0}
</style>
</head>
<body>

<div class="top-bar">
  <span class="logo">议事广场</span>
  <div class="nav-links">
    <a href="/agent-team-config.html">智能体团队</a>
    <a href="/system-evolution.html">系统演进</a>
    <a href="/skill-extract.html">技能萃取</a>
  </div>
</div>

<div class="layout">
  <div class="left">
    <div class="hd"><h2>广场</h2><div class="sub">CONCRETE ARENA</div></div>
    <div class="list" id="plaza-list"><div style="padding:20px;color:var(--dim);text-align:center;font-size:10px">加载中…</div></div>
    <button class="btn-new" onclick="openCreatePlaza()">+ CREATE</button>
  </div>

  <div class="center" id="arena-container">
    <canvas id="three-canvas"></canvas>
    <button class="tts-btn" id="tts-toggle" title="语音播报">
      <svg id="tts-icon-on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      <svg id="tts-icon-off" style="display:none" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
    </button>
    <button class="tts-btn" id="pause-toggle" style="top:52px;right:12px" title="暂停/继续">
      <svg id="pause-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      <svg id="play-icon" style="display:none" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
  </div>

  <div class="right">
    <div class="section" id="disc-section">
      <div class="sec-title">DISCUSSIONS</div>
      <div id="disc-list"><div style="color:var(--dim);font-size:10px">先选择广场</div></div>
      <button class="btn" style="width:100%;margin-top:8px" onclick="openCreateDisc()">+ 新建讨论</button>
    </div>
    <div class="msg-log" id="msg-log">
      <div style="text-align:center;padding:40px 0;color:var(--dim);font-size:10px;letter-spacing:1px;font-family:var(--font-mono)">
        SELECT PLAZA · CREATE DISCUSSION<br>全员自动入座
      </div>
    </div>
    <div id="plan-panel" style="display:none"></div>
    <div class="chat-input-bar" id="chat-input-bar">

/* ── Material factories ── */

/* ── Ground ── */
const ground = new THREE.Mesh(

/* ── Tiered Arena: Ando stepped concrete ── */
const tierDefs = [

  // Formwork seam

/* ═══ 议事长座椅 — Carlo Scarpa 层叠几何 ═══ */
const throneGroup = new THREE.Group();

// Layer 1: Large concrete base (rotated slightly)

// Layer 2: Graphite plate, offset

base2.castShadow = true;

// Layer 3: Concrete step
const base3 = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.15, 1.3), concreteMat(0xB0B6BC, 0.84));
base3.position.set(-0.04, 0.30, -0.02); base3.rotation.y = Math.PI / 40;
base3.castShadow = true;

// Seat: cantilevered graphite slab
const seatMesh = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.07, 0.85), bronzeMat(0x687078, 0.32));
seatMesh.position.set(0, 0.56, 0.08);
seatMesh.castShadow = true;
throneGroup.add(seatMesh);

// Armrests: asymmetric (Scarpa)
const armL = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.06, 0.75), concreteMat(0xA6ADB4, 0.86));
armL.position.set(-0.62, 0.82, 0.05);

const armR = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.06, 0.70), bronzeMat(0x5E666E, 0.32));
armR.position.set(0.62, 0.72, 0.05);
throneGroup.add(armR);

// Sky beam: visible shaft of light falling onto the chairman seat
const throneLight = new THREE.SpotLight(0xF4F7FA, 1.95, 22, Math.PI / 18, 0.12, 1.9);

throneGroup.add(throneLight.target);

const crossFill = new THREE.SpotLight(0xE6ECF1, 0.16, 10, Math.PI / 24, 0.18, 1.8);

/* ═══════════ AGENT FIGURE — 发光轮廓 ═══════════ */
const agentMeshes = new Map();
const sceneAgents = [];

function makeTextCanvas(text, color) {
  const c = document.createElement('canvas');
  c.width = 384; c.height = 104;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 384, 104);
  ctx.font = '800 34px "Noto Sans SC", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = color || '#2A2625';
  ctx.fillText(text, 192, 52);
  return c;
}

function createAgentFigure(name, hexColor, isChairman = false) {
  const group = new THREE.Group();
  const col = new THREE.Color(hexColor);
  const scale = isChairman ? 1.3 : 1.0;
  group.userData.labelColor = `#${col.getHexString()}`;
  group.userData.bubbleOffsetY = (isChairman ? 3.15 : 2.9) * scale;

  const outlineMat = new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.7, side: THREE.DoubleSide });
  const glowMat = new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.28, side: THREE.DoubleSide });

  // Head ring
  const headR = 0.34 * scale, headTube = 0.035 * scale;
  const head = new THREE.Mesh(new THREE.TorusGeometry(headR, headTube, 12, 32), outlineMat);
  head.position.y = 2.0 * scale;
  group.add(head);

  // Head glow
  const headGlow = new THREE.Mesh(new THREE.TorusGeometry(headR, headTube * 4, 12, 32), glowMat);
  headGlow.position.copy(head.position);
  group.add(headGlow);

  // Body U-arc
  const pts = [];
  for (let i = 0; i <= 32; i++) {
    const t = i / 32, a = Math.PI * t;
    pts.push(new THREE.Vector3(-Math.cos(a) * 0.48 * scale, (1.25 - Math.sin(a) * 0.65) * scale, 0));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  group.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 32, 0.035 * scale, 8, false), outlineMat));
  group.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 32, 0.12 * scale, 8, false), glowMat));

  // Light
  const pLight = new THREE.PointLight(col, isChairman ? 0.95 : 0.55, isChairman ? 8 : 5.5);
  pLight.position.y = 1.4 * scale;
  group.add(pLight);

  // Ground ring
  const glowRing = new THREE.Mesh(
    new THREE.RingGeometry(0.35 * scale, 0.55 * scale, 32),
    new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.22, side: THREE.DoubleSide })
  );
  glowRing.rotation.x = -Math.PI / 2; glowRing.position.y = 0.01;
  group.add(glowRing);
  group.userData.glowRing = glowRing;

  // Name
  const tex = new THREE.CanvasTexture(makeTextCanvas(name, '#2A2625'));
  tex.minFilter = THREE.LinearFilter;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sprite.position.y = (isChairman ? 3.12 : 2.84) * scale;
  sprite.scale.set(2.7, 0.72, 1);
  group.add(sprite);

  return group;
}

/* ── Place agents ── */
function renderArena3D(participants) {
  allParticipants = participants || [];
  sceneAgents.forEach(g => scene.remove(g));
  sceneAgents.length = 0;
  agentMeshes.clear();
  if (!allParticipants.length) return;

  const groups = {};
  allParticipants.forEach(p => {
    const t = p.team_id || '_none';
    if (!groups[t]) groups[t] = [];
    groups[t].push(p);
  });

  let chairman = null;
  if (curDiscData?.moderator_agent_id) chairman = allParticipants.find(p => p.agent_id === curDiscData.moderator_agent_id);
  if (!chairman) chairman = allParticipants.find(p => p.niche_role === 'moderator');
  if (!chairman && allParticipants.length) chairman = allParticipants[0];
  const seated = allParticipants.filter(p => !chairman || p.agent_id !== chairman.agent_id);

  // Chairman on Scarpa throne
  if (chairman) {
    const fig = createAgentFigure(chairman.agent_name || '议事长', 0x8F979E, true);
    fig.position.set(0, 0.0, 0.5);
    scene.add(fig); sceneAgents.push(fig);
    agentMeshes.set(chairman.agent_id, { group: fig });
  }

  // Agents on tiers
  if (seated.length > 0) {
    const ringRadii = [6.5, 11, 16.5];
    const ringHeights = [0.7, 1.5, 2.4];
    const ringMax = [8, 12, 20];
    const rings = [[], [], []];
    let ri = 0;
    seated.forEach(ag => {
      while (ri < 2 && rings[ri].length >= ringMax[ri]) ri++;
      rings[Math.min(ri, 2)].push(ag);
    });
    rings.forEach((ring, rIdx) => {
      if (!ring.length) return;
      ring.forEach((ag, ai) => {
        const angle = (ai / ring.length) * Math.PI * 2 - Math.PI / 2;
        const fig = createAgentFigure(ag.agent_name || ag.agent_id, tColor(ag.team_id));
        fig.position.set(ringRadii[rIdx] * Math.cos(angle), ringHeights[rIdx], ringRadii[rIdx] * Math.sin(angle));
        fig.lookAt(0, ringHeights[rIdx], 0);
        fig.rotation.x = 0; fig.rotation.z = 0;
        scene.add(fig); sceneAgents.push(fig);
        agentMeshes.set(ag.agent_id, { group: fig });
      });
    });
  }

  // Team labels
  Object.keys(groups).forEach(tid => {
    const agents = groups[tid].filter(p => !chairman || p.agent_id !== chairman.agent_id);
    if (!agents.length) return;
    let sumA = 0;
    agents.forEach(ag => { const e = agentMeshes.get(ag.agent_id); if (e) sumA += Math.atan2(e.group.position.z, e.group.position.x); });
    const avg = sumA / agents.length;
    const tex = new THREE.CanvasTexture(makeTextCanvas(teamNames[tid] || tid, teamCSS[tid] || '#7A7470'));
    tex.minFilter = THREE.LinearFilter;
    const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
    label.position.set(23 * Math.cos(avg), 3.5, 23 * Math.sin(avg));
    label.scale.set(2.5, 0.6, 1);
    scene.add(label); sceneAgents.push(label);
  });
}

/* ── Speaking ── */
function highlightSpeaker(agentId, speaking) {
  const e = agentMeshes.get(agentId);
  if (!e) return;
  const ring = e.group.userData.glowRing;
  if (ring) { ring.material.opacity = speaking ? 0.35 : 0.08; const s = speaking ? 1.4 : 1; ring.scale.set(s, s, 1); }
}

let bubbles = [];
let speechQueue = [];
let speechPlaybackActive = false;
let speechPlaybackToken = 0;
const MAX_VISIBLE_BUBBLES = 3;
const MAX_BUBBLE_LINES = 5;
const MAX_WINDOW_CHARS = 100;
const SPEECH_GAP_MS = 250;

// Audio autoplay unlock: create silent AudioContext on first user gesture
let _audioUnlocked = false;
function unlockAudio() {
  if (_audioUnlocked) return;
  _audioUnlocked = true;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buf; src.connect(ctx.destination); src.start(0);
    // Also play a silent HTML5 Audio to unlock that path
    const a = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');
    a.volume = 0; a.play().catch(() => {});
  } catch(e) {}
}
document.addEventListener('click', unlockAudio, { once: true });
document.addEventListener('touchstart', unlockAudio, { once: true });

function wait(ms) {
  return new Promise(resolve => {
    const check = () => {
      if (!speechPaused) { resolve(); return; }
      setTimeout(check, 100);
    };
    setTimeout(check, ms);
  });
}

function buildSpeechWindows(text) {
  const normalized = String(text ?? '')
    .replace(/\r/g, '')
    .replace(/[ \t]+\n/g, '\n')
    .trim();
  if (!normalized) return [];
  // Split into natural paragraphs (double newline or explicit breaks)
  const paragraphs = normalized.split(/\n{2,}/).map(p => p.trim()).filter(Boolean);
  // If only one paragraph, split by sentence boundaries to group ~6 lines
  const sentences = paragraphs.length > 1
    ? paragraphs
    : normalized.split(/(?<=[。！？!?；;…])\s*/).map(s => s.trim()).filter(Boolean);
  // Group sentences into windows of ~MAX_WINDOW_CHARS / ~MAX_BUBBLE_LINES
  const windows = [];
  let buf = [];
  let bufLen = 0;
  let bufLines = 0;
  for (const s of sentences) {
    const sLines = Math.ceil(s.length / 28); // ~28 chars per visual line at 380px
    if (buf.length && (bufLen + s.length > MAX_WINDOW_CHARS || bufLines + sLines > MAX_BUBBLE_LINES)) {
      windows.push(buf.join('\n'));
      buf = []; bufLen = 0; bufLines = 0;
    }
    buf.push(s); bufLen += s.length; bufLines += sLines;
  }
  if (buf.length) windows.push(buf.join('\n'));
  return windows.length ? windows : [normalized];
}

function getSpeechWindowDuration(text, isFinal) {
  const readableLength = text.replace(/\s/g, '').length;
  const base = 1600 + readableLength * 52;
  return Math.max(2400, Math.min(isFinal ? 5500 : 4500, base));
}

function getQueuedSpeechDuration() {
  return speechQueue.reduce((total, item) => {
    const itemDuration = (item.windows || []).reduce((sum, windowText, index) => {
      return sum + getSpeechWindowDuration(windowText, index === item.windows.length - 1) + (index < item.windows.length - 1 ? SPEECH_GAP_MS : 0);
    }, 0);
    return total + itemDuration;
  }, 0);
}

function trimBubbleHistory() {
  while (bubbles.length > MAX_VISIBLE_BUBBLES) {
    const oldest = bubbles.shift();
    if (!oldest) break;
    oldest.bubble.classList.remove('show');
    setTimeout(() => oldest.bubble.remove(), 400);
    highlightSpeaker(oldest.agentId, false);
  }
}

function positionSpeechBubble(entry) {
  const bubbleEntry = agentMeshes.get(entry.agentId);
  if (!bubbleEntry?.group?.parent || !entry.bubble?.isConnected) return;
  const pos = new THREE.Vector3();
  bubbleEntry.group.getWorldPosition(pos);
  pos.y += bubbleEntry.group.userData.bubbleOffsetY || 4.2;
  const projected = pos.clone().project(camera);
  const rect = canvas.getBoundingClientRect();
  const sx = (projected.x * 0.5 + 0.5) * rect.width;
  const sy = (-projected.y * 0.5 + 0.5) * rect.height;
  const bubbleRect = entry.bubble.getBoundingClientRect();
  entry.bubble.style.left = Math.max(8, Math.min(sx - bubbleRect.width / 2, rect.width - bubbleRect.width - 8)) + 'px';
  entry.bubble.style.top = Math.max(8, Math.min(sy - bubbleRect.height - 12, rect.height - bubbleRect.height - 8)) + 'px';
  const hidden = projected.z > 1 || projected.z < -1 || projected.x < -1.15 || projected.x > 1.15 || projected.y < -1.15 || projected.y > 1.15;
  entry.bubble.style.display = hidden ? 'none' : 'block';
}

function showSpeechBubble(agentId, name, text) {
  speechQueue.push({ agentId, name, windows: buildSpeechWindows(text) });
  processSpeechQueue();
}

async function processSpeechQueue() {
  if (speechPlaybackActive) return;
  speechPlaybackActive = true;
  const token = speechPlaybackToken;
  while (speechQueue.length && token === speechPlaybackToken) {
    const item = speechQueue.shift();
    if (!item?.windows?.length) continue;
    await playSpeechItem(item, token);
  }
  if (token === speechPlaybackToken) speechPlaybackActive = false;
}

async function playSpeechItem(item, token) {
  const entry = agentMeshes.get(item.agentId);
  if (!entry) return;
  panCameraToAgent(item.agentId);
  bubbles.forEach(b => b.bubble.classList.add('history'));
  removeBubble(item.agentId);
  highlightSpeaker(item.agentId, true);
  const b = document.createElement('div');
  b.className = 'speech-bubble speaking'; b.dataset.agent = item.agentId;
  b.style.setProperty('--bubble-color', entry.group.userData.labelColor || '#D7DEE4');
  b.innerHTML = `<div class="sb-name">${esc(item.name)}</div><div class="sb-text"></div>`;
  container.appendChild(b); requestAnimationFrame(() => b.classList.add('show'));
  const bubbleState = { agentId: item.agentId, bubble: b, textNode: b.querySelector('.sb-text') };
  bubbles.push(bubbleState);
  trimBubbleHistory();
  positionSpeechBubble(bubbleState);
  for (let index = 0; index < item.windows.length; index += 1) {
    if (token !== speechPlaybackToken || !bubbleState.bubble.isConnected) return;
    if (index === 0) {
      bubbleState.textNode.textContent = item.windows[index];
    } else {
      bubbleState.textNode.textContent += '\n' + item.windows[index];
    }
    bubbleState.textNode.scrollTop = bubbleState.textNode.scrollHeight;
    positionSpeechBubble(bubbleState);
    await ttsSpeak(item.windows[index], token, item.name);
    if (index < item.windows.length - 1) await wait(SPEECH_GAP_MS);
  }
  if (token !== speechPlaybackToken || !bubbleState.bubble.isConnected) return;
  bubbleState.bubble.classList.remove('speaking');
  bubbleState.bubble.classList.add('history');
  highlightSpeaker(item.agentId, false);
}

function removeBubble(aid) {
  bubbles = bubbles.filter(b => { if (b.agentId === aid) { b.bubble.classList.remove('show'); setTimeout(() => b.bubble.remove(), 400); return false; } return true; });
}

function clearSpeechPlayback() {
  speechQueue = [];
  speechPlaybackToken += 1;
  speechPlaybackActive = false;
  speechPaused = false;
  updatePauseUI();
  if (ttsAudio) { ttsAudio.pause(); ttsAudio = null; }
  if (window.speechSynthesis) speechSynthesis.cancel();
  bubbles.forEach(b => {
    b.bubble.classList.remove('show');
    setTimeout(() => b.bubble.remove(), 400);
    highlightSpeaker(b.agentId, false);
  });
  bubbles = [];
}

/* ═══════════ TTS ENGINE (GPT-SoVITS + Web Speech fallback) ═══════════ */
let ttsMuted = localStorage.getItem('plaza_ttsMuted') === 'true'; // default to unmuted
let speechPaused = false;
let ttsAudio = null; // current playing Audio element
let ttsPlaybackSerial = 0;
const ttsBtn = document.getElementById('tts-toggle');
const ttsIconOn = document.getElementById('tts-icon-on');
const ttsIconOff = document.getElementById('tts-icon-off');
const pauseBtn = document.getElementById('pause-toggle');
const pauseIcon = document.getElementById('pause-icon');
const playIcon = document.getElementById('play-icon');

function updateTtsUI() {
  ttsBtn.classList.toggle('muted', ttsMuted);
  ttsIconOn.style.display = ttsMuted ? 'none' : 'block';
  ttsIconOff.style.display = ttsMuted ? 'block' : 'none';
}
function updatePauseUI() {
  pauseBtn.classList.toggle('paused', speechPaused);
  pauseIcon.style.display = speechPaused ? 'none' : 'block';
  playIcon.style.display = speechPaused ? 'block' : 'none';
}
ttsBtn.addEventListener('click', () => {
  ttsMuted = !ttsMuted;
  localStorage.setItem('plaza_ttsMuted', String(ttsMuted));
  updateTtsUI();
  if (ttsMuted && ttsAudio) { ttsAudio.pause(); ttsAudio = null; }
  if (ttsMuted && window.speechSynthesis) speechSynthesis.cancel();
});
pauseBtn.addEventListener('click', () => {
  speechPaused = !speechPaused;
  updatePauseUI();
  if (speechPaused) {
    if (ttsAudio) ttsAudio.pause();
    if (window.speechSynthesis) speechSynthesis.pause();
  } else {
    if (ttsAudio) ttsAudio.play().catch(err => console.warn('Audio resume failed:', err?.message || err));
    if (window.speechSynthesis) speechSynthesis.resume();
  }
});
updateTtsUI();
updatePauseUI();

function stopCurrentTtsAudio() {
  if (!ttsAudio) return;
  ttsAudio.pause();
  ttsAudio.src = '';
  ttsAudio = null;
}

function ttsFallbackSpeak(text, speed, serial) {
  if (ttsMuted || !window.speechSynthesis || serial !== ttsPlaybackSerial) return Promise.resolve(false);
  return new Promise(resolve => {
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = 'zh-CN';
    utt.rate = speed;
    utt.pitch = 0.82;
    utt.volume = 0.85;
    const voices = speechSynthesis.getVoices();
    const maleKeywords = ['reed', 'rocko', 'grandpa', 'eddy', 'yu-shu', 'wan-lung', 'kangkang', 'yunxi', 'yunjian', 'yunyang', 'male', 'xiaochen'];
    const zhVoices = voices.filter(v => v.lang.startsWith('zh'));
    const maleVoice = zhVoices.find(v => maleKeywords.some(k => v.name.toLowerCase().includes(k)));
    const finish = played => resolve(serial === ttsPlaybackSerial ? played : false);
    if (!maleVoice) {
      console.warn('Web Speech fallback skipped: no Chinese male voice available');
      finish(false);
      return;
    }
    utt.voice = maleVoice;
    utt.onend = () => finish(true);
    utt.onerror = () => finish(false);
    speechSynthesis.speak(utt);
    if (speechPaused) speechSynthesis.pause();
  });
}

async function ttsSpeak(text, playbackToken, agentName) {
  if (ttsMuted || playbackToken !== speechPlaybackToken) {
    console.warn('[TTS] Skipped: muted=', ttsMuted, 'tokenMatch=', playbackToken === speechPlaybackToken);
    return false;
  }
  const serial = ++ttsPlaybackSerial;
  stopCurrentTtsAudio();
  if (window.speechSynthesis) speechSynthesis.cancel();
  console.log('[TTS] Fetching audio for:', agentName, text.slice(0, 30));

  try {
    const resp = await fetch('/api/v1/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, text_lang: 'zh', speed_factor: 1.0, agent_name: agentName || '' })
    });
    if (!resp.ok) throw new Error(`TTS ${resp.status}`);
    const blob = await resp.blob();
    console.log('[TTS] Got blob:', blob.size, 'bytes');
    if (ttsMuted || playbackToken !== speechPlaybackToken || serial !== ttsPlaybackSerial) {
      console.warn('[TTS] Cancelled after fetch: muted=', ttsMuted, 'tokenMatch=', playbackToken === speechPlaybackToken, 'serialMatch=', serial === ttsPlaybackSerial);
      return false;
    }

    await new Promise((resolve, reject) => {
      let settled = false;
      const finish = callback => {
        if (settled) return;
        settled = true;
        clearTimeout(safetyTimer);
        callback();
      };
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      ttsAudio = audio;
      audio.volume = 0.85;

      // Safety timeout: if onended never fires, resolve after estimated duration + buffer
      const safetyTimer = setTimeout(() => {
        console.warn('[TTS] Safety timeout - forcing resolve');
        audio.pause(); audio.src = '';
        URL.revokeObjectURL(url);
        if (ttsAudio === audio) ttsAudio = null;
        finish(resolve);
      }, 30000); // 30s max per segment

      audio.onended = () => {
        URL.revokeObjectURL(url);
        if (ttsAudio === audio) ttsAudio = null;
        finish(resolve);
      };
      audio.onerror = () => {
        URL.revokeObjectURL(url);
        if (ttsAudio === audio) ttsAudio = null;
        finish(() => reject(new Error('audio-error')));
      };

      // Once we know the duration, set a tighter timeout
      audio.onloadedmetadata = () => {
        if (!settled && audio.duration && isFinite(audio.duration)) {
          clearTimeout(safetyTimer);
          const tightTimer = setTimeout(() => {
            if (!settled) {
              console.warn('[TTS] Duration timeout - forcing resolve after', audio.duration, 's');
              audio.pause(); audio.src = '';
              URL.revokeObjectURL(url);
              if (ttsAudio === audio) ttsAudio = null;
              finish(resolve);
            }
          }, (audio.duration + 2) * 1000);
        }
      };

      const abortPlayback = () => {
        audio.pause();
        audio.src = '';
        URL.revokeObjectURL(url);
        if (ttsAudio === audio) ttsAudio = null;
        finish(resolve);
      };

      const startPlayback = async () => {
        if (ttsMuted || playbackToken !== speechPlaybackToken || serial !== ttsPlaybackSerial) {
          abortPlayback();
          return;
        }
        try {
          await audio.play();
          console.log('[TTS] Playing audio successfully');
        } catch (err) {
          // Retry once after short delay (autoplay policy may clear after gesture)
          if (err?.name === 'NotAllowedError') {
            console.warn('[TTS] Autoplay blocked, retrying in 200ms...');
            await new Promise(r => setTimeout(r, 200));
            if (ttsMuted || playbackToken !== speechPlaybackToken || serial !== ttsPlaybackSerial) {
              abortPlayback(); return;
            }
            try { await audio.play(); console.log('[TTS] Retry play succeeded'); return; } catch(e2) {}
          }
          console.error('[TTS] audio.play() failed:', err?.message || err);
          URL.revokeObjectURL(url);
          if (ttsAudio === audio) ttsAudio = null;
          finish(resolve); // resolve instead of reject to continue queue
        }
      };

      if (speechPaused) {
        const waitUntilResumed = () => {
          if (ttsMuted || playbackToken !== speechPlaybackToken || serial !== ttsPlaybackSerial) {
            abortPlayback();
            return;
          }
          if (!speechPaused) {
            startPlayback();
            return;
          }
          setTimeout(waitUntilResumed, 100);
        };
        waitUntilResumed();
      } else {
        startPlayback();
      }
    });
    return true;
  } catch (err) {
    console.warn('Edge-TTS playback failed, using Web Speech:', err?.message || err);
    return ttsFallbackSpeak(text, 1.0, serial);
  }
}

/* ═══════════ CAMERA LOOK-AT (smooth pan to speaker from fixed seat) ═══════════ */
const CAM_LOOK_SPEED = 0.04; // lerp factor per frame
const camDefaultTarget = new THREE.Vector3(0, 1, 0); // center (PM throne)
let camTargetLookAt = camDefaultTarget.clone();
let camCurrentLookAt = camDefaultTarget.clone();
let camPanning = false;

function panCameraToAgent(agentId) {
  // If moderator (PM) speaks, keep looking at center — no movement
  if (curDiscData?.moderator_agent_id === agentId) return;
  const entry = agentMeshes.get(agentId);
  if (!entry) return;
  const pos = entry.group.position;
  // Look at a point slightly above the agent (where the bubble appears)
  camTargetLookAt.set(pos.x, pos.y + 2, pos.z);
  camPanning = true;
}

function updateCameraLookAt() {
  if (!camPanning) return;
  const dx = camTargetLookAt.x - camCurrentLookAt.x;
  const dy = camTargetLookAt.y - camCurrentLookAt.y;
  const dz = camTargetLookAt.z - camCurrentLookAt.z;
  if (Math.abs(dx) < 0.01 && Math.abs(dy) < 0.01 && Math.abs(dz) < 0.01) {
    camCurrentLookAt.copy(camTargetLookAt);
    camPanning = false;
  } else {
    camCurrentLookAt.x += dx * CAM_LOOK_SPEED;
    camCurrentLookAt.y += dy * CAM_LOOK_SPEED;
    camCurrentLookAt.z += dz * CAM_LOOK_SPEED;
  }
  controls.target.copy(camCurrentLookAt);
}

/* ═══════════ ANIMATION ═══════════ */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  updateCameraLookAt();
  controls.update();

  bubbles.forEach(positionSpeechBubble);

  // Chairman breathing
  if (allParticipants.length && curDiscData?.moderator_agent_id) {
    const ch = agentMeshes.get(curDiscData.moderator_agent_id);
    if (ch) ch.group.position.y = Math.sin(t * 0.6) * 0.02;
  }

  // Water shimmer
  throneGroup.children.forEach(c => {
    if (c.material?.metalness > 0.5 && c.material?.transparent) {
      c.material.opacity = 0.45 + Math.sin(t * 1.5) * 0.08;
    }
  });

  renderer.render(scene, camera);
}

function onResize() {
  const w = container.clientWidth, h = container.clientHeight;
  if (!w || !h) return;
  camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);
new ResizeObserver(onResize).observe(container);
onResize(); animate();

      const all = teamCbs.length;

      hdr.checked = chk === all && all > 0;
      hdr.indeterminate = chk > 0 && chk < all;
    }
  });
};

function getEditSelectedAgents() {
  const cbs = document.querySelectorAll('#edit-agent-tree input[type="checkbox"][data-aid]:checked');
  return [...cbs].map(cb => ({
    agent_id: cb.dataset.aid,
    agent_name: cb.dataset.aname,
    role: cb.dataset.arole,
    team_id: cb.dataset.team,
  }));
}

window.openEditPlaza = async function(plazaId) {
  _editPlazaId = plazaId;
  openM('m-edit-plaza');
  $('edit-agent-sel-count').textContent = '';
  $('edit-agent-tree').innerHTML = '<div style="color:var(--dim);font-size:10px;padding:8px">加载中...</div>';
  const [tree, plaza] = await Promise.all([
    api(`${API}/teams-tree`),
    api(`${API}/plaza/${plazaId}`)
  ]);
  $('edit-plaza-title').textContent = `编辑广场 — ${plaza?.name || ''}`;
  renderEditAgentTree(tree || [], plaza?.participants || []);
};

window.doSaveEditPlaza = async function() {
  if (!_editPlazaId) return;
  const selected = getEditSelectedAgents();
  if (!selected.length) { toast('请至少保留一个智能体'); return; }
  const newIds = new Set(selected.map(a => a.agent_id));
  // Remove agents no longer selected
  const toRemove = [..._editOriginalAgentIds].filter(id => !newIds.has(id));
  // Add newly selected agents
  const toAdd = selected.filter(a => !_editOriginalAgentIds.has(a.agent_id));
  let ok = true;
  for (const aid of toRemove) {
    const r = await api(`${API}/plaza/${_editPlazaId}/participants/${aid}`, { method: 'DELETE' });
    if (!r) ok = false;
  }
  if (toAdd.length) {
    const batch = toAdd.map(a => ({ agent_id: a.agent_id, agent_name: a.agent_name, role: a.role, team_id: a.team_id, seat_tier: 'middle', niche_role: 'panelist' }));
    const r = await api(`${API}/plaza/${_editPlazaId}/participants/batch`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(batch) });
    if (!r) ok = false;
  }
  closeM('m-edit-plaza');
  toast(ok ? '广场参与者已更新' : '部分操作失败');
  await loadPlazas();
  if (curPlaza === _editPlazaId) selectPlaza(_editPlazaId);
};

window.deletePlaza = async function(id, name) {
  if (!confirm(`确定删除广场「${name}」？所有讨论数据将一并删除。`)) return;
  const r = await api(`${API}/plaza/${id}`, { method: 'DELETE' });
  if (r) {
    toast('广场已删除');
    if (curPlaza === id) { curPlaza = null; curDisc = null; curDiscData = null; localStorage.removeItem('plaza_curPlaza'); localStorage.removeItem('plaza_curDisc'); renderArena3D([]); $('msg-log').innerHTML = ''; $('disc-list').innerHTML = '<div style="color:var(--dim);font-size:10px">先选择广场</div>'; }
    await loadPlazas();
  }
};

/* ═══════════ DISCUSSIONS ═══════════ */
function renderDiscList(ds) {
  $('disc-list').innerHTML = ds.map(d =>
    `<div class="disc-item ${d.id === curDisc ? 'active' : ''}" onclick="selectDisc('${esc(d.id)}')">
      <div class="dh"><div class="tp">${esc(d.topic)}</div>${d.status === 'closed' ? `<button class="disc-act" onclick="extractFromDisc(event, '${esc(d.id)}')">萃取</button><button class="disc-act" onclick="exportDiscPDF(event, '${esc(d.id)}')">PDF</button>` : ''}<button class="disc-del" onclick="deleteDisc(event, '${esc(d.id)}')">删除</button></div>
      <div class="dm"><span class="pill pill-${d.status}">${statusTxt(d.status)}</span><span>${d.message_count} 消息</span></div>
    </div>`
  ).join('') || '<div style="color:var(--dim);font-size:10px">无讨论</div>';
}
function statusTxt(s) { return { open: '待启动', in_progress: '进行中', summarizing: '总结中', closed: '已结束' }[s] || s; }

window.deleteDisc = async function(event, discId) {
  event?.stopPropagation();
  if (!curPlaza) return;
  if (!confirm('删除这个讨论？')) return;
  const deletingCurrent = curDisc === discId;
  if (deletingCurrent && evtSrc) { evtSrc.close(); evtSrc = null; }
  const result = await api(`${API}/plaza/${curPlaza}/discussions/${discId}`, { method: 'DELETE' });
  if (!result) { toast('删除失败'); return; }

  if (deletingCurrent) {
    curDisc = null;
    curDiscData = null;
    clearSpeechPlayback();
    $('msg-log').innerHTML = '<div style="text-align:center;padding:40px 0;color:var(--dim);font-size:10px;font-family:var(--font-mono)">创建讨论开始议事</div>';
    $('plan-panel').style.display = 'none';
    $('btn-start').disabled = true;
    $('btn-start').textContent = '开始';
    $('status-text').textContent = '';
  }

  const plaza = await api(`${API}/plaza/${curPlaza}`);
  if (plaza) {
    renderDiscList(plaza.discussions || []);
    renderArena3D(plaza.participants || []);
  }
  toast('讨论已删除');
};

window.selectDisc = async function(discId, opts) {
  curDisc = discId;
  localStorage.setItem('plaza_curDisc', discId);
  if (!opts?.keepSpeech) clearSpeechPlayback();
  const disc = await api(`${API}/plaza/${curPlaza}/discussions/${discId}`);
  if (!disc) return;
  curDiscData = disc;
  const plaza = await api(`${API}/plaza/${curPlaza}`);
  if (plaza) { renderDiscList(plaza.discussions || []); renderArena3D(plaza.participants || []); }
  renderMessages(disc.messages || []);
  $('btn-start').disabled = !['open', 'closed'].includes(disc.status);
  $('btn-start').textContent = disc.status === 'open' ? '开始' : disc.status === 'closed' ? '重新讨论' : disc.status === 'in_progress' ? '进行中' : '总结中';
  $('status-text').textContent = disc.goal ? `目标: ${disc.goal}` : '';
  if (disc.status === 'closed' && disc.summary) renderPlan(disc);
  else if (disc.plan && disc.plan.content) renderLivePlan(disc.plan);
  else $('plan-panel').style.display = 'none';
  if (disc.status === 'in_progress') connectSSE(discId);
};

function renderMessages(msgs) {
  const log = $('msg-log');
  if (!msgs.length) { log.innerHTML = '<div style="text-align:center;padding:40px 0;color:var(--dim);font-size:10px">点击「开始」启动讨论</div>'; return; }
  let h = '', lr = -1;
  msgs.forEach(m => {
    if (m.round_number !== lr && m.round_number > 0) { h += `<div class="round-sep">ROUND ${m.round_number}</div>`; lr = m.round_number; }
    const isMod = m.niche_role === 'moderator';
    const isUser = m.niche_role === 'human';
    const cls = isMod ? 'mod' : (isUser ? 'user' : '');
    const label = isMod ? ' · 议事长' : (isUser ? ' · 你' : '');
    h += `<div class="msg-entry ${cls}"><div class="me-name">${esc(m.agent_name)}${label}</div><div class="me-text">${mdLite(m.content)}</div></div>`;
  });
  log.innerHTML = h; log.scrollTop = log.scrollHeight;
}

function mdLite(s) {
  return esc(s).replace(/\n/g, '<br>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^(#{1,4})\s+(.+)/gm, (m, h, t) => `<strong style="font-size:${17 - h.length * 2}px">${t}</strong>`);
}

function renderPlan(disc) {
  const p = $('plan-panel'); p.style.display = '';
  const opts = allTeams.map(t => `<option value="${esc(t.team_id)}">${esc(t.name)}</option>`).join('');
  const planContent = disc.plan?.content || disc.summary || '';
  p.innerHTML = `<div class="plan-card"><h4>执行计划</h4><div class="plan-text">${mdLite(planContent)}</div>
    <div class="assign-row"><span style="font-size:9px;color:var(--dim);font-family:var(--font-mono)">ASSIGN:</span>
    <select id="assign-team">${opts}</select><button class="plan-btn" onclick="assignPlan()">派发</button></div>
    <div class="plan-actions">
      <button class="plan-btn primary" onclick="dispatchTasks()">智能拆解</button>
      <button class="plan-btn primary" onclick="dispatchAndExecute()">拆解并执行</button>
      <button class="plan-btn accent" onclick="enterEvolution()">进入演化</button>
      <button class="plan-btn" onclick="refreshPlan()">↓ 刷新计划</button>
    </div></div>`;
}

function renderLivePlan(plan) {
  const p = $('plan-panel'); p.style.display = '';
  const opts = allTeams.map(t => `<option value="${esc(t.team_id)}">${esc(t.name)}</option>`).join('');
  const planContent = plan.content || '';
  p.innerHTML = `<div class="plan-card"><h4>执行计划 <span style="font-size:9px;color:var(--slit-glow);margin-left:6px">已修订</span></h4><div class="plan-text">${mdLite(planContent)}</div>
    <div class="assign-row"><span style="font-size:9px;color:var(--dim);font-family:var(--font-mono)">ASSIGN:</span>
    <select id="assign-team">${opts}</select><button class="plan-btn" onclick="assignPlan()">派发</button></div>
    <div class="plan-actions">
      <button class="plan-btn primary" onclick="dispatchTasks()">智能拆解</button>
      <button class="plan-btn primary" onclick="dispatchAndExecute()">拆解并执行</button>
      <button class="plan-btn accent" onclick="enterEvolution()">进入演化</button>
      <button class="plan-btn" onclick="refreshPlan()">↓ 刷新计划</button>
    </div></div>`;
}

window.assignPlan = async function() {
  if (!curPlaza || !curDisc) return;
  const r = await api(`${API}/plaza/${curPlaza}/discussions/${curDisc}/assign`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ team_id: $('assign-team').value }) });
  if (r) toast(`计划已派发: ${r.status}`); else toast('派发失败');
};

window.dispatchTasks = async function() {
  if (!curPlaza || !curDisc) return;
  const teamId = $('assign-team')?.value;
  if (!teamId) { toast('请选择团队'); return; }
  toast('正在智能拆解任务...');
  const r = await api(`${API}/plaza/${curPlaza}/discussions/${curDisc}/dispatch`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ team_id: teamId })
  });
  if (r && r.task_count) {
    toast(`已拆解 ${r.task_count} 个任务并派发到团队`);
    renderDispatchedTasks(r.tasks);
  } else {
    toast('拆解失败');
  }
};

window.dispatchAndExecute = async function() {
  if (!curPlaza || !curDisc) return;
  const teamId = $('assign-team')?.value;
  if (!teamId) { toast('请选择团队'); return; }
  toast('正在拆解并立即执行...');
  const r = await api(`${API}/plaza/${curPlaza}/discussions/${curDisc}/dispatch-and-execute`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ team_id: teamId })
  });
  if (r && r.task_count) {
    toast(`已拆解 ${r.task_count} 个任务，正在执行中`);
    renderDispatchedTasks(r.tasks);
  } else {
    toast('拆解执行失败');
  }
};

window.enterEvolution = async function() {
  if (!curPlaza || !curDisc) return;
  const teamId = $('assign-team')?.value;
  toast('正在进入系统演化...');
  const r = await api(`${API}/plaza/${curPlaza}/discussions/${curDisc}/evolve`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ team_id: teamId || '' })
  });
  if (r && r.status === 'evolving') {
    toast(`演化已启动: ${r.evolution_items || 0} 项演进需求`);
    if (r.tasks) renderDispatchedTasks(r.tasks);
  } else {
    toast('演化启动失败');
  }
};

function renderDispatchedTasks(tasks) {
  if (!tasks || !tasks.length) return;
  const p = $('plan-panel');
  const existing = p.querySelector('.dispatched-tasks');
  const html = `<div class="dispatched-tasks" style="margin-top:10px;border-top:1px solid var(--line);padding-top:8px">
    <h4 style="font-size:10px;color:var(--dim);margin-bottom:6px;letter-spacing:1px">TASKS (${tasks.length})</h4>
    ${tasks.map((t, i) => `<div style="display:flex;align-items:center;gap:6px;padding:4px 0;font-size:11px">
      <span style="width:8px;height:8px;border-radius:50%;background:${t.status==='running'?'var(--accent)':t.status==='completed'?'#67c23a':'var(--dim)'};flex-shrink:0"></span>
      <span style="color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.title)}</span>
      <span style="font-size:9px;color:var(--dim);font-family:var(--font-mono)">${t.metadata?.responsible||''}</span>
    </div>`).join('')}
  </div>`;
  if (existing) existing.outerHTML = html;
  else p.querySelector('.plan-card').insertAdjacentHTML('beforeend', html);
}

window.openCreateDisc = async function() {
  if (!curPlaza) { toast('请先选择广场'); return; }
  const plaza = await api(`${API}/plaza/${curPlaza}`);
  if (plaza?.participants) {
    const chair = plaza.participants.find(p => p.niche_role === 'moderator');
    $('inp-dm').innerHTML = plaza.participants.map(p => `<option value="${esc(p.agent_id)}"${chair && p.agent_id === chair.agent_id ? ' selected' : ''}>${esc(p.agent_name)}</option>`).join('');
  }
  openM('m-disc'); $('inp-dt').focus();
};

window.doCreateDisc = async function() {
  const topic = $('inp-dt').value.trim();
  if (!topic) { toast('请输入话题'); return; }
  const r = await api(`${API}/plaza/${curPlaza}/discussions`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ topic, goal: $('inp-dg').value.trim(), description: $('inp-dd').value.trim(), moderator_agent_id: $('inp-dm').value, max_rounds: parseInt($('inp-dr').value) })
  });
  if (r) { closeM('m-disc'); $('inp-dt').value=''; $('inp-dg').value=''; $('inp-dd').value=''; toast('讨论已创建'); selectPlaza(curPlaza); setTimeout(() => selectDisc(r.id), 300); }
};

window.startDiscussion = async function() {
  if (!curPlaza || !curDisc) return;
  unlockAudio(); // Ensure audio is unlocked on this user gesture
  const previousStatus = curDiscData?.status || 'open';
  $('btn-start').disabled = true; $('btn-start').textContent = '启动中…';
  const r = await api(`${API}/plaza/${curPlaza}/discussions/${curDisc}/start`, { method: 'POST' });
  if (r) connectSSE(curDisc);
  else {
    $('btn-start').disabled = false;
    $('btn-start').textContent = previousStatus === 'closed' ? '重新讨论' : '开始';
    toast('启动失败');
  }
};

window.sendInterject = async function() {
  if (!curPlaza || !curDisc) { toast('请先选择讨论'); return; }
  const input = $('chat-input');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  const btn = document.querySelector('.chat-send-btn');
  btn.disabled = true; btn.textContent = '思考中…';
  // Immediately show user message for instant feedback
  if (!evtSrc) appendMsg({ agent_name: '用户', niche_role: 'human', content: msg });
  const r = await api(`${API}/plaza/${curPlaza}/discussions/${curDisc}/interject`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: msg })
  });
  btn.disabled = false; btn.textContent = '发送';
  if (r) {
    // If no SSE, manually show moderator reply (user msg already shown above)
    if (!evtSrc) {
      if (r.moderator_reply) { appendMsg(r.moderator_reply); showSpeechBubble(r.moderator_reply.agent_id, r.moderator_reply.agent_name, r.moderator_reply.content); }
      if (r.nominated_reply) { appendMsg(r.nominated_reply); showSpeechBubble(r.nominated_reply.agent_id, r.nominated_reply.agent_name, r.nominated_reply.content); }
      if (r.extra_replies) { r.extra_replies.forEach(m => { appendMsg(m); showSpeechBubble(m.agent_id, m.agent_name, m.content); }); }
      if (r.moderator_resume) { appendMsg(r.moderator_resume); showSpeechBubble(r.moderator_resume.agent_id, r.moderator_resume.agent_name, r.moderator_resume.content); }
    }
    // 在议事长回复后显示操作按钮
    if (r.moderator_resume || r.moderator_reply) {
      appendModeratorActions(msg);
    }
    if (r.action === 'redirect') toast('议事长已纠偏并修订执行计划');
    if (r.action === 'new_discussion' && r.new_discussion?.id) {
      toast('议事长决定开一个新讨论');
      await selectPlaza(curPlaza);
      setTimeout(() => selectDisc(r.new_discussion.id), 200);
    }
  } else {
    toast('发送失败');
  }
};

function appendMsg(m) {
  const log = $('msg-log');
  if (log.querySelector('[style*="text-align:center"]')) log.innerHTML = '';
  const isMod = m.niche_role === 'moderator';
  const isUser = m.niche_role === 'human';
  const cls = isMod ? 'mod' : (isUser ? 'user' : '');
  const label = isMod ? ` · 议事长` : (isUser ? ' · 你' : '');
  const modAction = isMod ? `<div style="margin-top:6px;text-align:right"><button class="plan-btn" onclick="refreshPlan()" style="font-size:11px;padding:2px 10px">↻ 修订执行计划</button></div>` : '';
  log.insertAdjacentHTML('beforeend', `<div class="msg-entry ${cls}"><div class="me-name">${esc(m.agent_name)}${label}</div><div class="me-text">${mdLite(m.content)}</div>${modAction}</div>`);
  log.scrollTop = log.scrollHeight;
}

function appendModeratorActions(userQuestion) {
  const log = $('msg-log');
  // 移除旧的操作栏
  log.querySelectorAll('.mod-actions').forEach(el => el.remove());
  const safeQ = esc(userQuestion).replace(/'/g, '&#39;');
  log.insertAdjacentHTML('beforeend', `<div class="mod-actions" style="display:flex;gap:6px;padding:8px 14px;justify-content:flex-end;flex-wrap:wrap">
    <button class="plan-btn primary" onclick="continueDeepDiscussion('${safeQ}')">根据此话题继续深入讨论</button>
    <button class="plan-btn" onclick="refreshPlan()">↓ 刷新计划</button>
  </div>`);
  log.scrollTop = log.scrollHeight;
}

window.continueDeepDiscussion = async function(question) {
  if (!curPlaza || !question) return;
  toast('正在创建深入讨论…');
  const r = await api(`${API}/plaza/${curPlaza}/discussions`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      topic: `深入讨论: ${question.slice(0, 60)}`,
      goal: `围绕「${question}」进行深入分析，产出可执行的具体方案`,
      max_rounds: 3,
    })
  });
  if (r && r.id) {
    toast('深入讨论已创建，正在启动…');
    await selectPlaza(curPlaza);
    setTimeout(async () => {
      await selectDisc(r.id);
      // 自动启动讨论
      await api(`${API}/plaza/${curPlaza}/discussions/${r.id}/start`, { method: 'POST' });
      connectSSE(r.id);
    }, 300);
  } else {
    toast('创建失败');
  }
};

window.extractFromDisc = async function(event, discId) {
  event?.stopPropagation();
  const id = discId || curDisc;
  if (!curPlaza || !id) return;
  toast('正在准备萃取…');
  const disc = await api(`${API}/plaza/${curPlaza}/discussions/${id}`);
  if (!disc) { toast('获取讨论失败'); return; }
  const planText = disc.plan?.content || disc.summary || '';
  if (!planText) { toast('暂无执行计划可萃取'); return; }
  const title = disc.topic || '讨论萃取';
  sessionStorage.setItem('extract_source', JSON.stringify({
    source_text: planText,
    source_title: title,
    source_type: 'document'
  }));
  // Pass participating teams to extract page
  const plaza = await api(`${API}/plaza/${curPlaza}`);
  if (plaza?.participants) {
    const teamIds = [...new Set(plaza.participants.map(p => p.team_id).filter(Boolean))];
    if (teamIds.length) sessionStorage.setItem('extract_teams', JSON.stringify(teamIds));
  }
  toast('正在跳转萃取页面…');
  window.location.href = '/skill-extract.html';
};

window.exportDiscPDF = async function(event, discId) {
  event?.stopPropagation();
  const id = discId || curDisc;
  if (!curPlaza || !id) return;
  toast('正在生成 PDF…');
  const disc = await api(`${API}/plaza/${curPlaza}/discussions/${id}`);
  if (!disc) { toast('获取讨论失败'); return; }
  const title = disc.topic || '讨论记录';
  const msgs = disc.messages || [];
  let body = `<h1 style="font-size:18px;margin-bottom:4px">${esc(title)}</h1>`;
  if (disc.goal) body += `<p style="color:#666;font-size:12px;margin-bottom:8px">目标: ${esc(disc.goal)}</p>`;
  body += `<p style="color:#999;font-size:10px;margin-bottom:16px">状态: ${statusTxt(disc.status)} · ${msgs.length} 条消息</p><hr style="border:none;border-top:1px solid #ddd;margin:12px 0">`;
  let lr = -1;
  msgs.forEach(m => {
    if (m.round_number !== lr && m.round_number > 0) { body += `<div style="text-align:center;color:#999;font-size:10px;margin:12px 0">── ROUND ${m.round_number} ──</div>`; lr = m.round_number; }
    const label = m.niche_role === 'moderator' ? ' · 议事长' : (m.niche_role === 'human' ? ' · 你' : '');
    body += `<div style="margin-bottom:12px"><div style="font-weight:600;font-size:12px;color:#333;margin-bottom:2px">${esc(m.agent_name)}${label}</div><div style="font-size:12px;line-height:1.8;color:#444;white-space:pre-wrap">${esc(m.content)}</div></div>`;
  });
  if (disc.summary) { body += `<hr style="border:none;border-top:1px solid #ddd;margin:12px 0"><h2 style="font-size:14px;margin-bottom:6px">总结</h2><div style="font-size:12px;line-height:1.8;color:#444;white-space:pre-wrap">${esc(disc.summary)}</div>`; }
  if (disc.plan?.content) { body += `<hr style="border:none;border-top:1px solid #ddd;margin:12px 0"><h2 style="font-size:14px;margin-bottom:6px">执行计划</h2><div style="font-size:12px;line-height:1.8;color:#444;white-space:pre-wrap">${esc(disc.plan.content)}</div>`; }
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:sans-serif;max-width:800px;margin:40px auto;padding:0 20px}@media print{body{margin:20px}}</style></head><body>${body}</body></html>`;
  const w = window.open('', '_blank');
  if (w) { w.document.write(html); w.document.close(); w.document.title = title; setTimeout(() => { w.print(); }, 500); }
  toast('PDF 预览已打开，请在弹出的打印窗口中选择「存储为 PDF」');
};

window.refreshPlan = async function() {
  if (!curPlaza || !curDisc) return;
  toast('议事长正在重新梳理执行计划…');
  const r = await api(`${API}/plaza/${curPlaza}/discussions/${curDisc}/refresh-plan`, {
    method: 'POST',
  });
  if (r && r.plan) {
    renderLivePlan(r.plan);
    if (r.message) { appendMsg(r.message); }
    toast('执行计划已更新');
  } else {
    toast('刷新失败');
  }
};

/* ═══════════ SSE ═══════════ */
let _discEndTimer = null;
function connectSSE(discId) {
  if (_discEndTimer) { clearTimeout(_discEndTimer); _discEndTimer = null; }
  if (evtSrc) { evtSrc.close(); evtSrc = null; }
  if (!curPlaza) return;
  evtSrc = new EventSource(`${API}/plaza/${curPlaza}/discussions/${discId}/stream`);
  let init = false;
  evtSrc.onmessage = (e) => {
    try {
      const d = JSON.parse(e.data);
      if (d.type === 'heartbeat') return;
      if (d.type === 'status') { init = true; return; }
      if (d.type === 'message' && init) {
        const m = d.message, log = $('msg-log');
        if (log.querySelector('[style*="text-align:center"]')) log.innerHTML = '';
        const isMod = m.niche_role === 'moderator';
        const isUser = m.niche_role === 'human';
        const lastSep = log.querySelector('.round-sep:last-of-type');
        const lastR = lastSep ? parseInt(lastSep.textContent.match(/\d+/)?.[0] || 0) : -1;
        if (m.round_number > 0 && m.round_number !== lastR) log.insertAdjacentHTML('beforeend', `<div class="round-sep">ROUND ${m.round_number}</div>`);
        const cls = isMod ? 'mod' : (isUser ? 'user' : '');
        const label = isMod ? ' · 议事长' : (isUser ? ' · 你' : '');
        const modAction = isMod ? `<div style="margin-top:6px;text-align:right"><button class="plan-btn" onclick="refreshPlan()" style="font-size:11px;padding:2px 10px">↻ 修订执行计划</button></div>` : '';
        log.insertAdjacentHTML('beforeend', `<div class="msg-entry ${cls}"><div class="me-name">${esc(m.agent_name)}${label}</div><div class="me-text">${esc(m.content)}</div>${modAction}</div>`);
        log.scrollTop = log.scrollHeight;
        $('status-text').textContent = `R${m.round_number} · ${m.agent_name}`;
        if (!isUser) showSpeechBubble(m.agent_id, m.agent_name, m.content);
      }
      if (d.type === 'interjection_state') {
        $('status-text').textContent = d.state === 'paused' ? '纠偏中…' : '讨论继续';
        if (d.state === 'resumed') {
          // 议事长回复结束，显示操作按钮
          const lastUserMsg = [...$('msg-log').querySelectorAll('.msg-entry.user .me-text')].pop();
          const question = lastUserMsg ? lastUserMsg.textContent.trim() : '';
          if (question) appendModeratorActions(question);
        }
      }
      if (d.type === 'plan_updated' && d.plan) {
        renderLivePlan(d.plan);
      }
      if (d.type === 'discussion_start') { clearSpeechPlayback(); $('btn-start').disabled = true; $('btn-start').textContent = '进行中'; $('msg-log').innerHTML = ''; }
      if (d.type === 'round_start') $('status-text').textContent = `R${d.round}/${d.max_rounds}`;
      if (d.type === 'summarizing') { $('btn-start').textContent = '总结中'; $('status-text').textContent = '议事长总结中…'; }
      if (d.type === 'discussion_end') {
        $('btn-start').disabled = false; $('btn-start').textContent = '重新讨论'; $('status-text').textContent = 'DONE';
        evtSrc.close(); evtSrc = null; toast('讨论结束');
        const refreshDelay = Math.max(2600, Math.min(120000, 1500 + getQueuedSpeechDuration()));
        _discEndTimer = setTimeout(() => { _discEndTimer = null; selectDisc(discId, { keepSpeech: true }); }, refreshDelay);
      }
    } catch (err) { console.warn('SSE parse:', err); }
  };
}

/* ═══════════ INIT ═══════════ */
async function init() {
  allTeams = await api(`${API}/teams`) || [];
  await loadPlazas(); renderArena3D([]);
  // Restore last selected plaza/discussion from localStorage
  const savedPlaza = localStorage.getItem('plaza_curPlaza');
  const savedDisc = localStorage.getItem('plaza_curDisc');
  if (savedPlaza) {
    await selectPlaza(savedPlaza);
    if (savedDisc) await selectDisc(savedDisc);
  }
}
init();
</script>
