<!DOCTYPE html>
<html lang="zh-CN" class="taste-light">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://ga.jspm.io https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:*; img-src 'self' data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentsGroup2026 — 登录</title>
  <link rel="stylesheet" href="/css/variables.css">
<style>
    
    /* ═══ Light Theme Override (User Request: 浅色背景) ═══ */
    /* 覆盖 theme.css 的深色主题，改为浅色 */
    :root {
      /* 浅色背景 - 类似 Linear 和 Carbon 的浅色模式 */
      --shironeri: #F5F7FA;      /* 极浅灰 - 主背景 */
      --ishi: #FFFFFF;           /* 纯白 - 卡片背景 */
      --kabe: #E8ECF1;           /* 浅灰蓝 - 次级背景 */
      --hai: #E2E8F0;            /* 更浅的灰 - 面板背景 */
      --nezumi: #94A3B8;         /* 中灰 - 边框 */
      --sumi: #1E293B;           /* 深蓝灰 - 主文字 */
      --sumi-2: #64748B;         /* 中灰蓝 - 次级文字 */
      --sumi-3: #94A3B8;         /* 浅灰蓝 - 辅助文字 */
      --groove: #E2E8F0;         /* 浅边框 */
      --ridge: rgba(0, 0, 0, 0.04); /* 极淡阴影 */
      
      /* 保持原有的强调色，但降低饱和度以适应浅色背景 */
      --koke: #10B981;           /* 青绿 - 成功/运行 */
      --mizui: #06B6D4;          /* 青色 */
      --shu: #EF4444;            /* 红色 - 警告 */
      --kitsune: #F59E0B;        /* 琥珀 - 警告 */
      --fuji: #8B5CF6;           /* 紫色 */
      
      /* 语义别名 */
      --cyan: var(--mizui);
      --cyan-s: var(--mizui);
      --lime: var(--koke);
      --amber: var(--kitsune);
      --red: var(--shu);
      --pink: var(--shu);
      --purple: var(--fuji);
      --text: var(--sumi);
      --muted: var(--sumi-2);
      --dim: var(--sumi-3);
      
      /* 背景色 */
      --bg: var(--shironeri);
      --panel: var(--ishi);
      --panel2: var(--kabe);
      
      /* 边框 */
      --line: var(--groove);
      --line-light: var(--groove);
      
      /* 阴影 - 浅色背景需要更柔和的阴影 */
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);
      --glow-cyan: 0 0 20px rgba(16, 185, 129, 0.15);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--shironeri);
      color: var(--sumi);
      position: relative;
    }

    /* 浅色背景下的纸纹效果 - 更柔和 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image: radial-gradient(oklch(0 0 0/.008) 1px, transparent 1px),
                         radial-gradient(oklch(0 0 0/.005) 1px, transparent 1px);
      background-size: 6px 6px, 8px 8px;
      background-position: 0 0, 4px 4px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image: radial-gradient(oklch(0 0 0/.012) 1px, transparent 1px),
                         radial-gradient(oklch(0 0 0/.008) 1px, transparent 1px);
      background-size: 5px 5px, 7px 7px;
      background-position: 0 0, 3px 3px;
    }

    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 48px 40px;
      background: var(--ishi);
      border: 1px solid var(--groove);
      box-shadow: var(--shadow-lg);
    }

    .login-brand {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-brand .seal {
      display: inline-block;
      font-size: 24px;
      font-weight: 900;
      color: var(--sumi);
      background: var(--shironeri);
      padding: 6px 14px;
      line-height: 1.3;
      font-family: var(--font-serif);
      margin-bottom: 16px;
    }

    .login-brand h1 {
      font-size: 22px;
      font-weight: 600;
      color: var(--sumi);
      margin-bottom: 6px;
    }

    .login-brand p {
      font-size: 13px;
      color: var(--sumi-3);
      font-family: var(--font-mono);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      color: var(--sumi-3);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      background: var(--kabe);
      border: 1px solid var(--groove);
      color: var(--sumi);
      font-size: 14px;
      font-family: inherit;
      transition: 0.15s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--koke);
      box-shadow: 0 0 0 2px var(--koke) / 0.2;
    }

    .form-input::placeholder {
      color: var(--sumi-3);
    }

    .login-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 12px;
    }

    .login-options label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--sumi-3);
      cursor: pointer;
    }

    .login-options a {
      color: var(--koke);
      text-decoration: none;
    }

    .login-options a:hover {
      text-decoration: underline;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--sumi);
      color: var(--shironeri);
      border: none;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login:hover {
      background: var(--sumi-2);
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    .login-footer {
      margin-top: 32px;
      text-align: center;
      font-size: 11px;
      color: var(--sumi-3);
      font-family: var(--font-mono);
    }

    .login-error {
      display: none;
      padding: 10px 14px;
      background: var(--shu) / 0.08;
      border: 1px solid var(--shu) / 0.2;
      color: var(--shu);
      font-size: 12px;
      margin-bottom: 16px;
    }

    .login-error.show {
      display: block;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      font-size: 11px;
      color: var(--sumi-3);
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--groove);
    }

    .btn-guest {
      width: 100%;
      padding: 12px;
      background: transparent;
      color: var(--koke);
      border: 1px solid var(--groove);
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: 0.15s;
    }

    .btn-guest:hover {
      background: var(--kabe);
      border-color: var(--koke);
    }

    .login-tabs {
      display: flex;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--groove);
    }

    .login-tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      color: var(--sumi-3);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      font-family: inherit;
      transition: 0.15s;
    }

    .login-tab:hover {
      color: var(--sumi-2);
    }

    .login-tab.active {
      color: var(--sumi);
      border-bottom-color: var(--shu);
      font-weight: 600;
    }

    .login-success {
      display: none;
      padding: 10px 14px;
      background: var(--koke) / 0.08;
      border: 1px solid var(--koke) / 0.2;
      color: var(--koke);
      font-size: 12px;
      margin-bottom: 16px;
    }

    .login-success.show {
      display: block;
    }

    .hidden { display: none !important; }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      .login-container { padding: 32px 24px; }
    }
  </style>
<style>:root{--ag-font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;--ag-font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{font-family:var(--ag-font-sans)}code,pre,kbd{font-family:var(--ag-font-mono)}</style>
  <link rel="stylesheet" href="/css/taste-light.css">
</head>
<body>
  <div class="login-container">
    <div class="login-brand">
      <span class="seal">智</span>
      <h1>AgentsGroup2026</h1>
      <p>智能体团队管理平台</p>
    </div>

    <div class="login-tabs">
      <button class="login-tab active" onclick="switchTab('login')">登 录</button>
      <button class="login-tab" onclick="switchTab('register')">注 册</button>
    </div>

    <div class="login-error" id="login-error"></div>
    <div class="login-success" id="login-success"></div>

    <!-- Login Form -->
    <form id="login-form" role="form" aria-label="登录" onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label class="form-label">用户名</label>
        <input class="form-input" type="text" id="username" placeholder="请输入用户名" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input class="form-input" type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required>
      </div>
      <div class="login-options">
        <label><input type="checkbox" id="remember"> 记住登录</label>
      </div>
      <button class="btn-login" type="submit">
        <span class="seal" style="font-size:10px;padding:1px 5px;margin:0">入</span>
        登 录
      </button>
    </form>

    <!-- Register Form -->
    <form id="register-form" class="hidden" onsubmit="return handleRegister(event)">
      <div class="form-group">
        <label class="form-label">用户名</label>
        <input class="form-input" type="text" id="reg-username" placeholder="至少2个字符" autocomplete="username" required minlength="2">
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input class="form-input" type="password" id="reg-password" placeholder="至少8个字符" autocomplete="new-password" required minlength="8">
      </div>
      <div class="form-group">
        <label class="form-label">确认密码</label>
        <input class="form-input" type="password" id="reg-password2" placeholder="再次输入密码" autocomplete="new-password" required>
      </div>
      <button class="btn-login" type="submit">
        <span class="seal" style="font-size:10px;padding:1px 5px;margin:0">册</span>
        注 册
      </button>
    </form>

    <div class="divider">或</div>
    <button class="btn-guest" onclick="guestLogin()">访客模式进入</button>

    <div class="login-footer">
      AgentsGroup2026 v1.0.0 · Standalone Agent Platform
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    (function () {
      'use strict';

      var errorEl = document.getElementById('login-error');
      var successEl = document.getElementById('login-success');

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.classList.add('show');
        successEl.classList.remove('show');
      }

      function showSuccess(msg) {
        successEl.textContent = msg;
        successEl.classList.add('show');
        errorEl.classList.remove('show');
      }

      function clearMessages() {
        errorEl.classList.remove('show');
        successEl.classList.remove('show');
      }

      function setLoading(btn, loading) {
        if (loading) {
          btn._origText = btn.textContent;
          btn.disabled = true;
          btn.innerHTML = '<span style="display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;vertical-align:middle"></span> 处理中...';
        } else {
          btn.disabled = false;
          btn.textContent = btn._origText || btn.textContent;
        }
      }

      function getNextUrl() {
        var params = new URLSearchParams(window.location.search);
        var next = params.get('next') || '/agent-team-config.html';
        if (!next || next.charAt(0) !== '/' || next.indexOf('//') === 0) {
          return '/agent-team-config.html';
        }
        return next;
      }

      window.handleLogin = function (e) {
        e.preventDefault();
        clearMessages();
        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value;
        var btn = e.target.querySelector('.btn-login') || e.target;
        var remember = document.getElementById('remember').checked;

        if (!username || !password) {
          showError('请填写用户名和密码');
          return false;
        }
        if (password.length < 4) {
          showError('密码长度不能少于4个字符');
          return false;
        }

        setLoading(btn, true);
        window.api.request('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password }),
        }).then(function (data) {
          setLoading(btn, false);
          if (!data) {
            var lastErr = window.api._lastError;
            showError(lastErr && lastErr.message ? lastErr.message : '登录失败，请检查用户名和密码');
            return;
          }
          if (data.csrf_token) {
            window.api.setCsrfToken(data.csrf_token);
          }
          localStorage.setItem('ag-user', username);
          window.location.href = getNextUrl();
        }).catch(function (err) {
          setLoading(btn, false);
          showError(err && err.message ? err.message : '连接失败，请检查后端服务');
        });
        return false;
      };

      window.handleRegister = function (e) {
        e.preventDefault();
        clearMessages();
        var username = document.getElementById('reg-username').value.trim();
        var password = document.getElementById('reg-password').value;
        var password2 = document.getElementById('reg-password2').value;
        var btn = e.target.querySelector('.btn-login') || e.target;

        if (!username || !password) {
          showError('请填写用户名和密码');
          return false;
        }
        if (username.length < 2) {
          showError('用户名至少需要2个字符');
          return false;
        }
        if (password.length < 8) {
          showError('密码至少需要8个字符');
          return false;
        }
        if (password !== password2) {
          showError('两次输入的密码不一致');
          return false;
        }

        setLoading(btn, true);
        window.api.request('/api/v1/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password }),
        }).then(function (data) {
          setLoading(btn, false);
          if (!data) {
            var lastErr = window.api._lastError;
            showError(lastErr && lastErr.message ? lastErr.message : '注册失败，请稍后重试');
            return;
          }
          if (data.csrf_token) {
            window.api.setCsrfToken(data.csrf_token);
          }
          localStorage.setItem('ag-user', username);
          showSuccess('🎉 注册成功，即将跳转...');
          setTimeout(function () { window.location.href = getNextUrl(); }, 800);
        }).catch(function (err) {
          setLoading(btn, false);
          showError(err && err.message ? err.message : '连接失败，请检查后端服务');
        });
        return false;
      };

      window.switchTab = function (tab) {
        var tabs = document.querySelectorAll('.login-tab');
        var loginForm = document.getElementById('login-form');
        var registerForm = document.getElementById('register-form');
        clearMessages();
        tabs.forEach(function (t) { t.classList.remove('active'); });
        if (tab === 'login') {
          tabs[0].classList.add('active');
          loginForm.classList.remove('hidden');
          registerForm.classList.add('hidden');
        } else {
          tabs[1].classList.add('active');
          loginForm.classList.add('hidden');
          registerForm.classList.remove('hidden');
        }
      };

      window.guestLogin = function () {
        localStorage.setItem('ag-user', 'guest');
        window.location.href = getNextUrl();
      };

      // If using httpOnly cookie, check via auth/me
      window.api.request('/api/v1/auth/me').then(function (data) {
        if (data && data.authenticated) {
          localStorage.setItem('ag-user', data.username);
          window.location.href = getNextUrl();
        }
      });
    })();
  </script>

<script>
// ══ Global error tracking ══
window.onerror = function(msg, url, line, col, err) {
  console.error('[Global]', msg, url, line, col, err);
  try {
    var data = {msg: String(msg), url: url, line: line, col: col, stack: err && err.stack ? err.stack.slice(0,500) : ''};
    navigator.sendBeacon && navigator.sendBeacon('/api/v1/log/client-error', JSON.stringify(data));
  } catch(e) {}
  return false;
};
window.addEventListener('unhandledrejection', function(e) {
  console.error('[Unhandled]', e.reason);
  try {
    var data = {msg: String(e.reason), type: 'unhandledrejection', stack: e.reason && e.reason.stack ? e.reason.stack.slice(0,500) : ''};
    navigator.sendBeacon && navigator.sendBeacon('/api/v1/log/client-error', JSON.stringify(data));
  } catch(ex) {}
});
</script>

  <script src="/js/utils.js"></script>
</body>
</html>
