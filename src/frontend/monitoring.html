<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentsGroup2026 — 可观测性监控面板</title>
<style>
  :root {
    --bg: #0a0e14;
    --panel-bg: #131820;
    --border: #1e2a3a;
    --text: #c9d1d9;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --accent2: #3fb950;
    --warn: #d29922;
    --error: #f85149;
    --p0: #f85149;
    --p1: #d29922;
    --p2: #58a6ff;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "SF Mono","Menlo","Consolas",monospace;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  /* Header */
  .header {
    background: var(--panel-bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  .header h1 {
    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
    margin-right: auto;
  }
  .header .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent2);
    display: inline-block;
  }
  .header .status-dot.warn { background: var(--warn); }
  .header .status-dot.error { background: var(--error); }
  .header .stat {
    font-size: 12px;
    color: var(--text-dim);
  }
  .header .stat span {
    color: var(--text);
    font-weight: 600;
  }

  /* Main Grid */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 8px;
    padding: 8px;
    flex: 1;
    overflow: hidden;
  }
  .panel {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .panel-header .badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    background: var(--border);
  }
  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px;
    font-size: 12px;
    line-height: 1.5;
  }

  /* Fingerprint Panel */
  .fp-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .fp-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px;
  }
  .fp-card .label {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .fp-card .value {
    font-size: 20px;
    font-weight: 700;
    margin: 4px 0;
  }
  .fp-card .value.p0 { color: var(--p0); }
  .fp-card .value.p1 { color: var(--p1); }
  .fp-card .value.p2 { color: var(--p2); }
  .fp-card .value.ok { color: var(--accent2); }
  .fp-card .trend {
    font-size: 10px;
    color: var(--text-dim);
  }
  .fp-card .trend.up { color: var(--error); }
  .fp-card .trend.down { color: var(--accent2); }

  /* Trace Panel */
  .trace-list-item {
    padding: 6px 8px;
    border-left: 3px solid var(--border);
    margin-bottom: 6px;
    font-size: 11px;
    transition: border-color 0.2s;
  }
  .trace-list-item:hover { border-left-color: var(--accent); }
  .trace-list-item .tid {
    color: var(--accent);
    font-family: monospace;
  }
  .trace-list-item .meta {
    color: var(--text-dim);
    font-size: 10px;
  }
  .trace-list-item .type-badge {
    font-size: 9px;
    padding: 1px 4px;
    border-radius: 2px;
    background: var(--border);
    margin-left: 6px;
  }
  .trace-list-item .type-badge.plaza { background: #1a3a5c; color: #58a6ff; }
  .trace-list-item .type-badge.handoff { background: #3a2a1a; color: #d29922; }
  .trace-list-item .type-badge.task { background: #1a3a2a; color: #3fb950; }
  .trace-list-item .type-badge.tool { background: #2a1a3a; color: #a371f7; }

  /* Topology Panel */
  .topo-canvas {
    width: 100%;
    height: 100%;
    min-height: 200px;
  }

  /* Alerts Panel */
  .alert-item {
    padding: 6px 8px;
    border-radius: 4px;
    margin-bottom: 4px;
    font-size: 11px;
    border-left: 3px solid transparent;
  }
  .alert-item.p0 { border-left-color: var(--p0); background: rgba(248,81,73,0.08); }
  .alert-item.p1 { border-left-color: var(--p1); background: rgba(210,153,34,0.08); }
  .alert-item .time {
    font-size: 9px;
    color: var(--text-dim);
  }

  /* Bottom bar */
  .bottom-bar {
    background: var(--panel-bg);
    border-top: 1px solid var(--border);
    padding: 8px 16px;
    display: flex;
    gap: 16px;
    align-items: center;
    font-size: 11px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .bottom-bar .refresh {
    color: var(--accent);
    cursor: pointer;
  }
  .bottom-bar .refresh:hover { text-decoration: underline; }

  /* Tab buttons */
  .tab-row {
    display: flex;
    gap: 4px;
    margin-bottom: 8px;
  }
  .tab-btn {
    font-size: 11px;
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab-btn:hover { border-color: var(--accent); color: var(--text); }
  .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* SVG topology */
  .topo-node { fill: var(--accent); }
  .topo-node.agent { fill: #3fb950; }
  .topo-node.discussion { fill: #58a6ff; }
  .topo-node.task { fill: #d29922; }
  .topo-node.tool { fill: #a371f7; }
  .topo-link { stroke: var(--border); stroke-width: 1; }
  .topo-label { fill: var(--text-dim); font-size: 9px; }

  /* Responsive */
  @media (max-width: 900px) {
    .main-grid {
      grid-template-columns: 1fr;
      grid-template-rows: auto;
    }
  }
</style>
</head>
<body>

<div class="header">
  <span class="status-dot" id="statusDot"></span>
  <h1>🔍 可观测性监控面板 · AgentsGroup2026</h1>
  <div class="stat">Trace 数: <span id="statTraces">0</span></div>
  <div class="stat">链路节点: <span id="statNodes">0</span></div>
  <div class="stat">指纹采集: <span id="statFingerprints">0</span></div>
  <div class="stat">异常: <span id="statAnomaly">否</span></div>
</div>

<div class="main-grid">
  <!-- Panel 1: 行为指纹遥测 -->
  <div class="panel">
    <div class="panel-header">
      🧬 行为指纹遥测旁路
      <span class="badge" style="background:var(--p1);color:#fff">P0/P1</span>
      <span style="font-size:10px;color:var(--text-dim);margin-left:auto" id="fpUpdated">—</span>
    </div>
    <div class="panel-body" id="fingerprintPanel">
      <div class="fp-grid">
        <div class="fp-card">
          <div class="label">假升级率 (false_upgrade)</div>
          <div class="value p0" id="fpFalseUpgrade">—</div>
          <div class="trend" id="fpFalseUpgradeTrend">—</div>
        </div>
        <div class="fp-card">
          <div class="label">行为指纹突变率</div>
          <div class="value p0" id="fpMutationRate">—</div>
          <div class="trend" id="fpMutationTrend">—</div>
        </div>
        <div class="fp-card">
          <div class="label">异常传播深度</div>
          <div class="value p1" id="fpAnomalyDepth">—</div>
          <div class="trend" id="fpAnomalyDepthTrend">—</div>
        </div>
        <div class="fp-card">
          <div class="label">预测错误率</div>
          <div class="value p1" id="fpPredError">—</div>
          <div class="trend" id="fpPredErrorTrend">—</div>
        </div>
        <div class="fp-card">
          <div class="label">资源增量 %</div>
          <div class="value p2" id="fpResourcePct">—</div>
          <div class="trend" id="fpResourceTrend">—</div>
        </div>
        <div class="fp-card">
          <div class="label">能耗增量 %</div>
          <div class="value p2" id="fpEnergyPct">—</div>
          <div class="trend" id="fpEnergyTrend">—</div>
        </div>
        <div class="fp-card">
          <div class="label">策略评估延迟 (ms)</div>
          <div class="value p2" id="fpPolicyLatency">—</div>
          <div class="trend" id="fpPolicyLatencyTrend">—</div>
        </div>
        <div class="fp-card">
          <div class="label">进化停滞率</div>
          <div class="value p2" id="fpStagnation">—</div>
          <div class="trend" id="fpStagnationTrend">—</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Panel 2: 聚合链路 Trace ID 关联 -->
  <div class="panel">
    <div class="panel-header">
      🔗 聚合链路 Trace 关联
      <span class="badge" style="background:var(--p0);color:#fff">P0</span>
      <div class="tab-row" style="margin:0 0 0 auto;">
        <button class="tab-btn active" onclick="switchTraceTab('list')">链路列表</button>
        <button class="tab-btn" onclick="switchTraceTab('topo')">拓扑图</button>
      </div>
    </div>
    <div class="panel-body" id="tracePanel">
      <div id="traceListView"></div>
      <div id="traceTopoView" style="display:none;">
        <svg class="topo-canvas" id="topoSvg"></svg>
      </div>
    </div>
  </div>

  <!-- Panel 3: 讨论监控 (Plaza Monitor) -->
  <div class="panel">
    <div class="panel-header">
      🏛️ Plaza 讨论监控
      <span class="badge" style="background:var(--p0);color:#fff">P0</span>
    </div>
    <div class="panel-body" id="plazaPanel">
      <div style="color:var(--text-dim);text-align:center;padding:20px;">等待数据...</div>
    </div>
  </div>

  <!-- Panel 4: 告警与事件 -->
  <div class="panel">
    <div class="panel-header">
      ⚠️ 实时告警
      <span class="badge" style="background:var(--error);color:#fff" id="alertCount">0</span>
    </div>
    <div class="panel-body" id="alertsPanel">
      <div style="color:var(--text-dim);text-align:center;padding:20px;">无告警</div>
    </div>
  </div>
</div>

<div class="bottom-bar">
  <span>⏱ 自动刷新: <span id="refreshCountdown">5</span>s</span>
  <span class="refresh" onclick="forceRefresh()">🔄 立即刷新</span>
  <span style="margin-left:auto;">API: <span id="apiStatus">连接中...</span></span>
</div>

<script>
// ═══════════════════════════════════════════════
// 监控面板 JavaScript
// ═══════════════════════════════════════════════

const API_BASE = '/api/v1/agent-config';
let traceTab = 'list';
let refreshTimer = null;
let countdownTimer = null;
let countdown = 5;
let prevFingerprints = {};

// ── 初始化 ────────────────────────────────────

document.addEventListener('DOMContentLoaded', () => {
  fetchAll();
  startRefresh();
});

function startRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  if (countdownTimer) clearInterval(countdownTimer);

  refreshTimer = setInterval(() => {
    if (document.hidden) return; // skip polling when tab is hidden
    fetchAll();
    countdown = 5;
    updateCountdown();
  }, 5000);

  countdownTimer = setInterval(() => {
    if (document.hidden) return;
    countdown--;
    updateCountdown();
    if (countdown <= 0) countdown = 5;
  }, 1000);
}

function updateCountdown() {
  document.getElementById('refreshCountdown').textContent = countdown;
}

function forceRefresh() {
  countdown = 5;
  updateCountdown();
  fetchAll();
}

// ── 数据获取 ──────────────────────────────────

async function fetchAll() {
  try {
    await Promise.all([
      fetchFingerprints(),
      fetchTraceLinks(),
      fetchPlazaStatus(),
      fetchDashboard(),
    ]);
    document.getElementById('apiStatus').textContent = '✅ 已连接';
    document.getElementById('apiStatus').style.color = 'var(--accent2)';
    document.getElementById('statusDot').className = 'status-dot';
  } catch (e) {
    console.error('Fetch error:', e);
    document.getElementById('apiStatus').textContent = '❌ 连接失败';
    document.getElementById('apiStatus').style.color = 'var(--error)';
    document.getElementById('statusDot').className = 'status-dot error';
  }
}

async function fetchFingerprints() {
  try {
    const resp = await fetch(`${API_BASE}/monitoring/fingerprints?limit=10`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    renderFingerprints(data);
  } catch (e) {
    console.warn('Fingerprints fetch:', e.message);
  }
}

async function fetchTraceLinks() {
  try {
    const resp = await fetch(`${API_BASE}/monitoring/traces?limit=30`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    renderTraceLinks(data);

    // fetch topology separately
    const topoResp = await fetch(`${API_BASE}/monitoring/topology`);
    if (topoResp.ok) {
      const topoData = await topoResp.json();
      renderTopology(topoData);
    }
  } catch (e) {
    console.warn('Trace links fetch:', e.message);
  }
}

async function fetchPlazaStatus() {
  try {
    const resp = await fetch(`${API_BASE}/plaza/plazas`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    renderPlazaStatus(data);
  } catch (e) {
    console.warn('Plaza status fetch:', e.message);
  }
}

async function fetchDashboard() {
  try {
    const resp = await fetch(`${API_BASE}/monitoring/dashboard`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    renderDashboard(data);
  } catch (e) {
    console.warn('Dashboard fetch:', e.message);
  }
}

// ── 指纹渲染 ──────────────────────────────────

function renderFingerprints(data) {
  const fps = data.fingerprints || [];
  const stats = data.stats || {};
  const latest = fps.length > 0 ? fps[fps.length - 1] : null;

  if (latest) {
    updateFpValue('fpFalseUpgrade', latest.false_upgrade_rate, '%', 'p0', 'fpFalseUpgradeTrend');
    updateFpValue('fpMutationRate', latest.behavior_fingerprint_mutation_rate, '%', 'p0', 'fpMutationTrend');
    updateFpValue('fpAnomalyDepth', latest.anomaly_propagation_depth, '', 'p1', 'fpAnomalyDepthTrend');
    updateFpValue('fpPredError', latest.prediction_error_rate, '%', 'p1', 'fpPredErrorTrend');
    updateFpValue('fpResourcePct', latest.resource_increase_pct, '%', 'p2', 'fpResourceTrend');
    updateFpValue('fpEnergyPct', latest.energy_increase_pct, '%', 'p2', 'fpEnergyTrend');
    updateFpValue('fpPolicyLatency', latest.policy_evaluation_latency_ms, 'ms', 'p2', 'fpPolicyLatencyTrend');
    updateFpValue('fpStagnation', latest.evolution_stagnation_rate, '%', 'p2', 'fpStagnationTrend');

    document.getElementById('fpUpdated').textContent =
      '更新于 ' + new Date(latest.collected_at).toLocaleTimeString();
  }

  document.getElementById('statFingerprints').textContent = stats.total_collected || fps.length;
  document.getElementById('statAnomaly').textContent = stats.anomaly_detected ? '⚠️ 是' : '否';
  if (stats.anomaly_detected) {
    document.getElementById('statAnomaly').style.color = 'var(--error)';
  } else {
    document.getElementById('statAnomaly').style.color = 'var(--text)';
  }
}

function updateFpValue(id, value, suffix, cssClass, trendId) {
  const el = document.getElementById(id);
  if (value === undefined || value === null) { el.textContent = '—'; return; }
  const displayVal = typeof value === 'number' ? value.toFixed(3) : value;
  el.textContent = displayVal + suffix;
  el.className = 'value ' + cssClass;

  // Trend
  const trendEl = document.getElementById(trendId);
  if (trendEl && prevFingerprints[id] !== undefined) {
    const prev = prevFingerprints[id];
    if (value > prev) {
      trendEl.textContent = '↑ 上升';
      trendEl.className = 'trend up';
    } else if (value < prev) {
      trendEl.textContent = '↓ 下降';
      trendEl.className = 'trend down';
    } else {
      trendEl.textContent = '→ 持平';
      trendEl.className = 'trend';
    }
  }
  prevFingerprints[id] = value;
}

// ── Trace 链路渲染 ────────────────────────────

function renderTraceLinks(data) {
  const links = data.links || [];
  const stats = data.stats || {};

  document.getElementById('statTraces').textContent = stats.total_traces || links.length;
  document.getElementById('statNodes').textContent = stats.total_nodes || 0;

  const container = document.getElementById('traceListView');
  if (links.length === 0) {
    container.innerHTML = '<div style="color:var(--text-dim);text-align:center;padding:20px;">暂无链路数据</div>';
    return;
  }

  container.innerHTML = links.slice(0, 15).map(l => `
    <div class="trace-list-item">
      <span class="tid">${(l.trace_id || '').substring(0, 12)}...</span>
      <span class="type-badge ${getLinkTypeClass(l.link_type)}">${l.link_type}</span>
      <span class="meta">
        ${l.source_agent_id ? '← ' + l.source_agent_id.substring(0,8) : ''}
        ${l.target_agent_id ? '→ ' + l.target_agent_id.substring(0,8) : ''}
        ${l.latency_ms ? '· ' + l.latency_ms.toFixed(1) + 'ms' : ''}
        · ${new Date(l.created_at).toLocaleTimeString()}
      </span>
    </div>
  `).join('');
}

function getLinkTypeClass(type) {
  if (type && type.includes('plaza')) return 'plaza';
  if (type && type.includes('handoff')) return 'handoff';
  if (type && type.includes('task')) return 'task';
  if (type && type.includes('tool')) return 'tool';
  return '';
}

// ── 拓扑图渲染 ────────────────────────────────

function renderTopology(data) {
  const nodes = data.nodes || [];
  const links = data.links || [];
  const svg = document.getElementById('topoSvg');
  const rect = svg.parentElement.getBoundingClientRect();
  const w = rect.width || 400;
  const h = rect.height || 250;

  if (nodes.length === 0) {
    svg.innerHTML = '<text x="50%" y="50%" text-anchor="middle" fill="#8b949e" font-size="11">暂无拓扑数据</text>';
    return;
  }

  // Simple circular layout
  const cx = w / 2, cy = h / 2;
  const radius = Math.min(w, h) / 2 - 30;

  let html = '';
  // Links
  links.forEach((l, i) => {
    const si = nodes.findIndex(n => n.node_id === l.source);
    const ti = nodes.findIndex(n => n.node_id === l.target);
    if (si >= 0 && ti >= 0) {
      const sa = (si / nodes.length) * Math.PI * 2 - Math.PI / 2;
      const ta = (ti / nodes.length) * Math.PI * 2 - Math.PI / 2;
      const sx = cx + Math.cos(sa) * radius;
      const sy = cy + Math.sin(sa) * radius;
      const tx = cx + Math.cos(ta) * radius;
      const ty = cy + Math.sin(ta) * radius;
      html += `<line x1="${sx}" y1="${sy}" x2="${tx}" y2="${ty}" class="topo-link"/>`;
    }
  });

  // Nodes
  nodes.forEach((n, i) => {
    const angle = (i / nodes.length) * Math.PI * 2 - Math.PI / 2;
    const x = cx + Math.cos(angle) * radius;
    const y = cy + Math.sin(angle) * radius;
    const typeClass = n.node_type || 'agent';
    const r = 5;
    html += `<circle cx="${x}" cy="${y}" r="${r}" class="topo-node ${typeClass}"><title>${n.label}</title></circle>`;
    html += `<text x="${x + 8}" y="${y + 3}" class="topo-label">${(n.label || '').substring(0, 8)}</text>`;
  });

  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.innerHTML = html;
}

// ── Plaza 状态渲染 ────────────────────────────

function renderPlazaStatus(data) {
  const plazas = data.plazas || data || [];
  const container = document.getElementById('plazaPanel');

  if (!Array.isArray(plazas) || plazas.length === 0) {
    container.innerHTML = '<div style="color:var(--text-dim);text-align:center;padding:20px;">暂无活跃讨论</div>';
    return;
  }

  container.innerHTML = plazas.map(p => {
    const participants = p.participants ? Object.keys(p.participants).length : 0;
    const discussions = p.discussions ? Object.keys(p.discussions).length : 0;
    return `
      <div class="trace-list-item" style="border-left-color: var(--accent2);">
        <strong>${p.name || 'Unnamed Plaza'}</strong>
        <span class="meta">· ${participants} 参与者 · ${discussions} 讨论</span>
        <br><span class="meta" style="font-size:10px;">ID: ${(p.id || '').substring(0,8)}...</span>
      </div>
    `;
  }).join('');
}

// ── 仪表盘汇总渲染 ────────────────────────────

function renderDashboard(data) {
  const alerts = data.alerts || [];
  const alertContainer = document.getElementById('alertsPanel');
  document.getElementById('alertCount').textContent = alerts.length;

  if (alerts.length === 0) {
    alertContainer.innerHTML = '<div style="color:var(--accent2);text-align:center;padding:20px;">✅ 无告警</div>';
    return;
  }

  alertContainer.innerHTML = alerts.map(a => `
    <div class="alert-item ${a.priority || 'p1'}">
      <strong>[${(a.priority || 'P1').toUpperCase()}]</strong> ${a.message || a.type}
      <div class="time">${new Date(a.timestamp || a.time || Date.now()).toLocaleTimeString()}</div>
    </div>
  `).join('');

  if (data.anomaly_detected) {
    document.getElementById('statusDot').className = 'status-dot warn';
  }
}

// ── Tab 切换 ──────────────────────────────────

function switchTraceTab(tab) {
  traceTab = tab;
  document.querySelectorAll('#tracePanel .tab-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('traceListView').style.display = tab === 'list' ? 'block' : 'none';
  document.getElementById('traceTopoView').style.display = tab === 'topo' ? 'block' : 'none';
}
</script>
